  chest:'Chest', back:'Back', quads:'Quads', hamstrings:'Hamstrings', glutes:'Glutes',
  shoulders:'Shoulders', biceps:'Biceps', triceps:'Triceps', calves:'Calves',
  abs:'Abs', forearms:'Forearms', traps:'Traps'
};
/* Count logged HARD sets per muscle for a given week (warm-ups excluded). */
function weeklySetsByMuscle(week){
  const { plan } = getActivePlan();
  const out = {};
  if(!plan) return out;
  plan.days.forEach((day, di)=>{
    day.exercises.forEach(ex=>{
      const base = ex.sets.length + (state.extraSets[xkey(week, di, ex.id)] || 0);
      for(let i=0;i<base;i++){
        const l = getLog(week, di, ex.id, i);
        if(l && l.logged && l.type!=='WU'){          // myo-reps count, warm-ups don't
          out[ex.muscle] = (out[ex.muscle]||0) + 1;
        }
      }
    });
  });
  return out;
}

/* Which plan-day indices in THIS week are still ahead of the lifter, so the
   volume advice can project the full week instead of nagging mid-week about
   sets that are simply not done yet. Only meaningful for the current meso week;
   for past weeks every day is "done". */
function weekDayStatus(week){
  const { plan } = getActivePlan();
  if(!plan) return { remaining:[], isCurrent:false, complete:true };
  const isCurrent = mesoStart() ? (week === mesoWeekNow()) : (week === state.week);
  if(!isCurrent){
    // A past (or non-current) week: nothing is "still ahead".
    return { remaining:[], isCurrent:false, complete:true };
  }
  const todayWd = nowDate().getDay();               // 0=Sun..6=Sat
  const map = dayMap(week);                          // weekday per plan-day index
  // Order weekdays Mon-first so "remaining this week" respects a Mon-start week.
  const ord = wd => (wd===0 ? 7 : wd);
  const remaining = [];
  map.forEach((wd, di)=>{
    if(wd<0) return;                                 // unscheduled slot
    // A day is still ahead if its weekday is later in the week than today.
    if(ord(wd) > ord(todayWd)) remaining.push(di);
    // The day that falls on today counts as still-trainable unless every set is logged.
    else if(ord(wd) === ord(todayWd)){
      const day = plan.days[di];
      let planned=0, logged=0;
      if(day) day.exercises.forEach(ex=>{
        const n = ex.sets.length + (state.extraSets[xkey(week,di,ex.id)]||0);
        planned += n;
        for(let i=0;i<n;i++){ const l=getLog(week,di,ex.id,i); if(l&&l.logged) logged++; }
      });
      if(planned===0 || logged < planned) remaining.push(di);
    }
  });
  return { remaining, isCurrent:true, complete: remaining.length===0 };
}

/* Programmed (not yet logged) hard sets per muscle across the still-remaining
   days of the week. Lets the advice say "you're on track to reach X" rather
   than "you're under range" before the week is over. */
function remainingSetsByMuscle(week){
  const { plan } = getActivePlan();
  const out = {};
  if(!plan) return out;
  const { remaining } = weekDayStatus(week);
  remaining.forEach(di=>{
    const day = plan.days[di]; if(!day) return;
    day.exercises.forEach(ex=>{
      const n = ex.sets.length + (state.extraSets[xkey(week, di, ex.id)] || 0);
      // Count only sets NOT already logged (a partially-done today shouldn't double-count).
      let doneOnDay = 0;
      for(let i=0;i<n;i++){ const l=getLog(week,di,ex.id,i); if(l&&l.logged&&l.type!=='WU') doneOnDay++; }
      const left = Math.max(0, n - doneOnDay);
      if(left>0) out[ex.muscle] = (out[ex.muscle]||0) + left;
    });
  });
  return out;
}

/* Projected end-of-week volume = logged so far + still scheduled. This is what
   the mid-week advice reasons about. */
function projectedSetsByMuscle(week){
  const done = weeklySetsByMuscle(week);
  const left = remainingSetsByMuscle(week);
  const out = Object.assign({}, done);
  for(const m in left) out[m] = (out[m]||0) + left[m];
  return out;
}

/* Specialisation priorities: muscles the lifter is actively trying to GROW.
   Everything else is treated as maintenance — which on a cut needs far fewer
   sets (holding muscle takes less volume than building it). Stored per profile. */
function isPriorityMuscle(m){ return !!(state.specMuscles && state.specMuscles[m]); }
function togglePriorityMuscle(m){
  if(!state.specMuscles) state.specMuscles = {};
  if(state.specMuscles[m]) delete state.specMuscles[m];
  else state.specMuscles[m] = true;
  saveState(); render();
}
/* Which muscles the active plan even trains — so we don't flag what isn't programmed */
function plannedMuscles(){
  const { plan } = getActivePlan();
  const s = new Set();
  if(plan) plan.days.forEach(d=>d.exercises.forEach(e=>s.add(e.muscle)));
  return [...s];
}
function volStatus(m, sets){
  const L = VOL_LANDMARKS[m]; if(!L) return null;
  if(sets === 0) return 'none';
  if(sets < L.mev) return 'under';
  if(sets < L.lo)  return 'low';
  if(sets <= L.hi) return 'good';
  if(sets <= L.mrv) return 'high';
  return 'over';
}
/* Plateau detection: no e1RM improvement across the last N logged sessions. */
function plateaus(){
  const recs = allRecords();
  const out = [];
  Object.keys(recs).forEach(name=>{
    const r = recs[name];
    const sess = (r.sessions||[]).filter(s=>s.sets && s.sets.length);
    if(sess.length < 4) return;
    const best = s => Math.max(...s.sets.filter(Boolean).map(x=>e1rm(x[0]||0, x[1]||0)));
    const recent = sess.slice(-4).map(best);
    const peak = Math.max(...recent);
    const earlierPeak = Math.max(...sess.slice(0,-4).map(best), 0);
    // stalled if the last 4 sessions never beat what came before
    if(earlierPeak > 0 && peak <= earlierPeak * 1.005){
      out.push({ name, sessions: recent.length, peak: Math.round(peak), prior: Math.round(earlierPeak) });
    }
  });
  return out.slice(0, 4);
}
function lastWeekLog(di,exId,si){
  if(state.week<=1) return null;
  // If the exercise in this slot was just swapped in THIS week, its prior-week
  // log belongs to the OLD exercise/machine, so don't surface it as this one's
  // "last time" — that's what made a swapped machine keep the old load.
  try{
    const gp = getActivePlan();
    const ex = gp && gp.plan && gp.plan.days[di] && gp.plan.days[di].exercises.find(e=>e.id===exId);
    if(ex && ex.freshWeek === state.week) return null;
  }catch(e){}
  const l = state.logs[`${state.active.id}|w${state.week-1}|d${di}|${exId}|${si}`];
  return (l && l.logged)? l : null;
}

/* Direction of a lift's best-e1RM over its last few sessions: 'up', 'flat', or
   'down'. Early read on momentum before the 3-session stall trigger fires. */
function e1rmTrend(exName){
  const rec = allRecords()[exName];
  if(!rec || !rec.sessions || rec.sessions.length < 2) return null;
  const bests = rec.sessions.slice(-3).map(ss=>{
    let b=null; (ss.sets||[]).forEach(s=>{ if(s&&s[2]!=='WU'&&s[2]!=='BO'){const sc=e1rm(s[0],parseReps(s[1])); if(sc!=null&&(b==null||sc>b))b=sc;} });
    return b;
  }).filter(v=>v!=null);
  if(bests.length < 2) return null;
  const first=bests[0], last=bests[bests.length-1];
  if(last > first + 0.05) return 'up';
  if(last < first - 0.05) return 'down';
  return 'flat';
}

/* The most recent COMPLETED session of a lift (by the records engine's true
   timeline, so a mid-week PR on an earlier day counts). Returns the working
   sets as "34kg × 11, 11" plus that session's best e1RM, or null if none. */
function lastSessionSummary(exName, unit){
  const rec = allRecords()[exName];
  if(!rec || !rec.sessions || !rec.sessions.length) return null;
  // Skip a session that is the one being logged right now (all-empty) — the
  // engine only feeds logged sets, so the last entry is always a real past one.
  const sess = rec.sessions[rec.sessions.length-1];
  const work = (sess.sets||[]).filter(s=>s && s[0]!=null && s[2]!=='WU');
  if(!work.length) return null;
  const reps = work.map(s=>s[1]).join(', ');
  const w = work[0][0];
  const same = work.every(s=>s[0]===w);
  const wLabel = same ? fmtW(w,unit) : (fmtW(Math.min(...work.map(s=>s[0])),unit)+'–'+fmtW(Math.max(...work.map(s=>s[0])),unit));
  let best=null;
  work.forEach(s=>{ const sc=e1rm(s[0],parseReps(s[1])); if(sc!=null&&(best==null||sc>best))best=sc; });
  return { wLabel, reps, e1rm: best, date: sess.date };
}

/* End-of-session recap: sets done, total tonnage, and how many lifts hit a new
   e1RM peak today. A small hit of positive feedback that also confirms the work
   landed. PR detection compares today's best e1RM per lift to that lift's best
   across all PRIOR sessions. */
function sessionSummary(wk, di){
  if(wk==null) wk = state.week;
  if(di==null) di = state.dayIdx;
  const day = getActivePlan().plan.days[di];
  if(!day) return '';
  let sets=0, tonnage=0, prs=[];
  day.exercises.forEach(ex=>{
    // Count every set actually LOGGED for this session, independent of the
    // current set-count model (engine-added sets, time-budget compression) —
    // logged entries only exist where a row was rendered, and 30 is a safe
    // ceiling no real exercise reaches.
    let todayBest=null;
    for(let i=0;i<30;i++){
      const l=getLog(wk,di,ex.id,i);
      if(l && l.logged && l.type!=='WU'){
        sets++;
        const reps=parseReps(l.r);
        if(l.w!=null && reps){ tonnage += l.w*reps; const sc=e1rm(l.w,reps); if(sc!=null&&(todayBest==null||sc>todayBest))todayBest=sc; }
      }
    }
    if(todayBest!=null){
      const rec=allRecords()[ex.name];
      if(rec && rec.sessions){
        let priorBest=null;
        rec.sessions.slice(0,-1).forEach(ss=>(ss.sets||[]).forEach(s=>{ if(s&&s[2]!=='WU'){const sc=e1rm(s[0],parseReps(s[1])); if(sc!=null&&(priorBest==null||sc>priorBest))priorBest=sc;} }));
        if(priorBest==null || todayBest > priorBest + 0.05) prs.push(ex.name);
      }
    }
  });
  if(!sets) return '';
  const unit = day.exercises[0]?.unit || 'kg';
  const bits = [`<b>${sets}</b> sets`, `<b>${Math.round(tonnage).toLocaleString()}</b> ${unit} moved`];
  if(prs.length) bits.push(`<b class="pr">${prs.length} new PR${prs.length>1?'s':''}</b> \u{1F389}`);
  return `<div class="se-sum">${bits.join(' \u00b7 ')}${prs.length?`<div class="se-prs">${prs.join(', ')}</div>`:''}</div>`;
}

/* Every completed session, newest first — the discoverable home for past-week
   recaps (previously you had to find the right week + day on the workout screen
   and scroll to the bottom). Reuses sessionSummary, which returns '' for a day
   with nothing logged, so only real sessions show. Tapping one reopens it. */
function recentSessionsHtml(){
  const { plan } = getActivePlan();
  if(!plan) return '';
  const maxW = mesoStart() ? mesoWeeks() : Math.max(state.week, 1);
  const curW = mesoStart() ? mesoWeekNow() : state.week;
  const out = [];
  for(let w=maxW; w>=1 && out.length<8; w--){
    for(let di=0; di<plan.days.length && out.length<8; di++){
      const sum = sessionSummary(w, di);
      if(sum) out.push({ w, di, name:plan.days[di].name, sum });
    }
  }
  if(!out.length) return '';
  const rows = out.map(s=>{
    const rel = s.w===curW ? 'This week' : s.w===curW-1 ? 'Last week' : `Week ${s.w}`;
    return `<button class="sess-row" onclick="jumpToSession(${s.w},${s.di})">
      <div class="sess-hd"><span class="sess-day">${s.name}</span><span class="sess-wk">${rel}</span><span class="sess-go">\u203A</span></div>
      ${s.sum}
    </button>`;
  }).join('');
  return `<div class="weekcard">
    <div class="top"><span class="eyebrow">Recent sessions</span><span class="tag2">HISTORY</span></div>
    <div class="sub" style="font-size:12px; color:var(--text-faint)">Every completed workout, newest first \u2014 tap one to reopen it.</div>
    <div class="sess-list">${rows}</div>
  </div>`;
}
function jumpToSession(w, di){
  w = Math.max(1, Math.min(w, mesoStart()? mesoWeeks() : w));
  state.week = w; state.dayIdx = di; state.tab = 'workout'; state.weekOpen = false;
  saveState(); render();
}

/* Plate breakdown per side for a barbell load. Assumes a 20 kg / 45 lb bar and
   standard gym plates; shows what to load on ONE side. Returns '' for machines
   or loads at/under the bar. */
/* Plate breakdown per side for a BARBELL load. Only meaningful when you're
   actually loading plates onto a bar — a machine stack or a dumbbell has no
   "per side" to compute, and showing one there is actively misleading. */
function plateMath(total, unit, exName){
  if(exName && equipOf(exName) !== 'barbell') return '';
  if(total==null || !(total>0)) return '';
  const bar = unit==='lbs' ? 45 : 20;
  if(total < bar) return '';
  let perSide = (total - bar) / 2;
  if(perSide <= 0) return '';
  const plates = unit==='lbs' ? [45,35,25,10,5,2.5] : [25,20,15,10,5,2.5,1.25];
  const out = [];
  let rem = perSide;
  for(const p of plates){
    let c = Math.floor(rem / p + 1e-9);
    if(c>0){ out.push(c>1? `${c}×${p}` : `${p}`); rem = +(rem - c*p).toFixed(3); }
  }
  if(rem > 0.01) return ''; // can't make it with standard plates — skip rather than mislead
  return out.length ? `Per side: ${out.join(' + ')}` : '';
}
const esc = s => String(s).replace(/'/g,"\\'").replace(/"/g,'&quot;');
const parseReps = r => { const m = String(r??'').match(/\d+/); return m? +m[0] : null; };
/* A logged load of 0 means the movement is loaded by bodyweight alone, so say
   that rather than the meaningless "0 kg". */
const fmtW = (w,u) => w==null? '—' : (+w===0 ? 'bodyweight' : `${w} ${u}`);
const roundInc = (v,inc)=> Math.round(v/inc)*inc;

function exIndex(){
  const map = {};
  const walk = plans => plans.forEach(p=>p.days.forEach((d,di)=>d.exercises.forEach(ex=>{ map[`${p.id}|${ex.id}`]={ex, planId:p.id}; })));
  walk(PREBUILT); walk(state.templates.custom);
  return map;
}

/* ============ RECORDS ENGINE ============ */
function allRecords(){
  const rec = {};
  /* seq orders sessions on a real timeline. Imported history keeps its own
     dates; sessions from this mesocycle are ordered by week then day and always
     sort after imported history. Without this the engine could anchor to a
     stale session whenever anything was logged out of order. */
  const feed = (name, muscle, unit, date, sets, note, seq)=>{
    if(!rec[name]) rec[name] = { name, muscle, unit, sessions:[], totalSets:0, best:null, lastDate:date };
    const R = rec[name];
    R.sessions.push({ date, sets, note, seq: seq==null? 0 : seq });
    sets.forEach(([w,r,t])=>{
      if(t==='WU') return;
      R.totalSets++;
      const reps = parseReps(r);
      const score = e1rm(w, reps) ?? (reps||0)*0.01;
      if(!plausibleLoad(w)) return;   // a typo must never become an all-time best
      if(!R.best || score > R.best.score) R.best = { w, r, reps, score, date };
    });
  };
  for(const name in HISTORY){
    const h = HISTORY[name];
    h.sessions.forEach(s=> feed(name, h.muscle, h.unit, s.date, s.sets, s.note, Date.parse(s.date)||0));
  }
  const idx = exIndex();
  const byEx = {};
  for(const k in state.logs){
    const l = state.logs[k]; if(!l.logged) continue;
    const [planId,wk,dd,exId,si] = k.split('|');
    const meta = idx[`${planId}|${exId}`]; if(!meta) continue;
    const gk = `${meta.ex.name}|${wk}|${dd}`;
    if(!byEx[gk]) byEx[gk] = { name:meta.ex.name, muscle:meta.ex.muscle, unit:meta.ex.unit, wk, dd, sets:[] };
    byEx[gk].sets[+si.replace(/\D/g,'')||+si] = [l.w, l.r, l.type||'', (l.rir==null? null : l.rir)];
  }
  Object.values(byEx).forEach(g=>{
    const wkNum = parseInt(String(g.wk).replace(/\D/g,''),10) || 0;
    const dayNum = parseInt(String(g.dd).replace(/\D/g,''),10) || 0;
    // 4e12 sits far beyond any real Date.parse value, so this meso always follows history.
    feed(g.name, g.muscle, g.unit, `This meso · ${g.wk.toUpperCase()}`, g.sets.filter(Boolean),
         undefined, 4e12 + wkNum*1000 + dayNum);
  });
  // Put every lift's sessions on a true timeline before anything reads them.
  Object.values(rec).forEach(R=>{
    R.sessions.sort((a,b)=> a.seq - b.seq);
    const last = R.sessions[R.sessions.length-1];
    if(last) R.lastDate = last.date;
  });
  return rec;
}

/* ============ AI COACH ============ */
/* A logged load has to be physically plausible to count. Catches fat-finger
   typos (1000 kg bench) that would otherwise become the target AND stick in the
   all-time "best" forever. Generous ceiling — real world-record lifts are well
   under this — so it only ever rejects obvious slips. */
function plausibleLoad(w){
  if(w==null) return true;              // bodyweight / unloaded is fine
  const n = +w;
  if(!isFinite(n) || n < 0) return false;
  return n <= 600;                       // kg or lbs, both comfortably covered
}

/* Is this lift being trained as deliberate low-rep STRENGTH work rather than
   failing at a hypertrophy weight? Signature: reps consistently well under the
   hypertrophy floor while the LOAD is holding or climbing across sessions.
   A lifter grinding heavy triples is progressing, not stalling — telling them
   to deload and "rebuild to 12" would be actively wrong coaching. */
function isStrengthBlock(rec, t){
  const sess = (rec && rec.sessions || []).slice(-3);
  if(sess.length < 2) return false;
  const info = sess.map(ss=>{
    const work = (ss.sets||[]).filter(s=>s && s[2]!=='WU' && s[2]!=='BO' && plausibleLoad(s[0]) && parseReps(s[1])!=null);
    if(!work.length) return null;
    const maxW = Math.max(...work.map(s=>s[0]).filter(v=>v!=null));
    const maxR = Math.max(...work.map(s=>parseReps(s[1])));
    return { maxW, maxR };
  }).filter(Boolean);
  if(info.length < 2) return false;
  // every session clearly below the hypertrophy floor (heavy, low-rep)
  const allLowRep = info.every(x=>x.maxR <= Math.max(1, t.lo - 3));
  if(!allLowRep) return false;
  // and the load is not collapsing — holding or rising means it is intentional
  const first = info[0].maxW, last = info[info.length-1].maxW;
  return last >= first - 0.01;
}

function anchorOf(sess, t){
  // Warm-ups and back-off sets are intentionally submaximal, so neither should
  // define the working-weight target. Top sets and normal working sets do.
  // Absurd weights (fat-finger typos like 1000 kg) are excluded so a slip can
  // never become the target or a permanent "best".
  const work = sess.sets.filter(s=>s[2]!=='WU' && s[2]!=='BO' && plausibleLoad(s[0]));
  /* Anchor = heaviest working weight that produced viable reps (>= floor − 2).
     A failed heavy attempt (30 lbs × 6) or drop-set back-offs (5 kg after 7.5 kg)
     therefore never set the target. Falls back to the modal weight. */
  const weights = [...new Set(work.filter(s=>s[0]!=null).map(s=>s[0]))].sort((a,b)=>b-a);
  let wBase = null;
  for(const w of weights){
    const reps = work.filter(s=>s[0]===w).map(s=>parseReps(s[1])).filter(v=>v!=null);
    if(reps.length && Math.max(...reps) >= (t? t.lo-2 : 0)){ wBase = w; break; }
  }
  if(wBase==null && weights.length){
    const freq = {};
    work.forEach(s=>{ if(s[0]!=null) freq[s[0]]=(freq[s[0]]||0)+1; });
    let best = null;
    Object.keys(freq).forEach(w=>{ if(best==null || freq[w]>freq[best] || (freq[w]===freq[best] && +w>+best)) best = w; });
    wBase = +best;
  }
  // A set only counts toward the target if it has a real rep number logged.
  // Blank/unlogged reps used to be read as 1, which poisoned the suggestion.
  const anchor = work.filter(s=> (s[0]==null || s[0]===wBase) && parseReps(s[1])!=null);
  const repsArr = anchor.map(s=>parseReps(s[1])).filter(v=>v!=null);
  return { wBase, anchor, repsArr,
    minR: repsArr.length? Math.min(...repsArr):null,
    maxR: repsArr.length? Math.max(...repsArr):null };
}
/* Three consecutive sessions at the same load with no gain in total reps.
   Two sessions can be noise; three is a trend worth acting on. */
function stallInfo(rec, t){
  const sess = (rec.sessions||[]).slice(-3);
  if(sess.length < 3) return null;
  const a = sess.map(x=>anchorOf(x, t));
  if(a.some(x=>x.wBase==null || !x.repsArr.length)) return null;
  if(!(a[0].wBase === a[1].wBase && a[1].wBase === a[2].wBase)) return null;
  const total = x => x.repsArr.reduce((sum,r)=>sum+r, 0);
  // Any rep-total improvement over the window means it is still working.
  if(total(a[2]) > total(a[0])) return null;
  // e1RM guard: if the BEST single set anywhere in the window beats the first
  // session's best, the lifter did improve (e.g. one big high-rep day between
  // two ordinary ones), so it is NOT a stall — don't prescribe a deload off a
  // matching-looking last set.
  const bestE = x => Math.max(...x.repsArr.map(r=>e1rm(x.wBase, r)||0));
  if(bestE(a[1]) > bestE(a[0]) + 0.05 || bestE(a[2]) > bestE(a[0]) + 0.05) return null;
  // Already at the top of the range is a ceiling hit, not a stall — case 1 owns it.
  if(a[2].minR >= t.capR) return null;
  return { w:a[2].wBase, reps:total(a[2]) };
}

/* ============ WARM-UP RAMP CALCULATOR ============
   Evidence note: warm-up prescriptions are practice-based (there is no strong
   hypertrophy meta-analysis on ramp schemes); the goal is to potentiate and
   rehearse the movement WITHOUT accumulating fatigue, so the heavier ramp sets
   keep reps low. Weights recalculate off the engine's target working weight
   (aiTarget.w), so they track your strength automatically. The ramp is guidance
   only — a read-only strip — and the progression engine already ignores any set
   tagged WU, so nothing here can pollute a suggestion. */
const WARMUP_SCHEMES = {
  classic: { label:'3-set', sets:[[0.5,5],[0.7,3],[0.9,1]] },   // evidence-aligned default
  short:   { label:'2-set', sets:[[0.6,4],[0.85,2]] },
  high:    { label:'4-set', sets:[[0.4,5],[0.6,4],[0.75,2],[0.9,1]] },
};
function warmupRamp(workW, schemeKey, unit){
  if(workW==null || !(workW>0)) return [];
  const s = WARMUP_SCHEMES[schemeKey] || WARMUP_SCHEMES.classic;
  const inc = unit==='lbs'? 5 : 2.5;                 // plate-friendly rounding
  return s.sets
    .map(pr=>({ pct:pr[0], reps:pr[1], w: roundInc(workW*pr[0], inc) }))
    .filter(x=> x.w>0 && x.w < workW);               // never show a "warm-up" at/above the working weight
}
/* Only compound / primary lifts offer a ramp by default; the per-exercise
   toggle overrides this in either direction and is remembered. */
function isCompoundLift(name){
  return /squat|deadlift|bench press|overhead press|shoulder press|\brows?\b|pulldown|pull-?up|chin-?up|\bdips?\b|lunges?|hip thrust|good morning|clean|romanian|\bpress\b/i.test(String(name||''));
}
function warmupShown(ex){
  const pref = (state.warmupPref||{})[ex.id];
  return pref==='on' || (pref!=='off' && isCompoundLift(ex.name));
}
function toggleWarmup(exId){
  if(!state.warmupPref) state.warmupPref = {};
  let name='';
  try{ const gp=getActivePlan(); const ex=(gp.plan.days[state.dayIdx].exercises||[]).find(e=>e.id===exId); if(ex) name=ex.name; }catch(_){}
  const shownNow = state.warmupPref[exId]==='on' || (state.warmupPref[exId]!=='off' && isCompoundLift(name));
  state.warmupPref[exId] = shownNow ? 'off' : 'on';
  saveState(); render();
}
function cycleWarmupScheme(){
  const order = ['classic','short','high'];
  const i = order.indexOf(state.warmupScheme||'classic');
  state.warmupScheme = order[(i+1)%order.length];
  saveState(); render();
}
function warmupStripHtml(ex, ai){
  const shown = warmupShown(ex);
  if(!shown){
    if(!ai || ai.w==null) return ''; // nothing to base a ramp on and not asked for
    return `<button class="wu-add" onclick="toggleWarmup('${ex.id}')">+ Add warm-up sets</button>`;
  }
  // Shown (either a compound by default, or the user explicitly turned it on).
  // If there's no working weight yet, say so instead of rendering nothing —
  // the previous silent-empty return is what made "add warm-up" look broken.
  if(!ai || ai.w==null || !(ai.w>0)){
    return `<div class="wu-strip wu-empty">
      <div class="wu-top">
        <div class="wu-lead"><span>Warm-up</span><span class="wu-sub">log a working weight first, then the ramp appears</span></div>
        <button class="wu-x" onclick="toggleWarmup('${ex.id}')" title="Hide warm-up">\u00d7</button>
      </div></div>`;
  }
  const ramp = warmupRamp(ai.w, state.warmupScheme||'classic', ex.unit);
  if(!ramp.length){
    // Working weight is too light for percentage warm-ups to separate out (e.g.
    // an 8 kg lateral raise). Offer a single light back-off set rather than
    // nothing, so the toggle always produces something visible.
    const inc = ex.unit==='lbs'? 5 : 2.5;
    const light = roundInc(ai.w*0.5, inc);
    const one = light>0 && light<ai.w
      ? `<span class="wu-set">${fmtW(light,ex.unit)}<span class="wx"> × ${ (WARMUP_SCHEMES[state.warmupScheme]||WARMUP_SCHEMES.classic).sets[0][1] }</span></span>`
      : `<span class="wu-note">This lift is light enough to warm up with 1 easy set of the working weight.</span>`;
    return `<div class="wu-strip">
      <div class="wu-top">
        <div class="wu-lead"><span>Warm-up</span><span class="wu-sub">light lift \u2014 one easy set is plenty</span></div>
        <button class="wu-x" onclick="toggleWarmup('${ex.id}')" title="Hide warm-up sets">\u00d7</button>
      </div>
      <div class="wu-sets">${one}</div>
    </div>`;
  }
  const chips = ramp.map(s=>`<span class="wu-set">${fmtW(s.w,ex.unit)}<span class="wx"> × ${s.reps}</span></span>`).join('<span class="wu-arrow">\u203a</span>');
  const label = (WARMUP_SCHEMES[state.warmupScheme]||WARMUP_SCHEMES.classic).label;
  const n = ramp.length;
  return `<div class="wu-strip">
    <div class="wu-top">
      <div class="wu-lead wu-tap" onclick="toggleWuOpen('${ex.id}')"><span>Warm-up \u2304</span><span class="wu-sub">ease in before your top set</span></div>
      <button class="wu-scheme" onclick="cycleWarmupScheme()" title="Warm-up length — tap to switch between 2, 3 and 4 sets">${n} sets \u2304</button>
      <button class="wu-x" onclick="toggleWarmup('${ex.id}')" title="Hide warm-up sets">\u00d7</button>
    </div>
    <div class="wu-sets">${chips}</div>
  </div>`;
}

/* Warm-up is only relevant for the ~60 seconds before your first working set,
   but expanded it was the tallest block on the card and pushed the actual sets
   below the fold. So it now collapses to ONE summary line carrying the same
   information (how many ramp sets, and the range they span). Tap to expand the
   full chips + scheme switch. Collapsed is the default: the ramp weights are a
   glance, not a decision. */
var wuOpen = {};
function toggleWuOpen(exId){ wuOpen[exId] = !wuOpen[exId]; render(); }
function warmupBlockHtml(ex, ai){
  // Not shown at all, or nothing to ramp from -> keep the existing behaviour.
  if(!warmupShown(ex)) return warmupStripHtml(ex, ai);
  if(!ai || ai.w==null || !(ai.w>0)) return warmupStripHtml(ex, ai);
  if(wuOpen[ex.id]) return warmupStripHtml(ex, ai);
  const ramp = warmupRamp(ai.w, state.warmupScheme||'classic', ex.unit);
  if(!ramp.length) return warmupStripHtml(ex, ai);   // light-lift single-set case
  const first = ramp[0], last = ramp[ramp.length-1];
  const span = ramp.length>1
    ? `${fmtW(first.w,ex.unit)} \u2192 ${fmtW(last.w,ex.unit)}`
    : `${fmtW(first.w,ex.unit)}`;
  return `<button class="wu-line" onclick="toggleWuOpen('${ex.id}')">
    <span class="wl-l">Warm-up</span>
    <span class="wl-v">${ramp.length} sets \u00b7 ${span}</span>
    <span class="wl-c">\u203a</span>
  </button>`;
}

/* ============ PLATEAU PROMPT (3 actions) ============
   When a lift stalls 3 sessions (stallInfo), the user picks one exit rather than
   the engine forcing a deload. Pure + testable; aiTarget just calls this.
     A — deload ~10% + 3-second eccentric  (clears fatigue, adds eccentric tension)
     B — rotate the movement for a 4-week block (refresh the pattern)
     C — widen the rep range (accumulate reps at load before adding weight) */
/* The exit-move catalog. A/B/C are the original load-focused fixes; E/V+/V-/H
   were added so the diagnosis can route a stall to the RIGHT lever — effort,
   volume up, volume down, or (in a deficit) simply holding. */
const PLATEAU_MOVES = {
  'A':  'Deload 10%<br>+ 3s eccentric',
  'B':  'Rotate<br>4-wk block',
  'C':  'Widen<br>rep range',
  'E':  'Push effort<br>to 0\u20131 RIR',
  'V+': 'Add a set<br>more volume',
  'V-': 'Trim a set<br>less volume',
  'H':  'Hold<br>maintain',
};
/* Net bodyweight direction over the recent weigh-ins (for the deficit reframe). */
function weightTrendDown(){
  const wi = state.weighIns || [];
  if(wi.length < 2) return null;
  const recent = wi.slice(-6);
  return recent[recent.length-1].v < recent[0].v - 0.1;
}
/* Diagnose WHY a lift stalled and recommend the matching fix. Reads only signals
   we already track: diet phase, recovery feedback, this muscle's weekly volume vs
   its MEV/MRV landmarks, recent working-set RIR, and where we are in the block.
   Returns a cause, a headline, the recommended move, and the moves worth offering
   (recommended first). Pure and testable — the UI and aiTarget both read it. */
function plateauDiagnosis(ex, di){
  const L = VOL_LANDMARKS[ex.muscle];
  // Programmed weekly sets for this muscle (what's SCHEDULED, not what's been
  // logged so far) — the volume-landmark question is about the plan, and using
  // mid-week logged counts would falsely read as "under MEV" before you've
  // trained. Sum template sets + any added sets across every day.
  let sets = 0;
  const _gp = getActivePlan();
  if(_gp && _gp.plan) _gp.plan.days.forEach((day,dd)=>day.exercises.forEach(e=>{
    if(e.muscle===ex.muscle) sets += e.sets.length + (state.extraSets[xkey(state.week,dd,e.id)]||0);
  }));
  const rec = weekRecovery(state.week);
  const rir = recentWorkingRIR(ex.name);
  const dp = (typeof calcPlan==='function') ? calcPlan(state.stats||{}) : null;
  const cutting = !!(dp && (dp.goal==='Cut' || (dp.dailyDelta!=null && dp.dailyDelta < -50)));
  const jointPain = (rec.reasons||[]).some(r=>/joint/i.test(r));
  const lateMeso = mesoStart() ? (state.week >= mesoWeeks()-1) : false;
  const mev = L? L.mev : null, mrv = L? L.mrv : null;
  const mLbl = MUSCLE_LABEL[ex.muscle] || ex.muscle;

  let cause, headline, recommend, moves;
  if(cutting){
    cause='cut';
    const dropping = weightTrendDown();
    headline = `You\u2019re in a fat-loss phase${dropping? ' and your bodyweight is dropping':''} \u2014 a lift stalling here is expected, not a training fault.`;
    recommend='H'; moves=['H','C','A'];
  } else if(rec.tone==='down' || (rir && rir.avg<=0.5) || lateMeso){
    cause='fatigue';
    const bits=[];
    if(rec.tone==='down') bits.push('recovery feedback flagged concerns');
    if(rir && rir.avg<=0.5) bits.push(`you\u2019ve been grinding near failure (~${rir.avg} RIR)`);
    if(lateMeso) bits.push('you\u2019re deep into the block');
    headline = `Looks like accumulated fatigue \u2014 ${bits.join(', ') || 'the stall fits a recovery problem'}. Back off before pushing.`;
    recommend='A'; moves=['A','V-','B'];
  } else if(L && sets>0 && sets < mev){
    cause='undervolume';
    headline = `${mLbl} is below its minimum effective volume this week (${sets} vs ~${mev} sets) \u2014 the stall is likely too little stimulus, not too much.`;
    recommend='V+'; moves=['V+','E','C'];
  } else if(L && (sets >= mrv || jointPain)){
    cause='overvolume';
    headline = jointPain
      ? `You flagged joint pain and ${mLbl} volume is high (${sets} sets) \u2014 more load isn\u2019t the answer.`
      : `${mLbl} is at or past its recoverable ceiling (${sets} vs ~${mrv} sets) \u2014 adding more will dig the hole deeper.`;
    recommend='V-'; moves=['V-','A','B'];
  } else if(rir && rir.avg>=2 && rir.count>=2){
    cause='effort';
    headline = `You\u2019ve got reps left in the tank (~${rir.avg} RIR) but the load isn\u2019t moving \u2014 this reads as an effort problem, not fatigue.`;
    recommend='E'; moves=['E','C','A'];
  } else {
    cause='stale';
    headline = `Recovery\u2019s fine and volume\u2019s in range, but this lift has been flat for three sessions \u2014 the pattern has gone stale.`;
    recommend='B'; moves=['B','C','A'];
  }
  return { cause, headline, recommend, moves };
}
function plateauSuggestion(act, wBase, t, unit, anchor){
  const rnd = v => v==null? null : (unit==='lbs'? roundInc(v,5) : roundInc(v,0.5));
  const n = Array.isArray(anchor)? anchor.length : (anchor||1);
  const fill = v => Array.from({length: Math.max(1,n)}, ()=>v);
  if(act==='H'){
    return { plateau:true, stalled:true, act:'H', w:wBase, reps:fill(t.lo), sets:n,
      text:`Hold ${fmtW(wBase,unit)} \u2014 maintaining strength in a deficit is the win`,
      why:`In a fat-loss phase your body has less fuel and recovery to add load, so a flat lift is normal and healthy. Keep ${fmtW(wBase,unit)}, train hard, and judge this block by holding strength while you lean out \u2014 not by PRs.` };
  }
  if(act==='E'){
    return { plateau:true, stalled:true, act:'E', w:wBase, reps:fill(t.lo), sets:n,
      text:`Push ${fmtW(wBase,unit)} to 0\u20131 RIR \u2014 or add lengthened partials`,
      why:`Your recent sets left reps in the tank, so the load has room to move with more effort. Take the last set to 0\u20131 RIR, and on the final set add a few lengthened partials (extra reps in the stretched position after you can\u2019t complete full reps) \u2014 a strong, low-fatigue way to add stimulus at the same weight.` };
  }
  if(act==='V+'){
    return { plateau:true, stalled:true, act:'V+', w:wBase, reps:fill(t.lo), sets:n,
      text:`Add a set at ${fmtW(wBase,unit)} \u2014 this muscle is under-stimulated`,
      why:`This muscle\u2019s weekly sets are below the minimum that reliably drives growth, so the fix is more stimulus, not a deload. Add a working set here (or on another exercise for this muscle) and hold the load \u2014 give the added volume a couple of weeks to show.` };
  }
  if(act==='V-'){
    return { plateau:true, stalled:true, act:'V-', w:wBase, reps:fill(t.lo), sets:n,
      text:`Trim a set at ${fmtW(wBase,unit)} \u2014 you\u2019re past what you can recover`,
      why:`Weekly volume for this muscle is at or over what you can recover from, so extra sets are adding fatigue without adding growth. Drop a set (or swap to a joint-friendlier variation) and hold the load \u2014 recovering the stimulus you already do often restarts progress.` };
  }
  if(act==='B'){
    return { plateau:true, stalled:true, act:'B', w:wBase, reps:fill(t.lo), sets:n,
      text:`Plateau — rotate this lift for a 4-week block`,
      why:`${fmtW(wBase,unit)} has stalled for three sessions. Cycling the movement out for about four weeks and swapping a close variation refreshes the pattern while still training the muscle; you return to it stronger.` };
  }
  if(act==='C'){
    const lo2 = Math.max(1, t.lo-2);
    return { plateau:true, stalled:true, act:'C', w:wBase, reps:fill(lo2), sets:n,
      text:`Plateau — widen to ${lo2}\u2013${t.capR} reps @ ${fmtW(wBase,unit)}`,
      why:`${fmtW(wBase,unit)} has stalled. Widening the rep range gives more room to add reps at the same load before the weight goes up \u2014 often enough to break the stall without deloading.` };
  }
  const inc = unit==='lbs'? t.incLb : t.incKg;
  const cut = unit==='lbs'? roundInc(Math.max(inc, wBase*0.10),5) : roundInc(Math.max(inc, wBase*0.10),0.5);
  const nw = rnd(Math.max(0, wBase - cut));
  return { plateau:true, stalled:true, act:'A', w:nw, reps:fill(t.lo+2), sets:n,
    text:`Plateau — drop to ${nw!=null? nw+' '+unit : 'one pin lighter'}, 3-sec eccentrics, rebuild to ${t.capR}`,
    why:`${fmtW(wBase,unit)} has not moved in three sessions. Cutting about 10% and controlling a 3-second lowering phase clears fatigue and adds eccentric tension without losing your record.` };
}

/* ============ SET-EXECUTION TAGS ============
   Tap the set plate to mark what the set was, so analytics separate true heavy
   working volume from secondary volume. The engine already ignores WU (warm-up)
   and treats lighter back-off/myo sets as non-anchors via anchorOf's
   heaviest-viable rule, so tagging never corrupts a suggestion.
     '' working · WU warm-up · TOP top set · BO back-off (~-15%) · M myo · F to-failure/0-RIR */
function nextSetType(cur){
  const order = ['','WU','TOP','BO','M','F'];
  const i = order.indexOf(cur||'');
  return order[(i+1) % order.length];
}
const SET_TAG_LABEL = { WU:'WU', TOP:'TOP', BO:'BO', F:'0RIR' };   // M handled inline (needs set number)

/* ============ PLAIN-LANGUAGE GLOSSARY ============
   Jargon a beginner won't know. A term rendered via gt('key','label') gets a
   subtle dotted underline; tapping it shows a small popover with this plain
   definition (no jargon inside the definitions themselves). No separate glossary
   screen — the explanation lives one tap away, in context, then gets out of the
   way. */
const GLOSSARY = {
  e1rm:{ t:'e1RM — estimated 1-rep max', d:'The heaviest weight you could lift one time, estimated from a set you did for several reps. It lets the app compare sets fairly — 60kg×12 vs 70kg×8 — to see which was actually stronger.' },
  pr:{ t:'PR — personal record', d:'Your best-ever performance on a lift. The app marks a new PR when your estimated max beats every previous session.' },
  workingweight:{ t:'Working weight', d:'The main weight you train with on a lift, not counting warm-ups. It\u2019s what the app builds its suggestions around.' },
  overload:{ t:'Progressive overload', d:'The core rule of getting stronger: gradually do more over time — more weight, reps, or sets — so your muscles keep adapting.' },
  doubleprog:{ t:'Double progression', d:'Keep the same weight and add reps until you hit the top of your rep range on all sets, then add weight and start again.' },
  topset:{ t:'Top set', d:'Your heaviest, hardest set of an exercise — usually the first working set at your target weight.' },
  backoff:{ t:'Back-off set', d:'A lighter set done after your top set (often about 15% lighter) to add volume without as much strain.' },
  myo:{ t:'Myo-reps', d:'One hard set taken near failure, then several mini-sets of a few reps with very short rests — a fast way to add volume.' },
  dropset:{ t:'Drop set', d:'A set to near failure, then immediately reducing the weight and continuing without resting.' },
  rir:{ t:'RIR — reps in reserve', d:'How many more reps you could have done before failing. 2 RIR means you stopped with about 2 reps left in the tank.' },
  failure:{ t:'Proximity to failure', d:'How close you stop to the point where you couldn\u2019t do another rep. Most muscle growth happens within a few reps of failure.' },
  eccentric:{ t:'Eccentric', d:'The lowering half of a rep (like lowering the bar to your chest). Controlling it slowly — a \u201c3-second eccentric\u201d — can help break plateaus.' },
  volume:{ t:'Volume', d:'How much work you do for a muscle, counted as hard sets per week. It\u2019s the main driver of muscle growth.' },
  mev:{ t:'MEV — minimum effective volume', d:'The fewest weekly sets a muscle needs to grow at all. Below this, you\u2019re just maintaining what you have.' },
  mrv:{ t:'MRV — maximum recoverable volume', d:'The most weekly sets you can do and still recover from. Above this, extra sets start hurting progress instead of helping.' },
  maintenance:{ t:'Maintenance volume', d:'The lower number of sets needed to keep a muscle without necessarily growing it — useful when dieting or focusing elsewhere.' },
  tonnage:{ t:'Tonnage', d:'Total weight moved in a session: weight × reps, added across all sets. A rough measure of total work done.' },
  hypertrophy:{ t:'Hypertrophy', d:'Muscle growth — increasing the size of your muscles, as opposed to training purely for strength or endurance.' },
  mesocycle:{ t:'Mesocycle', d:'A training block of several weeks (often 4–6) that builds toward a goal, usually ending with a deload before the next block.' },
  deload:{ t:'Deload', d:'A planned easier week — fewer sets and/or lighter weight — so your body recovers from fatigue and you can push hard again.' },
  plateau:{ t:'Plateau / stall', d:'When a lift stops improving for several sessions in a row. The app flags this and suggests ways to break through.' },
  warmupramp:{ t:'Warm-up ramp', d:'A few progressively heavier sets before your working weight, to prepare the muscle and joints without tiring you out.' },
  compound:{ t:'Compound exercise', d:'An exercise working multiple muscles across multiple joints (squat, bench, row). Best bang for your buck.' },
  isolation:{ t:'Isolation exercise', d:'An exercise targeting one muscle at a single joint (bicep curl, lateral raise). For focused work.' },
  specialisation:{ t:'Specialisation / priority muscle', d:'A muscle you\u2019ve chosen to actively grow, so the app pushes its volume higher while keeping others at maintenance.' },
  secondary:{ t:'Primary vs secondary muscle', d:'The main muscle an exercise trains (primary) versus the ones assisting (secondary). The heatmap shows both.' },
};

/* Render a tappable glossary term: subtle dotted underline, tap for a popover. */
function gt(key, label){
  const g = GLOSSARY[key]; if(!g) return label;
  return `<span class="gterm" onclick="event.stopPropagation(); showGloss('${key}', this)">${label||g.t.split(' — ')[0]}</span>`;
}
function showGloss(key, el){
  const g = GLOSSARY[key]; if(!g) return;
  closeGloss();
  const pop = document.createElement('div');
  pop.className = 'gloss-pop';
  pop.id = 'glossPop';
  pop.innerHTML = `<div class="gp-t">${g.t}</div><div class="gp-d">${g.d}</div>`;
  document.body.appendChild(pop);
  // position near the tapped term, clamped to the viewport
  const r = el.getBoundingClientRect();
  const pw = Math.min(300, window.innerWidth - 24);
  pop.style.width = pw + 'px';
  let left = r.left + r.width/2 - pw/2;
  left = Math.max(12, Math.min(left, window.innerWidth - pw - 12));
  pop.style.left = left + 'px';
  // prefer below; flip above if it would overflow the bottom
  const below = r.bottom + 8;
  if(below + pop.offsetHeight > window.innerHeight - 12 && r.top - pop.offsetHeight - 8 > 12){
    pop.style.top = (r.top - pop.offsetHeight - 8) + 'px';
  } else {
    pop.style.top = below + 'px';
  }
  pop.classList.add('show');
  setTimeout(()=>document.addEventListener('click', closeGloss, { once:true }), 0);
}
function closeGloss(){ const p=document.getElementById('glossPop'); if(p) p.remove(); }

/* ============ EQUIPMENT SWAP / ALTERNATIVES ============
   One-tap swap to a biomechanical equivalent (same target muscle), carrying the
   working weight across as an ESTIMATE via a rough equipment-load model. Cross-
   exercise load translation is inherently approximate, so the number is a
   starting point the engine dials in over the next sessions — never a promise.
   Equipment is inferred from the name (we don't store it). */
function equipOf(name){
  const n = String(name||'').toLowerCase();
  if(/pull-?up|chin-?up|push-?up|\bdip\b|nordic|sissy|plank|sit-?up|crunch|hanging|ab wheel|inverted row|pistol/.test(n)) return 'bodyweight';
  if(/dumbbell|\bdb\b/.test(n)) return 'dumbbell';
  if(/cable|rope|pushdown|pulldown|crossover|face pull|kickback/.test(n)) return 'cable';
  if(/machine|leverage|smith|pec deck|hack|leg press|pendulum|hip thrust|butterfly|adductor|abductor/.test(n)) return 'machine';
  return 'barbell';
}
/* Relative load a given implement takes for the same movement (barbell = 1).
   Dumbbell is per-hand (≈ half the total, minus a stabilisation tax). */
const EQUIP_LOAD = { barbell:1.0, machine:1.0, cable:0.65, dumbbell:0.45, bodyweight:0 };
function translateWeight(fromName, toName, w, unit){
  if(w==null || !(w>0)) return null;
  const te = equipOf(toName);
  if(EQUIP_LOAD[te]===0) return null;                        // bodyweight target — nothing to carry
  const fromF = EQUIP_LOAD[equipOf(fromName)] || 1;
  const toF   = EQUIP_LOAD[te] || 1;
  const inc = unit==='lbs'? 5 : 2.5;
  const out = roundInc((w / fromF) * toF, inc);
  return out>0 ? out : null;
}
/* Biomechanical equivalents: same muscle group, ranked by primary-muscle overlap
   (from the catalog), tie-broken toward a DIFFERENT implement — since the usual
   reason to swap is that a machine or rack is taken. */
function equivalentsFor(ex){
  const group = ex.muscle;
  const pool = [...new Set([...(EXDB[group]||[]), ...((state.customEx&&state.customEx[group])||[])])].filter(n=>n!==ex.name);
  const me = EXMETA[ex.name];
  const meP = new Set(me? me.p : []);
  const meEq = equipOf(ex.name);
  return pool.map(name=>{
    const m = EXMETA[name];
    let overlap = 0;
    if(me && m) overlap = m.p.filter(x=>meP.has(x)).length*2 + (m.s||[]).filter(x=>meP.has(x)).length;
    const diffEq = equipOf(name)!==meEq ? 1 : 0;
    return { name, group, eq:equipOf(name), score: overlap*10 + diffEq*3 };
  }).sort((a,b)=> b.score - a.score || a.name.localeCompare(b.name)).slice(0,6);
}

/* ============ TIME-BUDGETED COMPRESSOR ============
   "I have N minutes" → a game plan that fits the budget with the least cost to
   growth, applying levers in order of least damage:
     A superset antagonist accessories (rest overlaps → big time save, ZERO volume lost)
     B convert remaining accessories to myo-reps (similar stimulus, far less time)
     C trim accessory sets toward a floor of 2, lowest-priority muscles first
   Compound / primary lifts are PROTECTED throughout — their mechanical-tension
   volume is the growth driver, so it is the last thing to touch (here, never).
   Read-only guidance: it plans, it doesn't rewrite your logged session. */
const ANTAGONIST = { chest:'back', back:'chest', biceps:'triceps', triceps:'biceps', quads:'hamstrings', hamstrings:'quads' };
function exRestSec(muscle,name){ return isCompoundLift(name)? 150 : (tierOf(muscle).name==='small'? 75 : 90); }
function exTimeSec(muscle,name,sets){ return 30 + sets*(35 + exRestSec(muscle,name)); }
function compressSession(exs, minutes){
  const budget = (minutes||40)*60;
  const items = (exs||[]).map(e=>({ name:e.name, muscle:e.muscle, sets:e.sets, orig:e.sets,
    compound:isCompoundLift(e.name), action:'keep', pair:null, estSec: exTimeSec(e.muscle,e.name,e.sets) }));
  const totalSec = ()=>{ const seen=new Set(); let t=0;
    for(const it of items){ if(seen.has(it)) continue;
      if(it.pair && !seen.has(it.pair)){ t+=Math.max(it.estSec,it.pair.estSec)+25; seen.add(it); seen.add(it.pair); }
      else { t+=it.estSec; seen.add(it); } }
    return t; };
  const done=()=> totalSec()<=budget;

  if(!done()){                                        // A — superset antagonist accessories
    const acc=items.filter(it=>!it.compound);
    for(const a of acc){ if(a.pair) continue;
      const b=acc.find(x=>x!==a && !x.pair && x.muscle===ANTAGONIST[a.muscle]);
      if(b){ a.pair=b; b.pair=a; a.action='superset'; b.action='superset'; }
      if(done()) break; }
  }
  if(!done()){                                        // B — myo-convert remaining accessories
    for(const it of items){ if(it.compound || it.action==='myo' || it.action==='superset+myo') continue;
      it.action = it.pair? 'superset+myo':'myo';
      it.estSec = 30 + (35+exRestSec(it.muscle,it.name)) + 45;
      if(done()) break; }
  }
  if(!done()){                                        // C — trim accessory sets to a floor of 2
    const prio=it=> it.compound?9 : (tierOf(it.muscle).name==='big'?2 : tierOf(it.muscle).name==='arms'?1:0);
    let guard=0;
    while(!done() && guard++<200){
      const t=items.filter(it=>!it.compound && it.sets>2 && it.action!=='myo' && it.action!=='superset+myo')
                    .sort((a,b)=>prio(a)-prio(b));
      if(!t.length) break;
      const it=t[0]; it.sets--; it.estSec=exTimeSec(it.muscle,it.name,it.sets);
      it.action = it.action==='superset'? 'superset+trim' : it.action==='superset+trim'? 'superset+trim' : 'trim';
    }
  }
  const est = totalSec();
  return { budgetMin: minutes||40, estMin: Math.round(est/60), fits: est<=budget,
    changed: items.some(it=>it.action!=='keep' || it.sets!==it.orig),
    items: items.map(it=>({ name:it.name, muscle:it.muscle, sets:it.sets, orig:it.orig, action:it.action, pair: it.pair? it.pair.name : null })) };
}

function aiTarget(ex, di){
  const t = tierOf(ex.muscle);
  const rec = allRecords()[ex.name];
  const key = `${state.active.id}|w${state.week}|d${di}|${ex.id}`;
  const planSets = ex.sets.length;

  if(!rec || !rec.best){
    return { w:null, reps:ex.sets.map(s=>s.r), sets:planSets,
      text:`New exercise — find a weight for ${t.lo}–${t.hi} clean reps`, why:'No history for this lift yet. Starting ~2 reps shy of failure gives the engine a baseline to work from.' };
  }
  const lastSess = rec.sessions[rec.sessions.length-1];
  const { wBase, anchor, minR, maxR } = anchorOf(lastSess, t);
  const rnd = v => v==null? null : (ex.unit==='lbs'? roundInc(v,5) : roundInc(v,0.5));
  const jump = over => {
    const base = ex.unit==='lbs'? t.incLb : t.incKg;
    // Bigger overshoot → bigger jump, so a wildly-too-light load is corrected in
    // one step rather than crawling up over several sessions.
    if(over>=10) return base*4;
    if(over>=6)  return base*3;
    if(over>=3)  return base*2;
    return base;
  };
  const ov = state.sugOverride[key]||0;
  const inc0 = ex.unit==='lbs'? t.incLb : t.incKg;
  if(ov===1) return { w:rnd(wBase!=null? wBase+inc0:null), reps:anchor.map(()=>t.lo), sets:planSets, text:`Override · load up: ${wBase!=null? rnd(wBase+inc0)+' '+ex.unit : '1 pin heavier'} × ${t.lo}–${t.hi}`, why:'Manual override.' };
  if(ov===2) return { w:wBase, reps:anchor.map(s=>Math.min((parseReps(s[1])||t.lo)+1,t.capR)), sets:planSets, text:`Override · hold ${fmtW(wBase,ex.unit)}, +1 rep per set`, why:'Manual override.' };
  if(ov===3) return { w:rnd(wBase!=null? Math.max(0,wBase-inc0):null), reps:anchor.map(()=>t.hi), sets:planSets, text:`Override · deload to ${wBase!=null? rnd(wBase-inc0)+' '+ex.unit:'lighter pin'}`, why:'Manual override.' };

  /* DELOAD WEEK — fatigue is driven mostly by volume, while training adaptations
     are held by mechanical tension. So the deload keeps the load and cuts the
     sets, rather than the other way round. */
  if(isDeloadWeek(state.week) && wBase!=null){
    const dSets = Math.max(2, Math.round(planSets/2));
    return { w:wBase, reps:Array(dSets).fill(t.lo), sets:dSets, deload:true,
      text:`Deload — hold ${fmtW(wBase,ex.unit)}, ${dSets} set${dSets===1?'':'s'} of ${t.lo}, stop well short`,
      why:`Deload week. Load stays where it was so the training stimulus is not lost, while sets drop by about half to shed accumulated fatigue. Leave 4–5 reps in reserve — this week is recovery, not testing.` };
  }

  if(minR==null){
    // History exists but the last session had no usable reps (e.g. a blank set).
    // Only show a "beat your best" prompt if there actually IS a valid best;
    // otherwise fall through to the new-exercise guidance rather than "× null".
    if(rec.best && rec.best.w!=null && rec.best.r!=null){
      return { w:wBase, reps:ex.sets.map(()=>t.lo), sets:planSets, text:`Beat ${fmtW(rec.best.w,ex.unit)} × ${rec.best.r} (${rec.best.date})`, why:'Your previous peak on this lift, shown as a reference point.' };
    }
    return { w:null, reps:ex.sets.map(()=>t.lo), sets:planSets, text:`Log a working weight to start tracking this lift`, why:'No complete set has been logged yet, so there is nothing to progress from. Log one working set and the coach takes over.' };
  }

  /* 0 — INTENTIONAL STRENGTH WORK. Heavy low-rep sets at a stable or rising load
     are a strength block, not a failed hypertrophy session. Progress them on
     their own terms (add reps at the load, then add load) instead of telling the
     lifter to deload and "rebuild to 12" — which would be wrong coaching. */
  if(isStrengthBlock(rec, t)){
    const atTop = maxR >= 5;                       // 5+ reps heavy → time to load up
    const nw = atTop ? rnd(wBase + (ex.unit==='lbs'? t.incLb : t.incKg)) : wBase;
    return { w:nw, reps:anchor.map(()=>Math.min(maxR + (atTop?0:1), 5)), sets:planSets, strength:true,
      text: atTop
        ? `Strength work — add load: ${fmtW(nw,ex.unit)} × ${Math.max(2,Math.min(maxR,5))}`
        : `Strength work — hold ${fmtW(wBase,ex.unit)}, aim for ${Math.min(maxR+1,5)} reps`,
      why:`You are training this heavy and low-rep, and the load is holding or climbing — that reads as a deliberate strength block, not a stall. Progressing reps at this load first, then adding weight, keeps that intent. Switch back to ${t.lo}\u2013${t.hi} reps when you want to chase size again.` };
  }

  /* 1 — EVERY anchor set at/above the tier ceiling */
  if(minR >= t.capR){
    const over = minR - t.capR;
    /* Two-session rule: modest ceiling hits must be repeated once before load rises */
    if(over < 2 && rec.sessions.length >= 2){
      const prev = anchorOf(rec.sessions[rec.sessions.length-2], t);
      const prevTopped = prev.minR!=null && prev.minR >= t.capR && (prev.wBase===wBase || prev.wBase==null);
      if(!prevTopped){
        return { w:wBase, reps:anchor.map(()=>t.capR), sets:planSets,
          text:`Repeat ${t.capR}s @ ${fmtW(wBase,ex.unit)} once more to earn +${jump(0)} ${ex.unit}`,
          why:'Two-session rule: load rises only after the top of the range is reached twice. A single session can reflect a good day rather than a change in capacity.' };
      }
    } else if(over < 2 && rec.sessions.length < 2){
      return { w:wBase, reps:anchor.map(()=>t.capR), sets:planSets,
        text:`Repeat ${t.capR}s @ ${fmtW(wBase,ex.unit)} once more to earn +${jump(0)} ${ex.unit}`,
        why:'Two-session rule: the top of the range was reached once. Confirming it on a second session before adding load.' };
    }
    if(t.name==='small' && over <= 2 && planSets < t.maxSets){
      return { w:wBase, reps:anchor.map(()=>t.lo+2).concat([t.lo]), sets:planSets+1, addSet:true,
        text:`Add a set @ ${fmtW(wBase,ex.unit)} — reps maxed at ${t.capR}`,
        why:'On small muscles the smallest available increment is a large percentage jump, so this progresses reps and sets before load.' };
    }
    const j = jump(over);
    const nw = rnd(wBase!=null? wBase+j : null);
    return { w:nw, reps:anchor.map(()=>t.lo), sets:planSets,
      text:`Increase to ${nw!=null? nw+' '+ex.unit : '1 pin heavier'} × ${t.lo}–${t.hi}`,
      why:`Double progression: the ceiling was cleared${over>=2?' decisively':' twice'}, so load rises (+${j} ${ex.unit}) and reps reset to ${t.lo}.` };
  }
  /* 2 — SOME sets blew past the ceiling */
  if(maxR > t.capR && minR >= t.lo){
    const j = jump(maxR - t.capR);
    const nw = rnd(wBase!=null? wBase+j : null);
    return { w:nw, reps:anchor.map(()=>t.lo), sets:planSets,
      text:`Increase to ${nw!=null? nw+' '+ex.unit : '1 pin heavier'} × ${t.lo}–${t.hi}`,
      why:`You blew past the ${t.capR}-rep ceiling — load is too light for the zone. Increase (+${j} ${ex.unit}) to bring reps back into ${t.lo}–${t.hi}.` };
  }
  /* 2b — STALLED: same load, no added reps across three sessions. Repeating
     "+1 rep" indefinitely is not a plan. Back off and rebuild with a running
     start, which reliably clears the sticking point. */
  const stall = stallInfo(rec, t);
  if(stall){
    const diag = plateauDiagnosis(ex, di);
    const act = (state.plateauAct||{})[ex.id] || diag.recommend;
    const sug = plateauSuggestion(act, wBase, t, ex.unit, anchor);
    sug.diag = diag;
    return sug;
  }

  /* 2c — NORMAL FATIGUE: the top set reached the zone but later sets faded
     below the floor. That is expected within-session fatigue, not a failed
     session. Progress the sets that have room; leave the faded ones. Judging on
     the worst set would punish a completely normal training day. */
  if(maxR >= t.lo && minR < t.lo && maxR <= t.capR){
    const spread = maxR - minR;
    const perSet = anchor.map(s=>{
      const r = parseReps(s[1]);
      // sets already in the zone chase +1; faded sets just aim back to the floor
      return r>=t.lo ? Math.min(r+1, t.capR) : t.lo;
    });
    return { w:wBase, reps:perSet, sets:planSets,
      text:`Hold ${fmtW(wBase,ex.unit)} — targets: ${perSet.join(', ')} reps`,
      why:`Your top set hit the ${t.lo}–${t.hi} zone; the later drop-off is normal fatigue across ${planSets} sets, not underperformance${spread>=4?' (a large spread suggests pacing the first set harder would even things out)':''}. Hold the load and push the sets that still have room.` };
  }

  /* 3 — All anchor sets inside the zone → +1 rep per set */
  if(minR >= t.lo){
    const perSet = anchor.map(s=>{
      const r = parseReps(s[1]);
      return r>=t.capR ? r : Math.min(r+1, t.capR);
    });
    return { w:wBase, reps:perSet, sets:planSets,
      text:`Hold ${fmtW(wBase,ex.unit)} — targets: ${perSet.join(', ')} reps`,
      why:'Double progression: each set aims for +1 rep at the same load with ~2 reps in reserve. Reaching the top of the range moves the load up next session.' };
  }
  /* 4 — Some sets under the floor, best set reached it → hold and rebuild */
  if(maxR >= t.lo){
    const perSet = anchor.map(s=>{
      const r = parseReps(s[1]);
      return Math.min(Math.max(r+1, t.lo), t.capR);
    });
    return { w:wBase, reps:perSet, sets:planSets,
      text:`Hold ${fmtW(wBase,ex.unit)} — bring every set to ${t.lo}+ (${perSet.join(', ')})`,
      why:`Lock in a uniform ${t.lo}-rep floor across all sets before advancing weight — even rep quality beats a heavier bar with fading sets.` };
  }
  /* 5 — Every set under the floor: the load is simply too heavy for the zone.
     How far under decides how hard to cut. A near miss (best set one or two shy)
     needs a nudge; a collapse (best set well under) needs a real ~10% cut so the
     next session is actually trainable rather than another grind. */
  const missBy = t.lo - maxR;
  let cut;
  if(missBy >= 3){
    cut = ex.unit==='lbs'? roundInc(Math.max(t.incLb, wBase*0.10),5) : roundInc(Math.max(t.incKg, wBase*0.10),0.5);
  } else {
    cut = ex.unit==='lbs'? t.incLb : Math.max(1, t.incKg);
  }
  const dw = rnd(wBase!=null? Math.max(0, wBase - cut) : null);
  return { w:dw, reps:anchor.map(()=>t.lo+2), sets:planSets,
    text:`Drop to ${dw!=null? dw+' '+ex.unit : 'lighter'}, own ${t.lo}–${t.hi}`,
    why:`Every set fell short of ${t.lo} reps${missBy>=3?' by a wide margin':''} — the load is too heavy for this rep zone. ${missBy>=3?`Cutting about 10% (${cut} ${ex.unit})`:`Easing off ${cut} ${ex.unit}`} puts you back in a range you can actually build from, records intact.` };
}
function cycleSuggestion(exId, di){
  const key = `${state.active.id}|w${state.week}|d${di}|${exId}`;
  state.sugOverride[key] = ((state.sugOverride[key]||0)+1)%4;
  render();
}

/* ============ FEEDBACK → VOLUME (adapt & grow) ============ */
function computeAdj(a){
  let adj = 0; const reasons = [];
  if(a[3]===0){ adj+=1; reasons.push('volume felt low'); }
  if(a[3]===3){ adj-=1; reasons.push('volume was too much'); }
  if(a[1]===3){ adj-=1; reasons.push('still sore from the last session'); }
  if(a[0]>=2){ adj-=1; reasons.push('joint pain reported'); }
  if(a[2]===0 && adj===0){ reasons.push('low pump — tighten rest and tempo'); }
  return { adj: Math.max(-1, Math.min(1, adj)), reasons };
}
function dayAdj(week, di){
  const fb = state.volAdj[`w${week-1}|d${di}`];
  return fb? fb : null;
}

/* ============ VOLUME AUTO-REGULATION ============
   This is the bridge between the volume dashboard and the coach. The dashboard
   only reports; this acts on it.

   Three rules keep it from being annoying or dangerous:

   1. SUSTAINED ONLY — it needs the same pattern across at least two completed
      weeks. A single low week is usually travel, illness or a deload, not a
      programming problem, and reacting to it would just add noise.

   2. RECOVERY OVERRIDES LANDMARKS — if your session feedback for the days that
      train a muscle came back negative (joint pain, lingering soreness, volume
      felt like too much), no increase is proposed even when volume sits below
      the minimum. A table of population averages does not get to outvote what
      your own body reported.

   3. SMALL STEPS — one or two sets a week, never a jump to the middle of the
      band. That's how volume is meant to be walked up across a block.

   Deload weeks are skipped entirely, because low volume there is the point.  */
function isDeloadWeek(w){ return mesoStart() ? w === mesoWeeks() : false; }

function recoverySignalFor(muscle){
  const { plan } = getActivePlan();
  if(!plan) return { avg:0, n:0, reasons:[] };
  let sum=0, n=0; const reasons=[];
  plan.days.forEach((d,di)=>{
    if(!d.exercises.some(e=>e.muscle===muscle)) return;
    const fb = state.volAdj[`w${state.week-1}|d${di}`];
    if(fb){ sum += fb.adj; n++; (fb.reasons||[]).forEach(r=>{ if(!reasons.includes(r)) reasons.push(r); }); }
  });
  return { avg: n? sum/n : 0, n, reasons };
}
function volumeRecommendations(){
  const { plan, locked } = getActivePlan();
  if(!plan) return [];
  if(isDeloadWeek(state.week)) return [];             // don't tinker during a deload
  const wk = state.week;
  const weeks = [];
  for(let w = wk-1; w >= Math.max(1, wk-3) && weeks.length < 3; w--){
    if(isDeloadWeek(w)) continue;
    const sets = weeklySetsByMuscle(w);
    if(Object.values(sets).reduce((a,b)=>a+b,0) > 0) weeks.push({ w, sets });
  }
  if(weeks.length < 2) return [];                     // need a real trend first
  let recs = [];
  plannedMuscles().forEach(m=>{
    const L = VOL_LANDMARKS[m]; if(!L) return;
    if(state.volRecDone && state.volRecDone[`${m}|w${wk}`]) return;   // handled already
    const counts = weeks.map(x=>x.sets[m] || 0);
    const avg = counts.reduce((a,b)=>a+b,0)/counts.length;
    const rec = recoverySignalFor(m);

    if(counts.every(c=>c>0 && c < L.mev)){
      if(rec.avg < 0){
        recs.push({ muscle:m, dir:0, blocked:true, avg:+avg.toFixed(1), weeks:counts.length,
          severity:(L.mev - avg)/Math.max(1,L.mev),
          obs:`${MUSCLE_LABEL[m]} has averaged ${avg.toFixed(1)} sets a week for ${counts.length} weeks, and your session feedback reported ${rec.reasons.join(' and ')}.`,
          sug:`Holding volume for now. Your own recovery reports are the more direct signal here.` });
      } else {
        recs.push({ muscle:m, dir:+1, add:2, avg:+avg.toFixed(1), weeks:counts.length,
          severity:(L.mev - avg)/Math.max(1,L.mev),
          obs:`${MUSCLE_LABEL[m]} has averaged ${avg.toFixed(1)} sets a week across ${counts.length} weeks. No recovery concerns were reported on those days.`,
          sug:`One option is adding 2 sets, which would move it toward the ${L.lo}–${L.hi} range commonly used as a starting point.` });
      }
    } else if(counts.every(c=>c > L.mrv)){
      recs.push({ muscle:m, dir:-1, add:-2, avg:+avg.toFixed(1), weeks:counts.length,
        severity:(avg - L.mrv)/Math.max(1,L.mrv),
        obs:`${MUSCLE_LABEL[m]} has averaged ${avg.toFixed(1)} sets a week for ${counts.length} weeks, above the ~${L.mrv} where many trained lifters find recovery gets harder.`,
        sug:`If loads have stopped climbing, one option is cutting 2 sets here first. Individual tolerance varies widely, so your own recovery is the better guide.` });
    } else if(rec.avg < 0 && counts.every(c=>c >= L.lo)){
      recs.push({ muscle:m, dir:-1, add:-1, avg:+avg.toFixed(1), weeks:counts.length, severity:0.5,
        obs:`Your feedback on ${MUSCLE_LABEL[m]} days reported ${rec.reasons.join(' and ')}, with volume averaging ${avg.toFixed(1)} sets a week.`,
        sug:`One option is dropping a set while that persists.` });
    }
  });
  /* Collapse duplicate "holding off" notices — several muscles trained on the
     same day share one recovery signal and would otherwise repeat themselves. */
  const blocked = recs.filter(r=>r.blocked);
  if(blocked.length > 1){
    const names = blocked.map(b=>MUSCLE_LABEL[b.muscle]||b.muscle);
    const first = blocked[0];
    const merged = { ...first, muscle:first.muscle, muscles:blocked.map(b=>b.muscle), merged:names,
      obs:`${names.slice(0,-1).join(', ')} and ${names[names.length-1]} are all averaging below their usual range, and your feedback on those days reported ${recoverySignalFor(first.muscle).reasons.join(' and ')}.`,
      sug:`Holding volume for now. Your own recovery reports are the more direct signal here.` };
    recs = recs.filter(r=>!r.blocked);
    recs.push(merged);
  }
  /* Rank before capping: cutting volume is acted on now, a hold is informational,
     and adding sets is an opportunity — so urgency runs cut → hold → add. */
  const rank = r => r.dir < 0 ? 0 : (r.blocked ? 1 : 2);
  /* Within a rank, the most deficient muscle wins — a muscle on 1 set is a
     bigger problem than one on 5, even though 5 is the larger number. */
  recs.sort((a,b)=> rank(a)-rank(b) || (b.severity||0)-(a.severity||0));
  return recs.map(r=>({ ...r, locked })).slice(0, 3);
}
/* Apply a recommendation by editing the active plan's set counts. */
function applyVolumeRec(muscle, delta){
  const { plan, locked } = getActivePlan();
  if(!plan || locked) return;
  const targets = [];
  plan.days.forEach((d,di)=>d.exercises.forEach(ex=>{ if(ex.muscle===muscle) targets.push({ex,di}); }));
  if(!targets.length) return;
  let left = Math.abs(delta);
  if(delta > 0){
    // spread onto whichever exercises currently carry the fewest sets
    while(left-- > 0){
      targets.sort((a,b)=>a.ex.sets.length-b.ex.sets.length);
      const t = targets[0];
      const last = t.ex.sets[t.ex.sets.length-1] || {w:null,r:null};
      t.ex.sets.push({ w:last.w, r:last.r });
    }
  } else {
    while(left-- > 0){
      targets.sort((a,b)=>b.ex.sets.length-a.ex.sets.length);
      const t = targets[0];
      if(t.ex.sets.length > 1) t.ex.sets.pop();
    }
  }
  if(!state.volRecDone) state.volRecDone = {};
  state.volRecDone[`${muscle}|w${state.week}`] = true;
  saveState(); render();
}
function dismissVolumeRec(muscles){
  if(!state.volRecDone) state.volRecDone = {};
  String(muscles).split(',').forEach(m=>{ state.volRecDone[`${m}|w${state.week}`] = true; });
  saveState(); render();
}
/* Evidence is available on demand rather than always on screen: the
   recommendation is what you need to act, the reasoning is what you need to
   trust it — and you only need the second one once. */
let vrWhyOpen = {};
function toggleWhy(key){ vrWhyOpen[key] = !vrWhyOpen[key]; render(); }

function volumeRecCard(){
  const recs = volumeRecommendations();
  if(!recs.length) return '';
  return `<div class="vreccard">
    <div class="vr-h">⟳ Coach adjustment${recs.length>1?'s':''}<span class="vr-sub">from ${recs[0].weeks} weeks of your logs</span></div>
    ${recs.map(r=>`
      <div class="vr ${r.blocked?'blocked':r.dir>0?'up':'down'}">
        <div class="vr-obs">${r.obs || r.text || ''}</div>
        ${r.sug? `<div class="vr-sug">${r.sug}</div>`:''}

              aria-expanded="${open}">Why?<span class="vr-chev">${open?'▾':'▸'}</span></button>

            : r.locked

              : `<button class="vr-apply" onclick="applyVolumeRec('${r.muscle}',${r.add})">${r.dir>0?`Add ${r.add} sets`:`Remove ${Math.abs(r.add)} set${Math.abs(r.add)===1?'':'s'}`}</button>
                 <button class="vr-skip" onclick="dismissVolumeRec('${(r.muscles||[r.muscle]).join(',')}')">Not now</button>`}
        </div>
      </div>`).join('')}
  </div>`;
}

/* ============ ONE-OFF WEEK RESHUFFLE ============
   Life happens: a training day becomes unavailable, or a rest day frees up.
   The user picks a session up and drops it on another weekday. This edits
   only that week's schedule — the plan itself and next week are untouched.
   Logs are keyed to the session, not the date, so nothing logged is lost. */
let moveSrcPi = null;

function startMoveDay(pi){
  moveSrcPi = pi;
  state.weekOpen = true;
  render();
}
function cancelMoveDay(){ moveSrcPi = null; render(); }

/* Drop the session being moved onto weekday `wd` of the real current week. */
function dropMoveDay(wd){
  if(moveSrcPi == null) return;
  const wk = mesoWeekNow();
  const map = dayMap(wk).slice();
  const from = map[moveSrcPi];
  if(from === wd){ moveSrcPi = null; render(); return; }
  const other = map.findIndex((x,i)=>i!==moveSrcPi && x===wd);
  map[moveSrcPi] = wd;
  if(other >= 0) map[other] = from;          // occupied → swap the two sessions
  if(!state.weekDayMap) state.weekDayMap = {};
  state.weekDayMap[wk] = map;
  moveSrcPi = null;
  const pi = todayPlanIdx();
  if(pi != null) state.dayIdx = pi;
  saveState(); render();
}

function resetWeekSchedule(){
  const wk = mesoWeekNow();
  if(state.weekDayMap) delete state.weekDayMap[wk];
  moveSrcPi = null;
  const pi = todayPlanIdx();
  if(pi != null) state.dayIdx = pi;
  saveState(); render();
}

/* Move today's session to a rest day, or pull a session onto today. */
function trainThisToday(pi){
  moveSrcPi = pi;
  dropMoveDay(nowDate().getDay());
}

/* If today is a scheduled rest day but the user wants to train, offer to pull
   an unlogged session onto today rather than making them hunt in the panel. */
function restDayPrompt(){
  if(moveSrcPi !== null) return '';
  const { plan } = getActivePlan();
  if(!plan || !mesoStart()) return '';
  const wk = mesoWeekNow();
  if(state.week !== wk) return '';
  if(todayPlanIdx() !== null) return '';           // already a training day
  const map = dayMap(wk);
  const todayWd = nowDate().getDay();
  // sessions later this week that have nothing logged yet
  const options = plan.days.map((d,pi)=>({d,pi,wd:map[pi]}))
    .filter(o=>{
      let logged=0;
      o.d.exercises.forEach(ex=>{ for(let i=0;i<ex.sets.length;i++){ const l=getLog(wk,o.pi,ex.id,i); if(l&&l.logged) logged++; } });
      return logged===0;
    });
  if(!options.length) return '';
  return `<div class="restprompt">
    <div class="rp-t">Rest day today — training anyway?</div>
    <div class="rp-s">Move a session onto today. Your plan and next week stay as they are.</div>
    <div class="rp-opts">${options.map(o=>`<button onclick="trainThisToday(${o.pi})">${o.d.name.replace(/^Day \\d+ · /,'')}</button>`).join('')}</div>
  </div>`;
}

/* Live training state for the workout header — week, block phase and fatigue,
   all derived from the log rather than a fixed label. */
function blockState(){
  const wk = state.week, total = mesoWeeks();
  let block;
  if(isDeloadWeek(wk)) block = 'Deload';
  else if(wk <= Math.ceil(total/3)) block = 'Accumulation';
  else if(wk <= Math.ceil(total*2/3)) block = 'Progression';
  else block = 'Intensification';
  /* Week and block only. Sessions logged is already visible in the load bar,
     and the diet goal does not change what you lift today. */
  return `Week <b>${wk}</b>/${total} · ${block}`;
}

/* Per-exercise rationale disclosure — same affordance as the coach card. */
let exWhyOpen = {};
function toggleExWhy(id){ exWhyOpen[id] = !exWhyOpen[id]; render(); }

/* Which finished exercises the user has chosen to reopen. Not persisted: a
   fresh session should start clean rather than remembering yesterday's state. */
let exExpanded = {};
function expandExercise(id){ exExpanded[id] = true; render(); }
function collapseExercise(id){ delete exExpanded[id]; render(); }

/* ============ WHERE THE APP OPENS ============
   The app should answer "what do I do now?" before the user has to ask it.
   Training day with work outstanding → the session. Otherwise the thing that
   still needs doing today, which is food. No plan at all → pick one. */
function todaySessionState(){
  const { plan } = getActivePlan();
  if(!plan) return 'noplan';
  const pi = mesoStart()? todayPlanIdx() : state.dayIdx;
  if(pi == null) return 'rest';
  const day = plan.days[pi];
  if(!day) return 'rest';
  const wk = mesoStart()? mesoWeekNow() : state.week;
  let planned = 0, logged = 0;
  day.exercises.forEach(ex=>{
    const n = ex.sets.length + (state.extraSets[xkey(wk,pi,ex.id)]||0);
    planned += n;
    for(let i=0;i<n;i++){ const l = getLog(wk,pi,ex.id,i); if(l && l.logged) logged++; }
  });
  if(planned === 0) return 'rest';
  if(logged === 0) return 'todo';
  if(logged >= planned) return 'done';
  return 'partial';
}
/* True while there is a session actively underway — used to keep reflective
   content off the screen mid-workout. */
function trainingInProgress(){
  const st = todaySessionState();
  return st === 'todo' || st === 'partial';
}
/* Completion state of the WEEK/DAY currently on screen (state.week/dayIdx),
   as opposed to todaySessionState() which always reports the real calendar day.
   The end-of-session recap uses THIS so the card that appears and the session it
   summarises are always the same page — no more a "week 3 is done" card showing
   while you browse week 2's completed session. */
function viewedSessionState(){
  const { plan } = getActivePlan();
  if(!plan) return 'noplan';
  const day = plan.days[state.dayIdx];
  if(!day) return 'rest';
  let planned=0, logged=0;
  day.exercises.forEach(ex=>{
    const n = ex.sets.length + (state.extraSets[xkey(state.week,state.dayIdx,ex.id)]||0);
    planned += n;
    for(let i=0;i<30;i++){ const l=getLog(state.week,state.dayIdx,ex.id,i); if(l && l.logged) logged++; }
  });
  if(planned === 0) return 'rest';
  if(logged === 0) return 'todo';
  if(logged >= planned) return 'done';
  return 'partial';
}
function landingTab(){
  if(!state.active || !state.active.kind) return 'templates';
  const st = todaySessionState();
  // Straight into the session when there is one to do.
  if(st === 'todo' || st === 'partial') return 'workout';
  // Nothing to train: food is the live decision on rest and post-session days.
  return 'macros';
}

/* ============ FTUX / ONBOARDING ============

function onboardingHasLoggedSet(){

}
function onboardingPlanReady(){

  catch(e){ return false; }
}
const ONBOARDING_STEPS = [
