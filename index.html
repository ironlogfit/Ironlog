      <div class="vol-row ${st}">
        <div class="vol-head">
          <span class="vm">${MUSCLE_LABEL[m]||m}</span>
          <span class="vs"><b>${n}</b> sets${delta!==null && delta!==0? ` <span class="vd ${delta>0?'up':'dn'}">${delta>0?'+':''}${delta}</span>`:''}</span>
        </div>
        <div class="vol-track">
          <div class="vband" style="left:${pct(L.lo)}%; width:${pct(L.hi)-pct(L.lo)}%"></div>
          <div class="vtick mev" style="left:${pct(L.mev)}%"></div>
          <div class="vtick mrv" style="left:${pct(L.mrv)}%"></div>
          <div class="vfill ${st}" style="width:${pct(n)}%"></div>
        </div>
        <div class="vol-foot">
          <span class="vstat ${st}">${label}</span>
          <span class="vrange">target ${L.lo}–${L.hi} · ceiling ${L.mrv}</span>
        </div>
      </div>`;
  }).join('');

  // weak points: programmed muscles sitting below their minimum
  const weak = muscles.filter(m=>{
    const n = thisWk[m]||0;
    return n>0 && n < VOL_LANDMARKS[m].mev;
  });
  const untrained = planned.filter(m=>VOL_LANDMARKS[m] && !(thisWk[m]>0));
  const over = muscles.filter(m=>(thisWk[m]||0) > VOL_LANDMARKS[m].mrv);
  const stalled = plateaus();

  let insights = '';
  if(weak.length || over.length || stalled.length || untrained.length){
    insights = `<div class="vinsights">
      <div class="vi-t">What your log shows</div>
      ${weak.map(m=>`<div class="vi under">${MUSCLE_LABEL[m]} has <b>${thisWk[m]} logged set${thisWk[m]===1?'':'s'}</b> this week. Current evidence suggests many trained lifters do well somewhere in the ${VOL_LANDMARKS[m].lo}–${VOL_LANDMARKS[m].hi} range, though individual response varies. One option is adding ${Math.max(2, VOL_LANDMARKS[m].lo-thisWk[m])} sets.</div>`).join('')}
      ${untrained.length? `<div class="vi under">${untrained.map(m=>MUSCLE_LABEL[m]).join(', ')} ${untrained.length===1?'is':'are'} in your plan with no logged sets this week so far.</div>`:''}
      ${over.map(m=>`<div class="vi over">${MUSCLE_LABEL[m]} is at <b>${thisWk[m]} sets</b>. Recovery is often reported as harder above ~${VOL_LANDMARKS[m].mrv} sets, though tolerance varies widely between lifters. If performance is dropping, one option is cutting here first.</div>`).join('')}
      ${stalled.map(s=>`<div class="vi stall"><b>${s.name}</b> has not exceeded its previous peak in ${s.sessions} sessions (peak e1RM ${s.peak}, previously ${s.prior}). Possible explanations include fatigue, calorie intake, sleep, or the stimulus itself — the log alone cannot separate them.</div>`).join('')}
    </div>`;
  } else if(totalSets>0){
    insights = `<div class="vinsights"><div class="vi good">Every muscle you are training sits inside its usual range this week, and no lift has stalled.</div></div>`;
  }

  document.getElementById('content').innerHTML = `
    <div class="pagehead">
      <div class="eyebrow">Week ${state.week}${mesoStart()? ' of '+mesoWeeks():''} · hard sets by muscle</div>
      <h1>Volume</h1>
      <div class="sub">Warm-ups excluded. Counted from what you actually logged, not what was programmed.</div>
    </div>
    ${toggle}
    ${totalSets===0
      ? `${volumeRecCard()}
         <div class="emptystate" style="padding:30px 20px;"><div class="big">📊</div>
          <div class="t">No sets logged in week ${state.week} yet.<br>Log a session and your weekly volume per muscle appears here, checked against the ranges the research supports.</div></div>`
      : `<div class="voltotal"><b>${totalSets}</b> hard sets logged across ${muscles.filter(m=>thisWk[m]>0).length} muscle groups this week</div>
         ${rows}
         ${volumeRecCard()}
         ${insights}
         <div class="medcaution" style="margin-top:18px;">
           <div class="mc-t">How to read this</div>
           The shaded band is where most trained lifters get the majority of their growth — roughly 12–20 weekly sets, from Schoenfeld's dose-response work and the 2025 meta-regression across 67 studies.
           The newer data shows gains still creeping up past that band rather than falling off a cliff, so the ceiling is a <b>recovery</b> guide, not a hard limit.
           Sets only count if they were genuinely hard, and compound lifts do partial work for assisting muscles that isn't counted here — so your real chest and delt volume is a little higher than shown.
         </div>`}
  `;
}

/* ============ WORKOUT ============ */
function renderWorkout(){
  const { plan, locked, structureLocked } = getActivePlan();
  const toggle = `
    <div class="tpl-toggle" style="margin:8px 0 4px;">
      <button class="${state.workoutView==='today'?'active':''}" onclick="setWorkoutView('today')">Today</button>
      <button class="${state.workoutView==='history'?'active':''}" onclick="setWorkoutView('history')">All exercises</button>
      <button class="${state.workoutView==='volume'?'active':''}" onclick="setWorkoutView('volume')">Volume</button>
    </div>`;
  if(state.workoutView==='history'){ renderHistoryView(toggle); return; }
  if(state.workoutView==='volume'){ renderVolumeView(toggle); return; }
  if(!plan){
    document.getElementById('content').innerHTML = `
      <div class="pagehead"><div class="eyebrow">Workout</div><h1>No active plan</h1></div>${toggle}
      <div class="emptystate"><div class="big">🏋️</div><div class="t"><b>No plan running yet.</b><br>
        Choose a programme in Templates, or build your own. You can change it any time — nothing is locked in.</div></div>
      <button class="addmeal" onclick="setTab('templates')">Go to Templates</button>`;
    return;
  }
  if(state.dayIdx >= plan.days.length) state.dayIdx = 0;
  const day = plan.days[state.dayIdx];
  const adjInfo = dayAdj(state.week, state.dayIdx);
  const adj = adjInfo? adjInfo.adj : 0;

  const setsOf = ex => {
    const ai = aiTarget(ex, state.dayIdx);
    const base = Math.max(2, Math.max(ex.sets.length, ai.sets||0) + adj);
    return base + (state.extraSets[xkey(state.week,state.dayIdx,ex.id)]||0);
  };
  const totalSets = day.exercises.reduce((a,e)=>a+setsOf(e),0);
  let doneSets = 0;
  day.exercises.forEach(ex=>{ for(let i=0;i<setsOf(ex);i++){ const l=getLog(state.week,state.dayIdx,ex.id,i); if(l&&l.logged) doneSets++; } });

  let bar='';
  for(let i=0;i<totalSets;i++){ const h = 14+(i%3)*4; bar += `<div class="seg ${i<doneSets?'done':''}" style="height:${h}px"></div>`; }

  const weekChips = Array.from({length:mesoWeeks()},(_,i)=>{
    const w=i+1;
    return `<div class="chip ${w===state.week?'active':''}" onclick="setWeek(${w})">W${w}${w===mesoWeeks()?' · DL':''}</div>`;
  }).join('');

  /* Full-week overview: the REAL current week, Monday → Sunday, with training
     days mapped onto the weekdays the user chose and today highlighted. */
  const wkDates = currentWeekDates();
  const realTodayISO = todayISO();
  const weekRows = wkDates.map(dt=>{
    const wd = dt.getDay();
    const iso = isoOf(dt);
    const pi = planIdxForWeekday(wd, mesoWeekNow());
    const isToday = iso === realTodayISO;
    const isPast = iso < realTodayISO;
    const moving = moveSrcPi !== null;
    const isSrc = moving && pi === moveSrcPi;
    const dLabel = `${DAY_ABBR[wd]}<span class="dnum">${dt.getDate()}</span>`;
    if(pi === null){
      return `<div class="weekrow rest ${isToday?'today':''} ${isPast?'past':''} ${moving?'target':''}"
        ${moving? `onclick="dropMoveDay(${wd})"`:''}>
        <span class="wd">${dLabel}</span>
        <div class="wn"><div class="t1">Rest${isToday?' · today':''}</div>
          <div class="t2">${moving? '<span class="movehint">Tap to move the session here</span>' : 'Recovery · steps + sleep'}</div></div>
      </div>`;
    }
    const d = plan.days[pi];
    if(!d) return '';
    // did they actually log anything that day?
    let logged = 0;
    d.exercises.forEach(ex=>{ for(let i=0;i<setsOf(ex);i++){ const l=getLog(state.week,pi,ex.id,i); if(l&&l.logged) logged++; } });
    const missed = isPast && logged===0;
    const muscles = [...new Set(d.exercises.map(e=>e.muscle))].slice(0,4).join(' · ');
    return `<div class="weekrow ${pi===state.dayIdx?'cur':''} ${isToday?'today':''} ${isPast?'past':''} ${isSrc?'moving':''} ${moving&&!isSrc?'target':''}"
      onclick="${moving? (isSrc? 'cancelMoveDay()' : `dropMoveDay(${wd})`) : `setDay(${pi}); state.weekOpen=false;`}">
      <span class="wd">${dLabel}</span>
      <div class="wn"><div class="t1">${d.name}${isToday?' <span class="todaytag">TODAY</span>':''}</div>
        <div class="t2">${isSrc? '<span class="movehint">Moving — tap a day, or tap here to cancel</span>'
          : moving? '<span class="movehint">Tap to swap with this session</span>'
          : (missed? '<span class="missed">Not logged</span> · ' : (logged>0? `<span class="doneb">${logged} sets logged</span> · `:'')) + `${d.exercises.length} exercises · ${muscles}`}</div></div>
      ${moving? '<span class="go">↔</span>'
        : `<span class="movebtn" onclick="event.stopPropagation(); startMoveDay(${pi})" title="Move this session to another day">⇅</span>`}
    </div>`;
  }).join('');

  const exHtml = day.exercises.map((ex,ei)=>{
    const ai = aiTarget(ex, state.dayIdx);
    const n = setsOf(ex);
    const noteKey = `${state.active.id}|w${state.week}|d${state.dayIdx}|${ex.id}`;
    const note = state.notes[noteKey];
    const rec = allRecords()[ex.name];
    const baseline = rec && rec.best ? `${fmtW(rec.best.w,ex.unit)} × ${rec.best.r} · ${rec.best.date}` : '—';
    let rows='';
    let doneSets = 0, topSet = null;      // for the collapsed summary
    for(let i=0;i<n;i++){
      const prev = lastWeekLog(state.dayIdx, ex.id, i);
      const l = getLog(state.week,state.dayIdx,ex.id,i) || {};
      if(l.logged){
        doneSets++;
        if(l.type!=='WU'){
          const sc = e1rm(l.w, parseReps(l.r));
          if(sc!=null && (!topSet || sc > topSet.score)) topSet = { score:sc, w:l.w, r:l.r };
        }
      }
      const type = l.type||'';
      const phW = prev? prev.w : (ai.w ?? ex.sets[Math.min(i,ex.sets.length-1)].w);
      const phR = prev? prev.r : (ai.reps && ai.reps[Math.min(i, ai.reps.length-1)] != null ? ai.reps[Math.min(i, ai.reps.length-1)] : ex.sets[Math.min(i,ex.sets.length-1)].r);
      const plateCls = `plate ${l.logged?'logged':''} ${type==='WU'?'wu':''} ${type==='M'?'myo':''}`;
      const plateLbl = type==='WU'? `WU` : type==='M'? `${i+1}<span class="st">MYO</span>` : (i+1);
      const wField = `<div class="stepper">
            <button onclick="stepSet('${ex.id}',${i},'w',-1)">−</button>
            <input type="text" inputmode="decimal" value="${l.w ?? ''}" placeholder="${phW ?? '—'}" onchange="updSet('${ex.id}',${i},'w',this.value)">
            <button onclick="stepSet('${ex.id}',${i},'w',1)">+</button>
          </div>`;
      const rField = `<div class="stepper">
            <button onclick="stepSet('${ex.id}',${i},'r',-1)">−</button>
            <input type="text" inputmode="numeric" value="${l.r ?? ''}" placeholder="${phR ?? '—'}" onchange="updSet('${ex.id}',${i},'r',this.value)">
            <button onclick="stepSet('${ex.id}',${i},'r',1)">+</button>
          </div>`;
      rows += `<div class="setrow">
        <div class="${plateCls}" onclick="${structureLocked?'':'cycleType(\''+ex.id+'\','+i+')'}" title="Tap: working → warm-up → myo">${plateLbl}</div>
        ${wField}${rField}
        <div class="logbtn ${l.logged?'on':''}" onclick="toggleSet('${ex.id}',${i})">✓</div>
      </div>`;
    }
    /* Once every set is in, the card folds to one line. Mid-session the screen
       shows what is left to do, not what is already done. Tap to reopen. */
    const complete = n>0 && doneSets >= n;
    if(complete && !exExpanded[ex.id]){
      return `<div class="ex-done" onclick="expandExercise('${ex.id}')">
        <span class="exd-check">✓</span>
        <div class="exd-body">
          <div class="exd-name">${ex.name}</div>
          <div class="exd-meta">${doneSets} set${doneSets===1?'':'s'}${topSet? ` · top ${fmtW(topSet.w,ex.unit)} × ${topSet.r}`:''}</div>
        </div>
        <span class="exd-open">Edit</span>
      </div>`;
    }
    return `<div class="ex-card ${complete?'is-open':''}">
      ${complete? `<div class="ex-collapse" onclick="collapseExercise('${ex.id}')">Done — collapse ▴</div>`:''}
      <div class="ex-head">
        <div class="ex-headwrap">${muscleTag(ex.muscle)}<div class="ex-name">${ex.name}</div>${ex.eq? `<div class="ex-eq">${ex.eq}</div>`:''}</div>
        <div class="actions">
          <span class="unitchip" onclick="${structureLocked?'':'toggleUnit('+ei+')'}">${ex.unit.toUpperCase()}</span>
          <div class="iconbtn sm" onclick="openModal('note','${noteKey}')" title="Note">✎</div>
          ${structureLocked?'':`<div class="iconbtn sm" onclick="startSwap(${ei})" title="Swap exercise">⇄</div>`}
          ${structureLocked?'':`<div class="iconbtn sm danger" onclick="removeExerciseToday(${ei})" title="Remove exercise">✕</div>`}
        </div>
      </div>
      <div class="rep-chip"><span class="r">${rangeLabel(ex.muscle)}</span><span class="last">Best: ${baseline}</span></div>
      <div class="suggest-chip" onclick="cycleSuggestion('${ex.id}',${state.dayIdx})"><span class="r">◆ ${ai.text}</span><span class="cyc">↻</span></div>
      ${ai.why? `<button class="vr-whybtn ${exWhyOpen[ex.id]?'open':''}" onclick="toggleExWhy('${ex.id}')"
          aria-expanded="${!!exWhyOpen[ex.id]}">Why?<span class="vr-chev">${exWhyOpen[ex.id]?'▾':'▸'}</span></button>
        ${exWhyOpen[ex.id]? `<div class="aiwhy">${ai.why}</div>`:''}`:''}
      ${note? `<div class="notepill"><span class="i">✎</span><span>${note}</span></div>`:''}
      <div class="setgrid-head"><span>Set</span><span>Weight</span><span>Reps</span><span>Log</span></div>
      ${rows}
      <button class="addset" onclick="addSet('${ex.id}')">+ Add set</button>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="pagehead">
      <div class="eyebrow">${mesoStart()? `Week ${state.week} of ${mesoWeeks()}` : `Week ${state.week}`}${state.week===mesoWeeks()?' · Deload':''} · ${day.name}</div>
      <h1>${plan.name}</h1>

    </div>
    ${toggle}
    ${(()=>{
      const realWeek = mesoWeekNow();
      const tpi = todayPlanIdx();
      const onToday = (state.week===realWeek) && (tpi!=null ? state.dayIdx===tpi : true);
      const restToday = tpi===null;
      if(!mesoStart()){
        return `<div class="datebar setup" onclick="openModal('meso')">
          <span class="dl">\u{1F4C5} ${todayLabel()}</span>
          <span class="dr">Set mesocycle dates \u203A</span></div>`;
      }
      if(mesoFinished()){
        return `<div class="datebar done" onclick="openModal('meso')">
          <span class="dl">\u{1F3C1} Mesocycle complete \u2014 ended ${fmtShort(mesoEnd())}</span>
          <span class="dr">Start next \u203A</span></div>`;
      }
      return `<div class="datebar ${onToday?'':'off'}">
        <span class="dl">\u{1F4C5} ${todayLabel()}${restToday? ' \u00B7 rest day':''}</span>
        ${onToday
          ? `<span class="dr ok">Day ${mesoDayNum()} \u00B7 ${mesoDaysLeft()} days left</span>`
          : `<span class="dr jump" onclick="jumpToToday()">\u21A9 Back to today</span>`}
      </div>`;
    })()}
    <button class="weekbtn" onclick="state.weekOpen=!state.weekOpen; render();">
      <span>📅 Full week plan — ${plan.days.length} training days + ${7-plan.days.length} rest</span><span>${state.weekOpen?'▾':'›'}</span>
    </button>
    ${state.weekOpen? `<div class="weekpanel">${weekRows}
      ${moveSrcPi!==null? `<div class="movebar">Pick the day to move it to <button onclick="cancelMoveDay()">Cancel</button></div>`
        : weekIsShuffled(mesoWeekNow())? `<div class="movebar shuffled">Schedule moved for this week only <button onclick="resetWeekSchedule()">Reset</button></div>`:''}
    </div>`:''}
    ${restDayPrompt()}
    <div class="switchrow">${weekChips}</div>
    ${adjInfo && adj!==0? `<div class="coachpill">◆ Coach adjusted this day: <b>${adj>0?'+1 set':'−1 set'} per exercise</b> — last week you said ${adjInfo.reasons.join(', ')}.</div>`
      : adjInfo? `<div class="coachpill">◆ Volume held steady — last week's feedback: ${adjInfo.reasons.join(', ') || 'recovery on point'}.</div>`:''}
    <div class="setcount">
      <span class="n">${doneSets} / ${totalSets} sets today</span>
      <span class="phase">${blockState()}</span>
    </div>
    <div class="load-bar">${bar}</div>
    ${locked? `<div class="lockednote">Pre-built plan — enter your weights &amp; reps, tick ✓ when done. To swap or add exercises, create a custom plan.</div>`
            : `<div class="lockednote">Ghost numbers are the AI target from your records — tick ✓ logs them as-is. Tap a set circle for warm-up / myo. Tap ◆ to override the coach.</div>`}
    ${trainingInProgress()? '' : reviewBanner()}
    ${volumeRecCard()}
    ${exHtml}
    ${structureLocked?'':`<button class="addmeal" onclick="addExerciseToday()">+ Add exercise to ${day.name.replace(/^Day \d+ · /,'')}</button>`}
    ${(()=>{
      const st = todaySessionState();
      if(st === 'done'){
        // Every set is in — feedback is now the one thing left, so it leads.
        return `<div class="sessionend">
          <div class="se-t">Session complete</div>
          <div class="se-s">Tell the coach how it felt and it adjusts next week's volume.</div>
          <button class="feedbackbtn" onclick="openModal('feedback')">Log session feedback</button>
        </div>`;
      }
      // Mid-session it stays reachable but never competes with the set you are on.
      return `<button class="feedbackbtn quiet" onclick="openModal('feedback')">Log session feedback</button>`;
    })()}
  `;
}

/* ---- All exercises / records view ---- */
function sessString(sets, unit){
  const work = sets.filter(Boolean);
  const ws = new Set(work.map(s=>s[0]));
  if(ws.size===1){
    return `${fmtW(work[0][0],unit)} × ` + work.map(s=>(s[2]==='WU'?'WU ':'')+s[1]+(s[2]==='M'?' myo':'')).join(', ');
  }
  return work.map(s=>`${s[0]??'—'}×${s[1]}${s[2]==='WU'?' WU':''}${s[2]==='M'?' myo':''}`).join(', ')+' '+unit;
}
function renderHistoryView(toggle){
  const recs = Object.values(allRecords()).sort((a,b)=> b.sessions.length - a.sessions.length || a.name.localeCompare(b.name));
  const totalSets = recs.reduce((a,r)=>a+r.totalSets,0);
  const cards = recs.map(r=>{
    const open = state.histOpen[r.name];
    const t = tierOf(r.muscle);
    const ai = aiTarget({ id:'x', name:r.name, muscle:r.muscle, unit:r.unit, sets:r.sessions[r.sessions.length-1].sets.map(s=>({w:s[0],r:parseReps(s[1])})) }, 0);
    return `<div class="hist-card">
      <div class="top" onclick="toggleHist('${esc(r.name)}')">
        <div>
          ${muscleTag(r.muscle)}
          <div class="ex-name" style="font-size:15.5px;">${r.name}</div>
          <div class="pr">
            <span class="badge">PR ${fmtW(r.best.w,r.unit)} × ${r.best.r}</span>
            <span class="e1">${r.best.w!=null&&r.best.reps? 'e1RM '+Math.round(e1rm(r.best.w,r.best.reps))+' '+r.unit : ''}</span>
          </div>
          <div class="meta2">${r.sessions.length} session${r.sessions.length===1?'':'s'} · ${r.totalSets} working sets · last ${r.lastDate} · ${t.lo}–${t.hi} rep zone</div>
        </div>
        <span class="arrow" style="color:var(--text-faint)">${open?'▾':'›'}</span>
      </div>
      ${open? `
        <div class="suggest-chip" style="margin-top:10px;"><span class="r">◆ ${ai.text}</span></div>
        ${r.sessions.slice().reverse().map(s=>`
          <div class="sessrow">
            <div class="sd">${s.date}</div>
            <div class="sp">${sessString(s.sets, r.unit)}</div>
            ${s.note? `<div class="sn">✎ ${s.note}</div>`:''}
          </div>`).join('')}
      `:''}
    </div>`;
  }).join('');
  document.getElementById('content').innerHTML = `
    <div class="pagehead">
      <div class="eyebrow">Exercise library</div>
      <h1>All exercises</h1>
      <div class="sub">${recs.length} exercises tracked · ${totalSets} working sets all-time</div>
    </div>
    ${toggle}
    ${cards || `<div class="emptystate"><div class="t"><b>No exercise history yet.</b><br>
      Log your first session and every lift you train appears here with its best set and trend.</div></div>`}
  `;
}
function toggleHist(name){ state.histOpen[name] = !state.histOpen[name]; render(); }

function setWeek(w){ state.week=w; render(); }
function setDay(i){ state.dayIdx=i; render(); }
function ensureLog(exId,i){
  const { plan } = getActivePlan();
  const ex = plan.days[state.dayIdx].exercises.find(e=>e.id===exId);
  const k = lkey(state.week,state.dayIdx,exId,i);
  if(!state.logs[k]) state.logs[k] = { w:null, r:null, logged:false, type:'' };
  return { log:state.logs[k], ex };
}
function toggleSet(exId,i){
  const { log, ex } = ensureLog(exId,i);
  if(!log.logged){
    const prev = lastWeekLog(state.dayIdx, exId, i);
    const ai = aiTarget(ex, state.dayIdx);
    if(log.w==null) log.w = prev? prev.w : (ai.w ?? ex.sets[Math.min(i,ex.sets.length-1)].w);
    if(log.r==null) log.r = prev? prev.r : (ai.reps? ai.reps[Math.min(i,ai.reps.length-1)] : ex.sets[Math.min(i,ex.sets.length-1)].r);
  }
  log.logged = !log.logged;
  render();
}
function updSet(exId,i,f,val){
  const { log } = ensureLog(exId,i);
  log[f] = val===''? null : (f==='w'? parseFloat(val) : val);
  saveState();
}
function stepSet(exId,i,f,dir){
  const { log, ex } = ensureLog(exId,i);
  const prev = lastWeekLog(state.dayIdx, exId, i);
  const ai = aiTarget(ex, state.dayIdx);
  const phW = prev? prev.w : (ai.w ?? ex.sets[Math.min(i,ex.sets.length-1)].w) ?? 0;
  const phR = parseReps(prev? prev.r : (ai.reps? ai.reps[Math.min(i,ai.reps.length-1)] : ex.sets[Math.min(i,ex.sets.length-1)].r)) ?? 0;
  const base = f==='w' ? (log.w ?? phW) : (parseReps(log.r) ?? phR);
  const inc = f==='w' ? (ex.unit==='lbs'? 5 : 2.5) : 1;
  const v = Math.max(0, +(base + dir*inc).toFixed(1));
  log[f] = v;
  render();
}
function cycleType(exId,i){

function perfString(ex, di){
  const nSets = ex.sets.length + (state.extraSets[xkey(state.week,di,ex.id)]||0) + 2;
  const parts=[]; const ws=new Set();
  for(let i=0;i<nSets;i++){
    const l = getLog(state.week,di,ex.id,i);
    if(!(l&&l.logged)) continue;
    ws.add(l.w);
    parts.push({w:l.w, r:l.r, t:l.type||''});
  }
  if(!parts.length) return null;
  if(ws.size===1){
    const w = parts[0].w;
    return `${fmtW(w,ex.unit)} × ` + parts.map(p=> (p.t==='WU'?'WU ':'')+p.r+(p.t==='M'?' myo':'')).join(', ');
  }
  return parts.map(p=> `${p.w??'—'}×${p.r}${p.t==='WU'?' WU':''}${p.t==='M'?' myo':''}`).join(', ') + ' ' + ex.unit;
}

function readingsFor(name){ return state.markers.filter(m=>m.name===name).sort((a,b)=> a.date<b.date? -1:1); }
function latestFor(name){ const r=readingsFor(name); return r.length? r[r.length-1] : null; }
function trackedMarkers(){ return [...new Set(state.markers.map(m=>m.name))]; }
function nutrientTotals(){
  const totals={};
  const taken = state.suppLog[todayKey()] || [];
  taken.forEach(id=>{
    const sup = state.supplements.find(x=>x.id===id);
    if(!sup) return;
    (sup.items||[]).forEach(it=>{ totals[it.nutrient] = (totals[it.nutrient]||0) + (+it.amount||0); });
  });
  return totals;
}

    <button class="addmeal" onclick="openModal('supplement')">+ Add to my stack</button>

    <div class="medcaution">
      <div class="mc-t">How to use this well</div>

      A low result usually has several possible causes, and treating the wrong one wastes months. Take these trends to a clinician,
      get the cause identified, and let them set any dose. Upper limits shown here apply to your <b>total</b> daily intake from food,
      fortified products and supplements combined.
    </div>
  `;

function linkedNutrientsFromMarkers(){
  const sex = (state.stats && state.stats.sex) || 'male';
  const out = [];
  trackedMarkers().forEach(name=>{
    const last = latestFor(name); if(!last) return;
    const st = markerStatus(name, last.value, sex);
    if(st && st!=='ok'){
      const M = MARKERS[name];
      (M && M.linked || []).forEach(n=>{ if(!out.includes(n)) out.push(n); });
    }
  });
  return out;
}

/* ============ MACROS ============ */
function dayMeals(){ return state.macroWeek.days[state.macroDay]; }

/* ============ SUGGESTION ENGINE ============
   No model, no server — this reads what's left of today's targets and searches
   the meals and foods you've already logged for the closest fit. It improves as
   the library grows, because there's simply more to match against and repeat
   meals carry a higher usage weight.

   Scoring is a weighted distance in kcal-space between what's remaining and what
   a candidate provides. Protein carries the heaviest weight (it's the macro that
   actually protects muscle in a deficit) and going OVER remaining calories is
   penalised roughly twice as hard as falling short, because overshooting the
   target is worse than leaving a small gap.                                     */
function remainingMacros(){
  const d = dayMeals(), T = DT(d.type), tot = dayTotals(d);
  return {
    kcal: Math.round(T.kcal - tot.kcal),
    p: +(T.p - tot.p).toFixed(1),
    c: +(T.c - tot.c).toFixed(1),
    f: +(T.f - tot.f).toFixed(1)
  };
}
/* A suggestion should fill ONE meal, not the entire rest of the day. This works
   out a sensible size for the next meal by splitting what's left across the
   meals you probably still have, then clamping to a realistic plate. */
function mealSizeTarget(){
  const rem = remainingMacros();
  const logged = dayMeals().meals.length;
  const mealsLeft = Math.max(1, Math.min(4, (logged>=4 ? 1 : 4 - logged)));
  let k = rem.kcal / mealsLeft;
  k = Math.max(180, Math.min(950, k));
  const ratio = rem.kcal>0 ? k / rem.kcal : 1;
  return { kcal:Math.round(k), p:+(rem.p*ratio).toFixed(1), c:+(rem.c*ratio).toFixed(1),
           f:+(rem.f*ratio).toFixed(1), mealsLeft, rem };
}
function fitCost(cand, rem){
  const dK = rem.kcal - cand.kcal;
  const cost = Math.abs(dK)
    + Math.abs(rem.p - cand.p) * 4 * 1.6      // protein gap matters most
    + Math.abs(rem.c - cand.c) * 4 * 0.45
    + Math.abs(rem.f - cand.f) * 9 * 0.45
    + (dK < 0 ? Math.abs(dK) * 1.6 : 0);      // extra penalty for overshooting
  return cost;
}
function costToMatch(cost, rem){
  const scale = Math.max(220, Math.abs(rem.kcal));
  return Math.max(1, Math.min(99, Math.round(100 - (cost/scale)*46)));
}
/* Solve how much of a saved food best fills the gap. Protein-dense foods are
   solved against the protein gap, everything else against calories — then
   clamped so it can never blow past the remaining calories. */
function solvePortion(food, rem){
  if(!food.kcal || food.kcal<=0) return null;
  const pShare = (food.p*4) / food.kcal;
  const byKcal = (rem.kcal / food.kcal) * 100;
  let amt = (pShare > 0.35 && rem.p > 6) ? (rem.p / Math.max(0.1,food.p)) * 100 : byKcal;
  amt = Math.min(amt, byKcal);
  if(!isFinite(amt) || amt <= 0) return null;
  amt = Math.round(amt/5)*5;
  if(amt < 15 || amt > 600) return null;
  const k = food.kcal*amt/100;
  if(k < 40) return null;
  return { amount:amt, kcal:k, p:food.p*amt/100, c:food.c*amt/100, f:food.f*amt/100 };
}
function suggestMeals(){
  const rem = remainingMacros();
  if(rem.kcal < 90) return { rem, tgt:null, list:[], reason: rem.kcal<=0? 'over' : 'tiny' };
  const tgt = mealSizeTarget();          // score against ONE meal's worth
  const out = [];
  const CAPG = 400;                      // no single-food portion beyond this

  // 1 — whole meals you've eaten before
  (state.mealLib||[]).forEach(m=>{
    if(m.kcal > Math.min(rem.kcal, tgt.kcal*1.6)) return;
    const cost = fitCost(m, tgt) - Math.min(150, (m.count||1)*45);   // habit bonus
    out.push({ kind:'meal', title:m.name, sub:(m.foods||[]).map(f=>f.n).slice(0,3).join(' \u00B7 ') || 'Saved meal',
      kcal:Math.round(m.kcal), p:m.p, c:m.c, f:m.f, cost, count:m.count||1, src:m });
  });

  // 2 — a single saved food, portioned to fit this meal
  (state.foodLib||[]).forEach(f=>{
    const sv = solvePortion(f, tgt);
    if(!sv || sv.amount > CAPG) return;
    out.push({ kind:'food', title:`${sv.amount} g ${f.name}`, sub:'Portioned to fit',
      kcal:Math.round(sv.kcal), p:+sv.p.toFixed(1), c:+sv.c.toFixed(1), f:+sv.f.toFixed(1),
      cost: fitCost(sv, tgt) + 20, food:f, amount:sv.amount });
  });

  // 3 — protein source + carb source, both portioned to this meal
  const lib = state.foodLib||[];
  const proteins = lib.filter(f=>f.kcal>0 && (f.p*4)/f.kcal > 0.35).slice(0,8);
  const carbs    = lib.filter(f=>f.kcal>0 && (f.c*4)/f.kcal > 0.5).slice(0,8);
  proteins.forEach(pf=>{
    let pa = Math.round(((tgt.p*0.7) / Math.max(0.1, pf.p)) * 100 / 5)*5;
    if(pa < 20 || pa > CAPG) return;
    const pk = pf.kcal*pa/100;
    if(pk > tgt.kcal*0.85) return;
    carbs.forEach(cf=>{
      if(cf.name===pf.name) return;
      let ca = Math.round(((tgt.kcal - pk) / cf.kcal) * 100 / 5)*5;
      if(ca < 20 || ca > CAPG) return;
      const cand = {
        kcal: pk + cf.kcal*ca/100,
        p: pf.p*pa/100 + cf.p*ca/100,
        c: pf.c*pa/100 + cf.c*ca/100,
        f: pf.f*pa/100 + cf.f*ca/100
      };
      if(cand.kcal > rem.kcal) return;
      out.push({ kind:'combo', title:`${pa} g ${pf.name} + ${ca} g ${cf.name}`,
        sub:'Two foods you log often',
        kcal:Math.round(cand.kcal), p:+cand.p.toFixed(1), c:+cand.c.toFixed(1), f:+cand.f.toFixed(1),
        cost: fitCost(cand, tgt) + 55, combo:[{food:pf,amount:pa},{food:cf,amount:ca}] });
    });
  });

  out.sort((a,b)=>a.cost-b.cost);
  const picked=[], seen={meal:0,food:0,combo:0}, names=new Set();
  for(const o of out){
    if(picked.length>=4) break;
    if(seen[o.kind]>=2) continue;
    if(names.has(o.title)) continue;
    names.add(o.title); seen[o.kind]++; picked.push(o);
  }
  picked.forEach(o=>{ o.match = costToMatch(o.cost, tgt); });
  return { rem, tgt, list:picked, reason:'ok' };
}

function useSuggestion(kind, idx){

function recentMealsRow(){

  const candidates = lib
    .filter(m=>!todayNames.has(m.name))
    .sort((a,b)=>{
      const cd=(b.count||1)-(a.count||1);
      if(cd!==0) return cd;
      return (b.lastISO||'') > (a.lastISO||'') ? 1 : -1;
    })
    .slice(0,5);

      const hay = (x.name+' '+x.tag+' '+x.level+' '+((M.principles||[]).join(' '))+' '+((M.goal||[]).join(' '))).toLowerCase();
      if(!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  };
  const list = PREBUILT.filter(match);
  const grp = (label, key, opts)=>`
    <div class="fgroup"><span class="fglabel">${label}</span>
      <div class="fgchips">${opts.map(o=>`<span class="fchip ${f[key]===o?'on':''}" onclick="setTplFilter('${key}','${o}')">${o}</span>`).join('')}</div>

          </div>
          ${M.principles? `<div class="tplprin">${M.principles.map(pr=>`<span>${pr}</span>`).join('')}</div>`:''}
        </div>
        <span class="arrow">›</span>

function addCustomExercise(muscle){
  const name = (exSearch||'').trim();

  const dup = [...(EXDB[muscle]||[]), ...state.customEx[muscle]].some(n=>n.toLowerCase()===name.toLowerCase());

  saveState();

    const { plan, locked } = getActivePlan();
    if(plan && !locked){
      const t = tierOf(muscle);
      plan.days[state.dayIdx].exercises.push({ id: uid('ce'), muscle, name, unit:'kg', target:`${t.lo}–${t.hi} reps`, sets:[{w:null,r:null},{w:null,r:null},{w:null,r:null}] });
    }
    workoutAddMode = false;

  }
  if(swapTarget){

      const ex = plan.days[swapTarget.di].exercises[swapTarget.ei];
      const old = ex.name;
      ex.name = name; ex.muscle = muscle;

      const nk = `${state.active.id}|w${state.week}|d${swapTarget.di}|${ex.id}`;
      state.notes[nk] = (state.notes[nk]? state.notes[nk]+' ' : '') + `Replaced ${old}.`;
    }
    swapTarget = null;
    closeModal(); render();
    return;
  }
  const plan = state.templates.custom.find(p=>p.id===state.templates.selectedCustomId);

function effMacro(f){
  const amt = parseFloat(f.amount);
  const scale = (f.basis==='per100' && amt>0) ? amt/100 : 1;
  return { kcal:(+f.kcal||0)*scale, p:(+f.p||0)*scale, c:(+f.c||0)*scale, f:(+f.f||0)*scale };
}

/* Update a food macro WITHOUT re-rendering, so the field keeps focus and the
   keyboard stays up. The live breakdown is refreshed in place instead. */
function updFoodQuiet(i, field, val){
  if(!mealDraft || !mealDraft.foods[i]) return;
  mealDraft.foods[i][field] = val;
  refreshMealTotals();
}
/* Move focus to the next macro field on Enter or when a field is filled, so
   logging a food is: type kcal → next → protein → next → carbs → next → fat.
   Chrome hides the keyboard on a full re-render; jumping focus directly avoids
   that entirely. */
function macroKey(ev, i, field){
  if(ev.key === 'Enter'){ ev.preventDefault(); focusNextMacro(i, field); }
}
function focusNextMacro(i, field){
  const order = ['kcal','p','c','f'];
  const idx = order.indexOf(field);
  if(idx < 0) return;
  if(idx < order.length-1){
    const nxt = document.querySelector(`[data-macro="${i}-${order[idx+1]}"]`);
    if(nxt){ nxt.focus(); nxt.select && nxt.select(); return; }
  } else {
    // last macro filled — jump to the amount field if it exists, else blur
    const amt = document.querySelector(`[data-amt="${i}"]`);
    if(amt){ amt.focus(); amt.select && amt.select(); return; }
    const el = document.activeElement; if(el) el.blur();
  }
}
/* Recompute the running totals + per-food live result in place, no re-render. */
function refreshMealTotals(){
  if(!mealDraft) return;
  const t = mealDraft.foods.reduce((a,f)=>{ const e=effMacro(f); return { kcal:a.kcal+e.kcal, p:a.p+e.p, c:a.c+e.c, f:a.f+e.f }; }, {kcal:0,p:0,c:0,f:0});
  const box = document.getElementById('mealRunning');
  if(box) box.innerHTML = `<b>${Math.round(t.kcal)}</b> kcal · <b>${+t.p.toFixed(1)}</b> P · <b>${+t.c.toFixed(1)}</b> C · <b>${+t.f.toFixed(1)}</b> F`;
  mealDraft.foods.forEach((f,i)=>{
    const e = effMacro(f); const amt = parseFloat(f.amount);
    const hasRef = (+f.kcal||0)>0 || (+f.p||0)>0 || (+f.c||0)>0 || (+f.f||0)>0;
    const r = document.querySelector(`[data-result="${i}"]`);
    if(r && f.basis==='per100'){
      r.className = `fbresult ${amt>0&&hasRef?'live':''}`;
      r.innerHTML = amt>0 && hasRef
        ? `<div class="frtop">${amt} g / ml of ${f.name||'this food'}</div>
           <div class="frnums"><b>${Math.round(e.kcal)}</b> kcal <span class="sep">·</span> <b>${+e.p.toFixed(1)}</b> g P <span class="sep">·</span> <b>${+e.c.toFixed(1)}</b> g C <span class="sep">·</span> <b>${+e.f.toFixed(1)}</b> g F</div>`
        : `<span class="muted">${hasRef? 'Enter the amount above — the breakdown fills in automatically.' : 'Enter the per-100 macros, then the amount you ate.'}</span>`;
    }
  });
}

/* Map the many names labs use to our canonical marker keys. */
const MARKER_SYNONYMS = {
  'Haemoglobin': ['haemoglobin','hemoglobin','hgb','hb'],
  'Ferritin': ['ferritin'],
  'Vitamin D (25-OH)': ['vitamin d','25-oh','25 oh','25-hydroxy','25 hydroxy','cholecalciferol'],
  'Vitamin B12': ['vitamin b12','b12','cobalamin'],
  'Folate': ['folate','folic acid'],
  'TSH': ['tsh','thyroid stimulating','thyroid-stimulating'],
  'Fasting glucose': ['fasting glucose','glucose fasting','fasting blood sugar','fbs','glucose'],
  'HbA1c': ['hba1c','a1c','glycated','glycosylated'],
  'LDL cholesterol': ['ldl'],
  'HDL cholesterol': ['hdl'],
  'Triglycerides': ['triglycerides','triglyceride','tg'],
  'Total testosterone': ['testosterone total','total testosterone','testosterone'],
  'Creatinine': ['creatinine'],
};
async function readReportPDF(file){
  if(!file) return;
  const status = document.getElementById('pdfStatus');
  const set = (msg,cls='')=>{ if(status) status.innerHTML = `<div class="pdfmsg ${cls}">${msg}</div>`; };
  set('Reading "'+file.name+'"…');
  try{
    if(!window.pdfjsLib){
      await new Promise((res,rej)=>{
        const sc=document.createElement('script');
        sc.src='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
        sc.onload=res; sc.onerror=()=>rej(new Error('network'));
        document.head.appendChild(sc);
      });
      window.pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    }
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
    let text='';
    for(let i=1;i<=pdf.numPages;i++){
      const page=await pdf.getPage(i);
      const content=await page.getTextContent();
      text += ' ' + content.items.map(it=>it.str).join(' ');
    }
    const found = extractMarkers(text);
    if(!found.length){
      set("Couldn't find recognisable values in this PDF. It may be a scanned image rather than text — enter the values manually below.",'warn');
      markerExtracted=null;
    } else {
      // try to pull a test date too
      const dm = text.match(/(\d{1,2})[\/\-\s](\d{1,2}|[A-Za-z]{3,9})[\/\-\s](\d{2,4})/);
      if(dm && !markerDraft.date){ /* leave date to user; formats vary too much to trust */ }
      markerExtracted = found;
      markerReportDate = markerReportDate || todayKey();
      set(`Found ${found.length} value${found.length===1?'':'s'}. Check each below before logging.`,'ok');
    }
    renderModal('marker');
  }catch(e){
    set(e.message==='network'
      ? "Couldn't load the PDF reader — check your connection and try again, or enter values manually."
      : "Couldn't read that file. Enter the values manually below.",'warn');
  }
}
/* Scan extracted text for "marker name ... number", validated against plausible
   ranges so we don't grab a reference-range bound or an unrelated figure. */
function extractMarkers(text){
  const flat = text.replace(/\s+/g,' ');
  const out = [];
  Object.keys(MARKER_SYNONYMS).forEach(canon=>{
    for(const syn of MARKER_SYNONYMS[canon]){
      // Anchor on the synonym, then skip any parenthetical/qualifier like "(25-OH)"
      // or a colon before the real number. Prefer a number that is immediately
      // followed by a unit or whitespace, so "25-OH" inside the name is ignored.
      const esc = syn.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
      const re = new RegExp(esc + '\\s*(?:cholesterol)?\\s*(?:\\([^)]*\\))?\\s*[:=]?\\s*(\\d+\\.?\\d*)\\s*(?:mg|ng|pg|g\\/|mmol|miu|iu|%|mcg|umol)?','i');
      const mm = flat.match(re);
      if(mm){
        const v = parseFloat(mm[1]);
        if(plausibleMarker(canon, v)){
          if(!out.some(o=>o.name===canon)) out.push({ name:canon, value:v });
          break;
        }
      }
    }
  });
  return out;
}
/* Sanity band per marker — wide, only to reject obviously-wrong captures. */
function plausibleMarker(name, v){
  const B = {
    'Haemoglobin':[4,25],'Ferritin':[1,2000],'Vitamin D (25-OH)':[3,150],'Vitamin B12':[50,2000],
    'Folate':[0.5,40],'TSH':[0.01,60],'Fasting glucose':[30,500],'HbA1c':[3,20],
    'LDL cholesterol':[20,400],'HDL cholesterol':[10,150],'Triglycerides':[20,1000],
    'Total testosterone':[0.5,2000],'Creatinine':[0.2,15],
  }[name];
  return B ? (v>=B[0] && v<=B[1]) : true;
}

function undoExtracted(i){

  markerDraft.name = x.name;
  markerDraft.value = String(x.value);
  if(markerReportDate) markerDraft.date = markerReportDate;
  renderModal('marker');
  // bring the form into view so the user sees it filled
  setTimeout(()=>{
    const el = document.querySelector('.ordiv');
    if(el && el.scrollIntoView) el.scrollIntoView({ behavior:'smooth', block:'start' });
  }, 60);
}

/* ============================================================
   BARCODE SCANNER — html5-qrcode + Open Food Facts
   Uses the html5-qrcode library (verified v2.3.8), which manages the
   entire camera lifecycle, scan-region UI and decode loop internally.
   It uses the native BarcodeDetector where available and falls back to
   the bundled ZXing engine everywhere else — the engine was verified
   here by generating and decoding a real EAN-13 in a test harness.
   A screen wake-lock stops the phone display sleeping mid-scan.
   ============================================================ */
let bcScanner = null;
let bcWakeLock = null;
let bcFoodIdx = null;
let bcHintTimer = null;

async function startBarcodeScanner(foodIdx){
  bcFoodIdx = foodIdx;
  const overlay = document.createElement('div');
  overlay.className = 'bc-overlay'; overlay.id = 'bcOverlay';
  overlay.innerHTML = `
    <div class="bc-header">
      <span class="bc-title">Scan barcode</span>
      <span class="bc-close" onclick="closeBarcodeScanner()">✕</span>
    </div>
    <div id="bcReader" class="bc-reader"></div>
    <div class="bc-hint" id="bcHint">Point the camera at the barcode.<br>Hold steady inside the box — it reads automatically, no button needed.</div>
    <div class="bc-status"><div id="bcMsg" class="labelmsg" style="display:none"></div></div>
    <button class="scanbtn secondary" style="margin:0 18px 18px; width:auto;" onclick="closeBarcodeScanner(); document.getElementById('labelInput${foodIdx}').click()">Having trouble? 📷 Use the label photo instead</button>`;
  document.body.appendChild(overlay);
  const setMsg=(txt,cls='')=>{ const m=document.getElementById('bcMsg'); if(!m)return; m.style.display=txt?'':'none'; m.className='labelmsg '+(cls||''); m.textContent=txt; };

  // Keep the screen awake while scanning (this is why it went black before)
  try{ if(navigator.wakeLock) bcWakeLock = await navigator.wakeLock.request('screen'); }catch(_){}

  // Load html5-qrcode (verified: file lives at package root, global Html5Qrcode)
  try{
    if(!window.Html5Qrcode){
      setMsg('Starting camera…');
      await new Promise((res,rej)=>{
        const sc=document.createElement('script');
        sc.src='https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js';
        sc.onload=res;
        sc.onerror=()=>{
          const sc2=document.createElement('script');
          sc2.src='https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js';
          sc2.onload=res; sc2.onerror=rej;
          document.head.appendChild(sc2);
        };
        document.head.appendChild(sc);
      });
    }
    setMsg('');

    const F = Html5QrcodeSupportedFormats;
    bcScanner = new Html5Qrcode('bcReader', {
      formatsToSupport: [F.EAN_13, F.EAN_8, F.UPC_A, F.UPC_E, F.CODE_128],
      experimentalFeatures: { useBarCodeDetectorIfSupported: true },
      verbose: false
    });

    let busy = false;
    await bcScanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 280, height: 170 } },
      async (decodedText) => {
        if(busy) return;
        busy = true;
        try{ bcScanner.pause(true); }catch(_){}
        setMsg('Found '+decodedText+' — looking up…');
        const ok = await lookupBarcode(decodedText, foodIdx);
        if(!ok && document.getElementById('bcOverlay')){
          setTimeout(()=>{
            try{ bcScanner.resume(); }catch(_){}
            busy = false;
          }, 1400);
        }
      },
      () => {} // per-frame no-detection callback — normal, ignore
    );

    // If nothing found after 10s, offer practical tips
    bcHintTimer = setTimeout(()=>{
      const h=document.getElementById('bcHint');
      if(h) h.innerHTML = 'Still scanning… Tips: move 10–15 cm away, make sure the barcode is flat and well-lit, and avoid glare.';
    }, 10000);

  }catch(e){
    setMsg('Camera could not start ('+(e && e.message ? e.message : 'permission or device issue')+'). Use the label photo instead.','warn');
  }
}

function closeBarcodeScanner(){
  if(bcHintTimer){ clearTimeout(bcHintTimer); bcHintTimer=null; }
  if(bcWakeLock){ try{ bcWakeLock.release(); }catch(_){} bcWakeLock=null; }
  if(bcScanner){
    const s=bcScanner; bcScanner=null;
    try{ s.stop().then(()=>{ try{ s.clear(); }catch(_){} }).catch(()=>{}); }catch(_){}
  }
  const o=document.getElementById('bcOverlay'); if(o) o.remove();
}

async function lookupBarcode(barcode, foodIdx){
  const setMsg=(txt,cls='')=>{ const m=document.getElementById('bcMsg'); if(!m) return; m.style.display=txt?'':'none'; m.className='labelmsg '+(cls||''); m.textContent=txt; };
  try{
    // Request only the fields we need — keeps the response small
    const url=`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(barcode)}.json?fields=product_name,brands,nutriments`;
    const res = await fetch(url);
    const data = await res.json();

    // status 1 = found, 0 = not found (both return HTTP 200 — known API quirk)
    if(!data || data.status !== 1 || !data.product){
      setMsg('Product not in the database — point at another product, or close and use the label photo.','warn');
      return false;
    }
    const n = data.product.nutriments || {};
    const name = [data.product.brands, data.product.product_name].filter(Boolean).join(' — ');

    // Open Food Facts stores per-100g values under these keys
    const kcal = n['energy-kcal_100g'] ?? n['energy_100g'] ?? null;
    const p    = n['proteins_100g']    ?? null;
    const c    = n['carbohydrates_100g'] ?? null;
    const f    = n['fat_100g']          ?? null;

    if(kcal==null && p==null && c==null && f==null){
      setMsg('Product found but its nutrition data is missing — keep scanning or use the label photo.','warn');
      return false;
    }
    // Fill the food row
    if(!mealDraft || !mealDraft.foods[foodIdx]) return false;
    if(kcal!=null) mealDraft.foods[foodIdx].kcal = String(Math.round(kcal));
    if(p!=null)    mealDraft.foods[foodIdx].p    = String(+p.toFixed(1));
    if(c!=null)    mealDraft.foods[foodIdx].c    = String(+c.toFixed(1));
    if(f!=null)    mealDraft.foods[foodIdx].f    = String(+f.toFixed(1));
    if(name && !mealDraft.foods[foodIdx].name) mealDraft.foods[foodIdx].name = name;
    mealDraft.foods[foodIdx].basis='per100';

    closeBarcodeScanner();
    renderModal('addMeal');
    // Show confirmation after re-render
    const s=document.getElementById('labelStatus'+foodIdx);
    if(s){
      const bits=[]; if(kcal!=null)bits.push(Math.round(kcal)+' kcal'); if(p!=null)bits.push(p.toFixed(1)+'g P'); if(c!=null)bits.push(c.toFixed(1)+'g C'); if(f!=null)bits.push(f.toFixed(1)+'g F');
      s.innerHTML=`<div class="labelmsg ok">✓ Barcode found: ${name||barcode}<br>${bits.join(' · ')} (per 100g from Open Food Facts). Check before saving.</div>`;
    }
    return true;
  }catch(e){
    setMsg('Lookup failed — check your connection and try again.','warn');
    return false;
  }
}

/* ============ QUICK ENTRY ============
   Sends a natural-language meal description to the Worker's /parse_meal route
   (Sonnet 4.6, text only, fast + cheap) and pre-fills the whole Add Meal form. */
async function parseQuickEntry(){

  const text = input.value.trim();

  if(!VISION_ENDPOINT){ status.innerHTML='<div class="labelmsg warn">Worker not configured.</div>'; return; }

  btn.disabled = true;
  btn.textContent = '…';
  status.innerHTML = '<div class="labelmsg">Estimating macros…</div>';

  try{
    const res = await fetch(VISION_ENDPOINT, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ action:'parse_meal', text })
    });
    if(!res.ok) throw new Error('Worker returned '+res.status);
    const data = await res.json();
    if(data.error) throw new Error(data.error);

    // Pre-fill the meal draft
    if(!mealDraft) mealDraft = { name:'', time:'', foods:[] };
    if(data.name && !mealDraft.name) mealDraft.name = data.name;
    if(!mealDraft.time){ const h=new Date().getHours(); mealDraft.time=(h%12||12)+':00 '+(h<12?'AM':'PM'); }

    // Replace any empty placeholder food rows with the parsed foods
    const newFoods = (data.foods||[]).map(f=>({
      name: f.n,
      kcal: String(f.kcal),
      p:    String(f.p),
      c:    String(f.c),
      f:    String(f.f),
      basis:'direct',
      amount:'',
    }));
    if(newFoods.length){
      // keep any foods the user already filled in; drop empty placeholders
      mealDraft.foods = [
        ...mealDraft.foods.filter(f=>f.name&&f.name.trim()),
        ...newFoods
      ];
    }

    // Re-render the modal so the new foods appear
    renderModal('addMeal');

    const s=document.getElementById('qiStatus');
    if(s && data.totals){
      s.innerHTML=`<div class="labelmsg ok">✓ Estimated: ${Math.round(data.totals.kcal)} kcal · ${data.totals.p}g P · ${data.totals.c}g C · ${data.totals.f}g F — check and adjust before saving.</div>`;
    }
  }catch(e){
    const s=document.getElementById('qiStatus');
    if(s) s.innerHTML=`<div class="labelmsg warn">Could not estimate — check your connection or fill in manually.</div>`;
    const b=document.getElementById('qiBtn');
    if(b){ b.disabled=false; b.textContent='Go'; }
  }
}

/* ============ NUTRITION LABEL SCANNER ============
   Reads a photo of a nutrition panel with on-device OCR (Tesseract.js) and
   fills the per-100 macro fields. Honest limitation: unlike the PDF blood
   reader — which parses a real text layer — OCR on a phone photo is only as
   good as the shot. Glare, angle, curved packaging and tiny print all cause
   misreads, so the values are shown for confirmation and never saved blind. */
async function scanLabelImage(file, idx){
  if(!file) return;
  const status = document.getElementById('labelStatus'+idx);
  const set = (msg,cls='')=>{ if(status) status.innerHTML = `<div class="labelmsg ${cls}">${msg}</div>`; };
  // If a vision backend is configured, use it — it's dramatically better on
  // hard photos. Otherwise fall back to on-device OCR, so the app still works
  // with no backend at all.
  if(VISION_ENDPOINT){
    try{
      set('Reading the label…');
      const parsed = await scanViaVision(file);
      if(parsed && parsed.found){
        applyScannedMacros(parsed, idx, status);
        return;
      }
      set("The reader couldn't find clear macros. Try a straighter, brighter shot — or type them in below.",'warn');
      return;
    }catch(e){
      // fall through to on-device OCR if the backend is unreachable
      set('Vision reader unavailable, trying on-device…');
    }
  }
  await scanLabelOCR(file, idx, set);
}
/* Send the photo to the vision backend (your Cloudflare Worker), which calls a
   multimodal model and returns clean macros. The Worker holds the API key —
   never the app. */
async function scanViaVision(file){
  // Downscale + compress before upload: smaller payload, faster, and the model
  // reads a right-sized image better than a giant raw phone photo.
  let b64, mime;
  try{
    const prepped = await compressForUpload(file);
    b64 = prepped.b64; mime = prepped.mime;
  }catch(_){
    b64 = await fileToBase64(file); mime = file.type || 'image/jpeg';
  }
  const res = await fetch(VISION_ENDPOINT, {
    method:'POST',
    headers:{ 'Content-Type':'application/json' },
    body: JSON.stringify({ image: b64, mime })
  });
  if(!res.ok) throw new Error('backend '+res.status);
  const data = await res.json();
  // Worker returns { kcal, p, c, f } per 100g (nulls allowed)
  const clamp=(v,hi)=> (v==null||isNaN(v)||v<0||v>hi)? null : +v;
  const out = { kcal:clamp(data.kcal,900), p:clamp(data.p,100), c:clamp(data.c,100), f:clamp(data.f,100), basis: data.per100===false? 'serving':'per100', mismatch: !!data.mismatch };
  out.found = [out.kcal,out.p,out.c,out.f].some(v=>v!=null);
  return out;
}
/* Resize the longest edge to ~2048px and JPEG-compress at high quality. Dense,
   low-contrast labels need the extra resolution for the model to keep each
   number aligned with its row — 1568 was losing grid detail on hard photos. */
async function compressForUpload(file){
  const img = await loadImageFromFile(file);
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const longest = Math.max(w,h);
  const scale = longest > 2048 ? 2048/longest : 1;
  w = Math.round(w*scale); h = Math.round(h*scale);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(img, 0, 0, w, h);
  const dataUrl = c.toDataURL('image/jpeg', 0.95);
  return { b64: dataUrl.split(',')[1], mime:'image/jpeg' };
}
function fileToBase64(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(String(r.result).split(',')[1]);   // strip data: prefix
    r.onerror=()=>rej(new Error('read'));
    r.readAsDataURL(file);
  });
}
function applyScannedMacros(parsed, idx, status){
  ['kcal','p','c','f'].forEach(k=>{ if(parsed[k]!=null){ mealDraft.foods[idx][k]=String(parsed[k]); } });
  mealDraft.foods[idx].basis='per100';
  renderModal('addMeal');
  const s2=document.getElementById('labelStatus'+idx);
  if(s2){
    const bits=[]; if(parsed.kcal!=null)bits.push(parsed.kcal+' kcal'); if(parsed.p!=null)bits.push(parsed.p+'g P'); if(parsed.c!=null)bits.push(parsed.c+'g C'); if(parsed.f!=null)bits.push(parsed.f+'g F');
    if(parsed.mismatch){
      s2.innerHTML=`<div class="labelmsg warn">Read ${bits.join(' · ')}, but these numbers don't quite add up — the calories and macros disagree. The photo may have been misread. Please check each value against the label before saving.</div>`;
    } else {
      s2.innerHTML=`<div class="labelmsg ok">Read ${bits.join(' · ')}${parsed.basis==='serving'?' — <b>per serving</b>, not per 100g. Check against the label.':' (per 100g)'}. Correct anything that looks off before saving.</div>`;
    }
  }
}
async function scanLabelOCR(file, idx, set){
  try{
    if(!window.Tesseract){
      await new Promise((res,rej)=>{
        const sc=document.createElement('script');
        sc.src='https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/5.1.0/tesseract.min.js';
        sc.onload=res; sc.onerror=()=>rej(new Error('network'));
        document.head.appendChild(sc);
      });
    }
    let source; try{ source = await preprocessForOCR(file); }catch(_){ source = file; }
    set('Reading the label… <b id="ocrpct'+idx+'">0%</b>');
    const { data } = await window.Tesseract.recognize(source, 'eng', {
      logger: mm=>{ if(mm.status==='recognizing text'){ const e=document.getElementById('ocrpct'+idx); if(e) e.textContent=Math.round(mm.progress*100)+'%'; } }
    });
    const parsed = parseNutritionLabel(data.text || '');
    if(!parsed.found){
      set("Couldn't read the macros clearly. Fill the frame with just the nutrition panel, hold the phone flat and square to it, avoid glare — or type the values in below.",'warn');
      return;
    }
    applyScannedMacros(parsed, idx, set===undefined? null : document.getElementById('labelStatus'+idx));
  }catch(e){
    set(e.message==='network'
      ? "Couldn't load the label reader — check your connection, or type the values in below."
      : "Couldn't read that image. Type the values in below.",'warn');
  }
}
/* Load a File into an Image element. */
function loadImageFromFile(file){
  return new Promise((res,rej)=>{
    const url=URL.createObjectURL(file);
    const img=new Image();
    img.onload=()=>res(img);
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src=url;
  });
}
/* Grayscale + percentile contrast-stretch + sensible resize. OCR engines read
   high-contrast, adequately-sized text far better than a raw phone photo, and
   the percentile stretch is robust to the glare highlights these labels have.
   No hard binarisation — that destroys text under uneven lighting. */
async function preprocessForOCR(file){
  const img = await loadImageFromFile(file);
  let w = img.naturalWidth || img.width, h = img.naturalHeight || img.height;
  const shorter = Math.min(w,h);
  const scale = Math.max(0.5, Math.min(2, 1200/shorter));   // aim ~1200px short side
  w = Math.round(w*scale); h = Math.round(h*scale);
  const c = document.createElement('canvas'); c.width=w; c.height=h;
  const ctx = c.getContext('2d');
  ctx.drawImage(img, 0, 0, w, h);
  const id = ctx.getImageData(0,0,w,h); const d = id.data;
  const lum = new Uint8ClampedArray(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    lum[j] = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
  }
  const hist = new Array(256).fill(0);
  for(let j=0;j<lum.length;j++) hist[lum[j]]++;
  const total = lum.length;
  let acc=0, lo=0, hi=255;
  for(let v=0;v<256;v++){ acc+=hist[v]; if(acc >= total*0.02){ lo=v; break; } }
  acc=0; for(let v=255;v>=0;v--){ acc+=hist[v]; if(acc >= total*0.02){ hi=v; break; } }
  const range = Math.max(1, hi-lo);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    let v = (lum[j]-lo)/range*255; v = v<0?0:v>255?255:v;
    d[i]=d[i+1]=d[i+2]=v;
  }
  ctx.putImageData(id,0,0);
  return c;
}
/* Pull the four macros out of OCR'd label text. Nutrition panels vary wildly,
   so we match keyword → nearby number, prefer a "per 100g" column when the
   label has one, and fall back to per-serving (flagged to the user). */
function parseNutritionLabel(raw){
  const text = raw.replace(/[|]/g,' ').replace(/[ \t]+/g,' ');
  const lines = text.split(/\n/).map(l=>l.trim()).filter(Boolean);
  const flat = text.replace(/\s+/g,' ');
  const low = flat.toLowerCase();
  const hasPer100 = /per\s*100\s*(g|ml)/i.test(flat) || /100\s*(g|ml)/i.test(flat);

  /* Which column is per-100g? Indian FSSAI labels list it FIRST
     ("per 100g | per serving | %RDA"); European labels often list it LAST
     ("per serving | per 100g"). Decide ONLY from the column-header row, not
     from stray "100ml"/"200mL" text in the serving-size line above it. */
  let euOrder = false;
  const headerLine = lines.find(l=>
    /per\s*100|100\s*g|100\s*ml|amount\s*per/i.test(l) && /serv/i.test(l)
    && !/serving\s*size|serve\s*size|servings?\s*per\s*(pack|container|day)|per\s*(pack|container)/i.test(l));
  if(headerLine){
    const h = headerLine.toLowerCase();
    const h100 = h.search(/100/);
    const hServ = h.search(/serv/);
    euOrder = (hServ >= 0 && h100 >= 0 && hServ < h100);
  }

  function valFor(patterns){
    for(const line of lines){
      if(patterns.some(p=>p.test(line))){
        // drop any %RDA figures (a number immediately followed by %) first
        const cleaned = line.replace(/(\d+\.?\d*)\s*%/g, ' ');
        const nums = (cleaned.match(/\d+\.?\d*/g)||[]).map(parseFloat);
        if(!nums.length) continue;
        return euOrder ? nums[nums.length-1] : nums[0];
      }
    }
    for(const p of patterns){
      const m = flat.match(new RegExp(p.source+'[^0-9]{0,15}(\\d+\\.?\\d*)','i'));
      if(m) return parseFloat(m[1]);
    }
    return null;
  }
  let kcal = valFor([/energy/i, /calorie/i, /kcal/i]);
  // energy sometimes shows kJ first then kcal — if the number is huge it's kJ
  if(kcal!=null && kcal>900 && /kj/i.test(flat)){
    const kc = flat.match(/(\d+\.?\d*)\s*kcal/i); if(kc) kcal=parseFloat(kc[1]);
  }
  // OCR commonly swaps i↔l↔1 and o↔0, so match protein/carb/fat loosely
  const p = valFor([/prote[il1]n/i, /prot[e3][il1]n/i]);
  const c = valFor([/carb[o0]hydrate/i, /\bcarb/i, /total\s*carb/i]);
  const f = valFor([/total\s*fat/i, /\bfat\b/i, /\bfa[t7]\b/i]);

  const found = [kcal,p,c,f].some(v=>v!=null);
  const clamp=(v,hi)=> (v==null||v<0||v>hi)? null : v;
  return {
    found,
    kcal: clamp(kcal,900), p: clamp(p,100), c: clamp(c,100), f: clamp(f,100),
    basis: hasPer100? 'per100' : 'serving'
  };
}

function saveMeal(){
  const kept = mealDraft.foods.filter(f=>f.name.trim()!=='' || (+f.kcal||0)>0);
  const totals = kept.reduce((a,f)=>{ const e=effMacro(f); return { kcal:a.kcal+e.kcal, p:a.p+e.p, c:a.c+e.c, f:a.f+e.f }; }, {kcal:0,p:0,c:0,f:0});
  // Remember every per-100 food so it can be reused on later days by just typing the amount.
  kept.forEach(f=>{ if(f.basis==='per100' && f.name.trim()!=='' && (+f.kcal||0)>0) saveFoodToLib(f); });
  const meal = {
    name: mealDraft.name || 'Meal', time: mealDraft.time || '—',
    kcal: +totals.kcal.toFixed(1), p: +totals.p.toFixed(1), c: +totals.c.toFixed(1), f: +totals.f.toFixed(1),
    foods: kept.map(f=>{
      const e = effMacro(f);
      const serv = f.basis==='per100' && parseFloat(f.amount)>0 ? `${parseFloat(f.amount)} g/ml` : `${Math.round(e.kcal)} kcal`;
      return { n:f.name || 'Item', s:serv };
    }),
    foodsFull: kept.map(f=>({ ...f }))   // lossless: lets edit re-open the calculator exactly as entered
  };
  if(mealEditIndex===null) dayMeals().meals.push(meal);
  else dayMeals().meals[mealEditIndex] = meal;
  rememberMeal(meal);
  mealDraft = null; mealEditIndex = null;
  closeModal(); render();
}
/* Every saved meal joins a growing library. Repeats bump a counter instead of
   duplicating, so meals you actually eat often rise to the top of suggestions. */
function rememberMeal(meal){
  if(!state.mealLib) state.mealLib = [];
  if(meal.kcal < 30) return;                       // ignore near-empty entries
  const key = (meal.name||'').trim().toLowerCase();
  const hit = state.mealLib.find(m=>
    m.name.trim().toLowerCase()===key && Math.abs(m.kcal-meal.kcal) < Math.max(40, meal.kcal*0.12));
  if(hit){
    hit.count = (hit.count||1) + 1;
    hit.lastISO = todayISO();
    hit.kcal = Math.round((hit.kcal + meal.kcal)/2);   // drift toward your usual portion
    hit.p = +(((hit.p + meal.p)/2).toFixed(1));
    hit.c = +(((hit.c + meal.c)/2).toFixed(1));
    hit.f = +(((hit.f + meal.f)/2).toFixed(1));
    if(meal.foodsFull && meal.foodsFull.length) hit.foodsFull = meal.foodsFull.map(x=>({...x}));
  } else {
    state.mealLib.push({
      name: meal.name || 'Meal', kcal: Math.round(meal.kcal),
      p: +meal.p.toFixed(1), c: +meal.c.toFixed(1), f: +meal.f.toFixed(1),
      foods: (meal.foods||[]).map(x=>({...x})),
      foodsFull: (meal.foodsFull||[]).map(x=>({...x})),
      count: 1, lastISO: todayISO()
    });
  }
  if(state.mealLib.length > 120) state.mealLib = state.mealLib.slice(-120);
}

  if(i>=0) state.foodLib[i] = entry; else state.foodLib.push(entry);

/* ============ BACKUP / RESTORE ============ */
/* ---- Backup payload builders ---- */
function buildBackup(scope){
  const stamp = new Date().toISOString();
  if(scope==='all'){
    const profiles = loadProfiles()||[];
    const data = {};
    profiles.forEach(pr=>{
      try{ const raw = localStorage.getItem('ironlog_v5__'+pr.id); if(raw) data[pr.id] = JSON.parse(raw); }catch(e){}
    });
    return { kind:'ironlog-full-backup', version:1, exportedAt:stamp, profileCount:profiles.length, profiles, data };
  }
  let mine = {};
  try{ mine = JSON.parse(localStorage.getItem(SKEY) || '{}'); }catch(e){}
  return { kind:'ironlog-profile-backup', version:1, exportedAt:stamp,
           profileId:currentProfileId, profile:profileById(currentProfileId), data:mine };
}
function downloadJSON(obj, filename){
  const blob = new Blob([JSON.stringify(obj, null, 2)], { type:'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
  return true;
}
function stampName(prefix){
  const d = new Date();
  const pad = n => String(n).padStart(2,'0');
  return `${prefix}-${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}.json`;
}
function exportBackup(){
  try{
    saveState();                                  // flush anything pending first
    const payload = buildBackup('profile');
    downloadJSON(payload, stampName('ironlog-backup'));
    markBackedUp();
  }catch(e){ alert('Export failed: '+e.message); }
}
function exportFullBackup(){
  try{
    saveState();
    downloadJSON(buildBackup('all'), stampName('ironlog-full-backup'));
    markBackedUp();
  }catch(e){ alert('Export failed: '+e.message); }
}
/* Backup reminder: store the date of the last export per profile, so the app
   can gently nudge if it's been a while. Stored globally (not per-profile) so
   it survives profile switches. */
function markBackedUp(){
  try{ localStorage.setItem('ironlog_last_backup', todayISO()); }catch(e){}
}
function daysSinceBackup(){
  try{
    const d = localStorage.getItem('ironlog_last_backup');
    if(!d) return null;                            // never backed up
    return daysBetween(d, todayISO());
  }catch(e){ return null; }
}
/* How much unsaved history exists — used to decide whether a nudge is worth it. */
function loggedEntryCount(){
  return state.weighIns.length + Object.values(state.logs).filter(l=>l.logged).length;
}

/* ---- Restore: understands full backups, profile backups, and legacy raw state ---- */
function importBackup(file){
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data || typeof data!=='object') throw new Error('Not a valid backup file');

      if(data.kind === 'ironlog-full-backup'){
        const n = (data.profiles||[]).length;
        if(!confirm(`Restore FULL backup?\n\n${n} profile${n===1?'':'s'} from ${new Date(data.exportedAt).toLocaleString()}.\n\nThis replaces all profiles and data currently on this device.`)) return;
        suppressSave = true;
        saveProfiles(data.profiles||[]);
        Object.keys(data.data||{}).forEach(pid=>{
          try{ localStorage.setItem('ironlog_v5__'+pid, JSON.stringify(data.data[pid])); }catch(err){}
        });
        try{ localStorage.removeItem(CKEY); }catch(err){}
        setTimeout(()=>location.reload(), 80);
        return;
      }

      if(data.kind === 'ironlog-profile-backup'){
        if(!currentProfileId){ alert('Log in to a profile first, then restore.'); return; }
        if(!confirm(`Restore this profile backup from ${new Date(data.exportedAt).toLocaleString()}?\n\nIt replaces the data in your current profile (${currentProfileName()}).`)) return;
        suppressSave = true;
        localStorage.setItem(SKEY, JSON.stringify(data.data||{}));
        setTimeout(()=>location.reload(), 80);
        return;
      }

      // legacy: the raw state object we used to export
      if(!currentProfileId){ alert('Log in to a profile first, then restore.'); return; }
      if(!confirm('Restore this backup into your current profile? It replaces existing data.')) return;
      suppressSave = true;
      localStorage.setItem(SKEY, JSON.stringify(data));
      setTimeout(()=>location.reload(), 80);
    }catch(err){ alert('Could not restore this file: '+err.message); }
  };
  reader.readAsText(file);
}

/* Register an inline service worker (Blob) so the single file works offline
   once it's served over https. Silently no-ops on file:// or unsupported browsers. */
function registerSW(){
  if(!('serviceWorker' in navigator)) return;
  try{
    const swCode = `
      const C='ironlog-cache-v1';
      self.addEventListener('install', e=>{ self.skipWaiting(); });
      self.addEventListener('activate', e=>{ e.waitUntil(self.clients.claim()); });
      self.addEventListener('fetch', e=>{
        if(e.request.method!=='GET') return;
        e.respondWith(
          caches.open(C).then(cache=>
            cache.match(e.request).then(hit=>{
              const net = fetch(e.request).then(res=>{
                if(res && res.status===200 && res.type!=='opaque') cache.put(e.request, res.clone());
                return res;
              }).catch(()=> hit || caches.match('./'));
              return hit || net;
            })
          )
        );
      });`;
    const url = URL.createObjectURL(new Blob([swCode], { type:'text/javascript' }));
    navigator.serviceWorker.register(url).catch(()=>{});
  }catch(e){}
}

}

        })()}
        <div class="authfield"><label>PIN (optional)</label>
          <div class="pinboxes">
            ${[0,1,2,3].map(i=>`<input id="auPin${i}" type="tel" inputmode="numeric" maxlength="1" oninput="pinAdvance(this,${i},'auPin')">`).join('')}
          </div>
        </div>
        <button class="authbtn" onclick="doCreate()">Start training</button>
        <div class="autherr" id="auErr"></div>
      </div>
      <div class="authlink" onclick="authGo('${loadProfiles().length? 'pick':'welcome'}')">← Back</div>`;
  }
  else if(authMode==='login'){
    const p = profileById(authScratch.id);
    card = `
      <div class="authcard">
        <h3>Welcome back, ${p? p.name : ''}</h3>
        <div class="sub">Enter your 4-digit PIN to unlock.</div>
        <div class="pinboxes">
          ${[0,1,2,3].map(i=>`<input id="loPin${i}" type="tel" inputmode="numeric" maxlength="1" oninput="pinAdvance(this,${i},'loPin')">`).join('')}
        </div>
        <button class="authbtn" onclick="doLogin()">Unlock</button>
        <div class="autherr" id="loErr"></div>
      </div>
      ${loadProfiles().length>1? `<div class="authlink" onclick="authGo('pick')">Switch profile</div>`:''}`;
  }
  else if(authMode==='pick'){
    const profiles = loadProfiles();
    card = `
      <div class="authcard">
        <h3>Choose profile</h3>
        <div class="sub">Who's training?</div>
        <div class="profilepick">
          ${profiles.map(p=>`
            <div class="profilerow" onclick="pickProfile('${p.id}')">
              <div class="av">${(p.name||'?').charAt(0).toUpperCase()}</div>
              <div class="pinfo"><div class="nm">${p.name}</div><div class="mt">${p.pin?'PIN protected':'No PIN'}</div></div>
              ${p.pin?'<span class="lockicon">🔒</span>':''}
            </div>`).join('')}
        </div>
        <button class="authbtn ghost" style="margin-top:14px;" onclick="authGo('create')">+ New profile</button>
      </div>`;
  }
  gate.innerHTML = brand + `<div class="spacer"></div>` + card + `<div class="spacer"></div>`;
}
function authGo(mode){ authMode=mode; renderAuth(); }
function pinAdvance(el, i, prefix){
  el.value = el.value.replace(/\D/g,'');
  if(el.value && i<3){ const nx=document.getElementById(prefix+(i+1)); if(nx) nx.focus(); }
}
function readPin(prefix){ return [0,1,2,3].map(i=>{ const el=document.getElementById(prefix+i); return el? el.value : ''; }).join(''); }
function scratchStats(){
  const uw = authScratch.uw||'kg', uh = authScratch.uh||'cm';
  const rawW = parseFloat(authScratch.weightKg), rawG = parseFloat(authScratch.goalKg);
  const wKg = isNaN(rawW)? null : (uw==='lb'? lbToKg(rawW) : rawW);
  const gKg = isNaN(rawG)? null : (uw==='lb'? lbToKg(rawG) : rawG);
  let hCm = null;
  if(uh==='cm'){ const h=parseFloat(authScratch.heightCm); hCm = isNaN(h)? null : h; }
  else { const f=parseFloat(authScratch.hft), i=parseFloat(authScratch.hin); hCm = (isNaN(f)&&isNaN(i))? null : ftInToCm(f||0, i||0); }
  const ag = parseFloat(authScratch.age);
  return {
    weightKg:wKg, heightCm:hCm, goalKg:gKg, age:isNaN(ag)?null:ag,
    sex:authScratch.sex||'male', activity:authScratch.activity||'Moderate',
    goal:authScratch.goal||'Lean bulk', pace:0.5, bodyFat:null,
    units:{ w:uw, h:uh }
  };
}
function doCreate(){
  const name = (authScratch.name||'').trim();
  if(!name){ document.getElementById('auErr').textContent = 'Please enter a name.'; return; }
  const pin = readPin('auPin');
  if(pin.length>0 && pin.length<4){ document.getElementById('auErr').textContent = 'PIN must be 4 digits (or leave all blank).'; return; }
  const stats = scratchStats();
  const id = uid('p');
  const list = loadProfiles();
  list.push({ id, name, pin: pin.length===4? hashPin(pin) : null, stats, createdAt: Date.now() });
  saveProfiles(list);
  setActiveProfile(id);
  authScratch = {};
  enterApp();
  // seed this new profile's stats + starting weigh-in, then compute targets from science
  state.stats = { ...stats };
  if(stats.weightKg!=null) state.weighIns = [{ d:'Day 1', v:stats.weightKg }];
  applyCalculatedTargets();
  saveState(); render();
}
function pickProfile(id){
  const p = profileById(id);
  if(p.pin){ authMode='login'; authScratch={ id }; return renderAuth(); }
  setActiveProfile(id); enterApp();
}
function doLogin(){
  const p = profileById(authScratch.id);
  const pin = readPin('loPin');
  if(hashPin(pin) !== p.pin){ document.getElementById('loErr').textContent = 'Wrong PIN. Try again.'; ['loPin0','loPin1','loPin2','loPin3'].forEach(id=>{ const el=document.getElementById(id); if(el) el.value=''; }); const f=document.getElementById('loPin0'); if(f) f.focus(); return; }
  setActiveProfile(p.id); enterApp();
}
/* In-app account actions (wired into Progress → account card) */
function lockApp(){ saveState(); const p=profileById(currentProfileId); if(p && p.pin){ authMode='login'; authScratch={id:p.id}; } else { authMode='pick'; } currentProfileId=null; renderAuth(); }
function logOut(){ saveState(); try{ localStorage.removeItem(CKEY); }catch(e){} currentProfileId=null; authMode = loadProfiles().length? 'pick':'welcome'; renderAuth(); }
function switchProfile(){ saveState(); currentProfileId=null; authMode='pick'; renderAuth(); }
function currentProfileName(){ const p=profileById(currentProfileId); return p? p.name : ''; }
function setPin(){
  const cur = prompt('Enter a new 4-digit PIN (blank to remove):');
  if(cur===null) return;
  const clean = cur.replace(/\D/g,'');
  if(cur!=='' && clean.length!==4){ alert('PIN must be exactly 4 digits.'); return; }
  const list = loadProfiles();
  const p = list.find(x=>x.id===currentProfileId);
  p.pin = clean.length===4? hashPin(clean) : null;
  saveProfiles(list);
  alert(clean.length===4? 'PIN set.' : 'PIN removed.');
  render();
}

/* Restore from the IndexedDB mirror BEFORE boot if localStorage was evicted or
   cleared, so a wiped localStorage no longer means lost training history. */
hydrateFromMirror().then(()=>{ boot(); }).catch(()=>{ boot(); });

</script>
