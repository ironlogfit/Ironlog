<link rel="manifest" href='data:application/manifest+json,{"name":"IRONLOG","short_name":"IRONLOG","start_url":".","scope":".","display":"standalone","orientation":"portrait","background_color":"%230A0A0B","theme_color":"%230A0A0B","icons":[{"src":"data:image/svg+xml,%253Csvg%2520xmlns=%2527http://www.w3.org/2000/svg%2527%2520viewBox=%25270 0 512 512%2527%253E%253Crect%2520width=%2527512%2527%2520height=%2527512%2527%2520rx=%2527112%2527%2520fill=%2527%25230A0A0B%2527/%253E%253Crect%2520x=%2527108%2527%2520y=%2527222%2527%2520width=%252745%2527%2520height=%252768%2527%2520rx=%25279%2527%2520fill=%2527%2523E08847%2527/%253E%253Crect%2520x=%2527359%2527%2520y=%2527222%2527%2520width=%252745%2527%2520height=%252768%2527%2520rx=%25279%2527%2520fill=%2527%2523E08847%2527/%253E%253Crect%2520x=%2527153%2527%2520y=%2527242%2527%2520width=%2527206%2527%2520height=%252728%2527%2520rx=%252712%2527%2520fill=%2527%2523C2703B%2527/%253E%253Crect%2520x=%2527165%2527%2520y=%2527308%2527%2520width=%2527182%2527%2520height=%252720%2527%2520rx=%25279%2527%2520fill=%2527%2523EDEAE2%2527/%253E%253C/svg%253E","sizes":"512x512","type":"image/svg+xml","purpose":"any maskable"}]}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Surfaces climb toward the light: the further forward an element sits,
       the lighter it reads. Depth replaces the old wireframe borders. */
    --bg:#08080A; --surface:#141519; --surface2:#1C1E22; --surface3:#25272C;
    --border:#2E3036; --border-soft:rgba(255,255,255,0.06);

    --copper:#C2703B; --copper-bright:#E08847;
    --copper-15: rgba(194,112,59,0.15); --copper-30: rgba(194,112,59,0.35);
    --copper-glow: rgba(224,136,71,0.20);

    --chalk:#F0EDE6; --text-dim:#9A9CA3; --text-faint:#63656B;
    --success:#6FA37A; --success-15: rgba(111,163,122,0.15);
    --carbs:#D9B24C; --fat:#7FA8B8; --danger:#B85450; --danger-15: rgba(184,84,80,0.15);

    --radius:18px; --radius-sm:13px; --radius-xs:10px;
    /* Two elevation steps, no more — restraint keeps it from looking bubbly. */
    --elev-1: 0 1px 2px rgba(0,0,0,.35), 0 6px 16px -6px rgba(0,0,0,.5);
    --elev-2: 0 2px 6px rgba(0,0,0,.4), 0 16px 34px -10px rgba(0,0,0,.62);
    /* A single sheen used on raised surfaces so light appears to come from above. */
    --sheen: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0) 42%);
    --ease: cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ background: radial-gradient(ellipse at top, #121216 0%, #08080A 62%);
    font-family:'Inter', sans-serif; color:var(--chalk);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:28px 12px; }
  .display{font-family:'Oswald',sans-serif;}
  .mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;}

  .phone{ width:390px; height:812px; background:#000; border-radius:46px; padding:12px;
    box-shadow:0 0 0 2px #2c2c2e, 0 30px 80px -20px rgba(0,0,0,0.8), inset 0 0 0 1px #000; position:relative; }
  .screen{ width:100%; height:100%; background:var(--bg); border-radius:36px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .notch{ position:absolute; top:12px; left:50%; transform:translateX(-50%); width:120px; height:28px; background:#000; border-radius:20px; z-index:50; }
  .topspacer{ height:14px; flex-shrink:0; padding-top:env(safe-area-inset-top); }
  .content{ flex:1; overflow-y:auto; padding:6px 20px 110px; scrollbar-width:none; }
  .content::-webkit-scrollbar{display:none;}

  /* On real phones (or once installed) the app fills the whole screen —
     the desktop bezel/notch are only a preview affordance. */
  @media (max-width: 500px){
    body{ padding:0; align-items:stretch; justify-content:stretch; background:var(--bg); }
    .phone{ width:100%; height:100dvh; border-radius:0; padding:0; box-shadow:none; }
    .screen{ border-radius:0; }
    .notch{ display:none; }
    .topspacer{ height:calc(10px + env(safe-area-inset-top)); }
    .bottomnav{ padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
  }
  @media (display-mode: standalone){
    body{ padding:0; background:var(--bg); }
    .phone{ width:100%; height:100dvh; border-radius:0; padding:0; box-shadow:none; }
    .screen{ border-radius:0; }
    .notch{ display:none; }
    .topspacer{ height:calc(8px + env(safe-area-inset-top)); }
    .bottomnav{ padding-bottom:calc(20px + env(safe-area-inset-bottom)); }
  }

  .bottomnav{ position:fixed; bottom:0; left:0; right:0; background:rgba(12,13,16,0.86); backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border-top:1px solid var(--border-soft); display:flex; padding:8px 8px 24px; z-index:40; }
  /* Inside the desktop phone-frame preview the nav is pinned to the frame,
     not the browser window. On a real device it's fixed to the viewport. */
  .phone .bottomnav{ position:absolute; }
  @media (max-width: 500px){ .phone .bottomnav{ position:fixed; } }
  @media (display-mode: standalone){ .phone .bottomnav{ position:fixed; } }
  .navbtn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; color:var(--text-faint);
    font-family:'Inter'; font-size:10px; font-weight:600; letter-spacing:.02em; cursor:pointer; padding:4px 0 4px;
    position:relative; transition:color .2s var(--ease); }
  /* The pill slides in behind the icon so the active tab reads at a glance. */
  .navbtn::before{ content:''; position:absolute; top:1px; left:50%; width:46px; height:28px; border-radius:10px;
    background:var(--copper-15); opacity:0; transform:translateX(-50%) scale(.7);
    transition:opacity .22s var(--ease), transform .22s var(--ease); }
  .navbtn.active::before{ opacity:1; transform:translateX(-50%) scale(1); }
  .navbtn svg{width:21px; height:21px; stroke:var(--text-faint); fill:none; stroke-width:1.7; position:relative; z-index:1;
    transition:stroke .2s var(--ease);}
  .navbtn span{ position:relative; z-index:1;}
  .navbtn.active{color:var(--copper-bright);}
  .navbtn.active svg{stroke:var(--copper-bright);}

  .eyebrow{ font-size:10px; font-weight:700; letter-spacing:.18em; color:var(--copper); text-transform:uppercase;
    display:inline-block; margin-bottom:2px; }
  .pagehead{ padding:16px 0 12px; }
  .pagehead h1{ font-family:'Oswald'; font-size:31px; font-weight:600; letter-spacing:-.015em; line-height:1.0;}
  .pagehead .sub{ font-size:13px; color:var(--text-dim); margin-top:6px; line-height:1.5;}

  .load-bar{ display:flex; align-items:flex-end; gap:3px; height:26px; margin:14px 0 20px; }
  .load-bar .seg{ flex:1; border-radius:2px; background:var(--border); transition:background .2s; }
  .load-bar .seg.done{ background:var(--copper);}
  .setcount{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:2px; flex-wrap:wrap;}
  .setcount .n{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--text-dim); white-space:nowrap;}
  .setcount .phase{ font-size:11px; font-weight:600; color:var(--text-dim); letter-spacing:.06em; white-space:nowrap; margin-left:auto;}
  .setcount .phase b{color:var(--copper);}
  .setcount .cmp-chip{ flex-shrink:0;}

  .switchrow{ display:flex; gap:8px; overflow-x:auto; margin:10px 0 4px; padding-bottom:4px; scrollbar-width:none;}
  .switchrow::-webkit-scrollbar{display:none;}
  .switchrow .divider{ width:1px; background:var(--border); flex-shrink:0; margin:2px 2px;}

  .ex-card{ background:var(--sheen), var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius); padding:20px 20px; margin-bottom:20px; box-shadow:var(--elev-1);
    transition:box-shadow .2s var(--ease), border-color .2s var(--ease); }
  .tag{ display:inline-flex; align-items:center; gap:6px; font-size:11px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    padding:4px 8px 4px 8px; border-radius:20px; margin-bottom:8px; }
  .tag .dot{width:6px;height:6px;border-radius:50%;}
  .ex-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .ex-head .actions{ display:flex; gap:6px; flex-shrink:0;}
  .ex-name{ font-family:'Oswald'; font-size:20px; font-weight:600; line-height:1.2; letter-spacing:-.01em;}
  .ex-headwrap{ margin-bottom:10px;}
  .ex-eq{ font-size:12px; color:var(--text-dim); margin-top:2px;}
  .rep-chip{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--copper-15); border:1px solid var(--copper-30);
    border-radius:9px; padding:8px 12px; margin-bottom:8px; }
  .rep-chip .r{ color:var(--copper-bright); font-weight:700; font-size:13px;}
  .rep-chip .last{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim);}
  .suggest-chip{ display:flex; align-items:center; justify-content:space-between; gap:10px; background:var(--success-15); border:1px solid rgba(111,163,122,.4);
    border-radius:9px; padding:8px 12px; margin-bottom:10px; cursor:pointer;}
  .restpill{ position:fixed; right:16px; bottom:78px; z-index:50; display:none; align-items:center; gap:7px;
    background:var(--surface3); border:1px solid var(--border); border-radius:20px; padding:8px 14px;
    box-shadow:0 4px 16px rgba(0,0,0,.35); cursor:pointer; font-size:13px; user-select:none;}
  .restpill .rt-lbl{ color:var(--text-faint); font-size:11px; letter-spacing:.04em; text-transform:uppercase;}
  .restpill .rt-time{ color:var(--chalk); font-family:'IBM Plex Mono'; font-weight:600; min-width:26px; text-align:right;}
  .restpill .rt-x{ color:var(--text-faint); font-size:14px; margin-left:2px; }
  /* Rest-recovery phases: red (too soon) -> amber (recovering) -> green (go) */
  .restpill.rp-hold{ border-color:var(--danger); }
  .restpill.rp-hold .rt-lbl{ color:var(--danger); }
  .restpill.rp-hold .rt-time{ color:var(--danger); }
  .restpill.rp-ok{ border-color:#C9922E; }
  .restpill.rp-ok .rt-lbl{ color:#E0A93A; }
  .restpill.rp-ok .rt-time{ color:#E0A93A; }
  .restpill.rp-ready{ border-color:var(--success); background:rgba(74,163,90,.12); }
  .restpill.rp-ready .rt-lbl{ color:var(--success); }
  .restpill.rp-ready .rt-time{ color:var(--success); }
  .restpill.rp-cool{ border-color:var(--border); }
  .restpill.rp-cool .rt-lbl{ color:var(--text-faint); }
  .restpill.rp-cool .rt-time{ color:var(--text-dim); }
  .se-sum{ margin:6px 0 10px; font-size:13px; color:var(--text-dim); line-height:1.7;}
  .se-sum b{ color:var(--chalk); font-weight:600;}
  .se-sum b.pr{ color:var(--copper-bright);}
  .se-prs{ font-size:11px; color:var(--text-faint); margin-top:2px;}
  /* Recent-sessions history list (Progress tab) */
  .sess-list{ display:flex; flex-direction:column; gap:8px; margin-top:10px; }
  .sess-row{ display:block; width:100%; text-align:left; cursor:pointer; padding:11px 12px;
    background:var(--surface2); border:1px solid var(--border-soft); border-radius:11px;
    -webkit-tap-highlight-color:transparent; }
  .sess-row:active{ border-color:var(--copper-30); }
  .sess-hd{ display:flex; align-items:center; gap:8px; margin-bottom:2px; }
  .sess-hd .sess-day{ font-size:13px; font-weight:600; color:var(--chalk); flex:1; min-width:0;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .sess-hd .sess-wk{ flex:none; font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.04em;
    text-transform:uppercase; color:var(--text-faint); }
  .sess-hd .sess-go{ flex:none; color:var(--copper-bright); font-size:16px; }
  .sess-row .se-sum{ margin:2px 0 0; font-size:12px; line-height:1.5; }
  .lasttime{ font-size:12px; color:var(--text-dim); margin:2px 0 4px; letter-spacing:.01em;}
  .lasttime b{ color:var(--chalk); font-weight:600;}
  .lasttime .tr{ margin-left:4px; font-weight:700;}
  .lasttime .tr.up{ color:var(--success);}
  .lasttime .tr.dn{ color:var(--danger);}
  .lasttime .tr.fl{ color:var(--text-faint);}
  .lasttime .e1{ color:var(--text-faint);}
  .platemath{ font-size:11px; color:var(--text-faint); font-family:'IBM Plex Mono'; margin:-2px 0 6px; letter-spacing:.02em;}
  .suggest-chip .r{ color:#9FCBA8; font-weight:600; font-size:12px; flex:1; min-width:0;}
  .suggest-chip .cyc{ font-size:13px; color:var(--text-faint); flex-shrink:0;}
  .unitchip{ font-family:'IBM Plex Mono'; font-size:10px; font-weight:600; padding:4px 8px; border-radius:6px; background:var(--surface2);
    border:1px solid var(--border-soft); color:var(--text-dim); cursor:pointer; letter-spacing:.05em;}
  .notepill{ display:flex; gap:7px; align-items:flex-start; background:var(--surface2); border-radius:9px; padding:8px 10px; margin-bottom:10px;
    font-size:12px; color:var(--text-dim); line-height:1.4;}
  .notepill .i{ flex-shrink:0;}

  .setgrid-head{ display:grid; grid-template-columns:38px 1fr 1fr 38px; gap:9px; font-size:9px; letter-spacing:.11em; color:var(--text-faint);
    text-transform:uppercase; padding:0 2px 8px; font-weight:700; }
  .setrow{ display:grid; grid-template-columns:38px 1fr 1fr 38px; gap:9px; align-items:center; margin-bottom:8px; }
  .wu-strip{ display:flex; flex-direction:column; gap:9px; margin:2px 0 10px; padding:8px 12px; background:var(--surface2); border:1px solid var(--border-soft); border-radius:var(--radius-xs); }
  .wu-top{ display:flex; align-items:center; gap:8px; }
  .wu-lead{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); display:flex; flex-direction:column; gap:1px; flex:1; min-width:0; }
  .wu-scheme{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.06em; color:var(--copper); background:none; border:1px solid var(--border-soft); border-radius:7px; padding:4px 8px; cursor:pointer; flex:none; white-space:nowrap; }
  .wu-scheme:hover{ border-color:var(--copper); }
  .wu-sub{ font-size:9px; letter-spacing:.02em; text-transform:none; color:var(--text-faint); }
  .tip{ display:flex; align-items:center; gap:10px; margin:0 0 12px; padding:8px 12px; background:var(--surface2); border:1px solid var(--border-soft); border-radius:var(--radius-sm); font-size:12px; color:var(--text-dim); line-height:1.4; }
  .tip button{ flex:none; background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:7px; padding:4px 10px; font-size:11px; cursor:pointer; }
  .tip button:hover{ color:var(--copper); border-color:var(--copper); }
  /* FTUX coachmark tour (spotlight overlay) */
  .tour-ov{ position:fixed; inset:0; z-index:4000; pointer-events:none; }
  .tour-hole{ position:absolute; border-radius:12px; pointer-events:none;
    box-shadow:0 0 0 9999px rgba(8,6,4,.74); border:2px solid var(--copper-bright);
    transition:left .28s ease, top .28s ease, width .28s ease, height .28s ease; }
  .tour-pop{ position:absolute; pointer-events:auto; background:var(--surface2);
    border:1px solid var(--copper-30); border-radius:14px; padding:14px; box-shadow:0 12px 40px rgba(0,0,0,.5);
    transition:left .28s ease, top .28s ease; }
  .tour-pop::after{ content:''; position:absolute; left:24px; width:12px; height:12px; background:var(--surface2);
    border:1px solid var(--copper-30); transform:rotate(45deg); }
  .tour-pop.bottom::after{ top:-7px; border-right:none; border-bottom:none; }
  .tour-pop.top::after{ bottom:-7px; border-left:none; border-top:none; }
  .tp-h{ font-family:'Oswald',sans-serif; font-weight:600; font-size:15px; color:var(--chalk); margin-bottom:5px; }
  .tp-b{ font-size:12.5px; color:var(--text-dim); line-height:1.5; }
  .tp-f{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:12px; }
  .tp-dots{ display:flex; gap:5px; }
  .tp-dots i{ width:6px; height:6px; border-radius:50%; background:var(--border); display:block; }
  .tp-dots i.on{ background:var(--copper-bright); }
  .tp-btns{ display:flex; align-items:center; gap:6px; }
  .tp-skip{ background:none; border:none; color:var(--text-faint); font-size:11px; cursor:pointer; padding:6px; -webkit-tap-highlight-color:transparent; }
  .tp-back{ background:none; border:1px solid var(--border); color:var(--text-dim); border-radius:8px; padding:6px 12px; font-size:12px; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tp-next{ background:var(--copper); border:none; color:#fff; border-radius:8px; padding:6px 14px; font-size:12px; font-weight:600; cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .tp-next:active,.tp-back:active{ opacity:.7; }
  /* Compact "finish setting up" tracker (Progress page only) */
  .stk{ margin:0 0 16px; padding:12px 14px; border-radius:12px; background:var(--surface2); border:1px solid var(--border-soft); }
  .stk-top{ display:flex; align-items:center; justify-content:space-between; }
  .stk-h{ font-size:13px; font-weight:600; color:var(--chalk); }
  .stk-n{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--copper-bright); }
  .stk-bar{ height:4px; border-radius:3px; background:var(--surface3); overflow:hidden; margin:8px 0 10px; }
  .stk-bar span{ display:block; height:100%; background:var(--copper); border-radius:3px; transition:width .35s ease; }
  .stk-rows{ display:flex; flex-direction:column; gap:4px; }
  .stk-row{ display:flex; align-items:center; gap:9px; width:100%; text-align:left; cursor:pointer;
    background:none; border:none; padding:5px 2px; color:var(--chalk); -webkit-tap-highlight-color:transparent; font-size:12.5px; }
  .stk-row:disabled{ cursor:default; }
  .stk-row .stk-c{ flex:none; font-size:13px; color:var(--text-faint); }
  .stk-row.ok .stk-c{ color:var(--success); }
  .stk-row.ok .stk-l{ color:var(--text-dim); text-decoration:line-through; text-decoration-color:var(--text-faint); }
  .stk-row .stk-l{ flex:1; }
  .stk-row .stk-go{ flex:none; color:var(--copper-bright); font-size:15px; }
  /* Per-section first-visit hint (slim, one line) */
  .shint{ display:flex; align-items:flex-start; gap:9px; margin:0 0 14px; padding:9px 12px;
    background:var(--surface2); border:1px solid var(--border-soft); border-left:2px solid var(--copper-30);
    border-radius:10px; font-size:12px; color:var(--text-dim); line-height:1.45; }
  .shint .sh-i{ flex:none; font-size:13px; line-height:1.3; }
  .shint .sh-b{ flex:1; min-width:0; }
  .shint .sh-b b{ color:var(--chalk); font-weight:600; }
  .shint .sh-act{ flex:none; display:flex; align-items:center; gap:8px; }
  .shint .sh-cta{ background:none; border:none; padding:2px 0; cursor:pointer; color:var(--copper-bright);
    font-size:12px; font-weight:600; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
  .shint .sh-x{ background:none; border:1px solid var(--border); color:var(--text-faint); border-radius:7px;
    padding:3px 9px; font-size:11px; cursor:pointer; white-space:nowrap; -webkit-tap-highlight-color:transparent; }
  .shint .sh-x:hover{ color:var(--copper); border-color:var(--copper); }
  .cmp-chip{ background:none; border:1px solid var(--border-soft); color:var(--text-dim); border-radius:7px; padding:4px 8px; font-family:'IBM Plex Mono',monospace; font-size:11px; letter-spacing:.04em; cursor:pointer; }
  .cmp-chip:hover{ color:var(--copper); border-color:var(--copper); }

  /* ===== Health tab ===== */

  .mk-card.high{ border-left-color:#B85450;}

  .mk-top{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; cursor:pointer;}
  .mk-name{ font-family:'Oswald'; font-size:15px; font-weight:600; letter-spacing:.01em;}
  .mk-val{ font-family:'IBM Plex Mono'; font-size:21px; color:var(--chalk); margin-top:4px; display:flex; align-items:baseline; gap:7px;}

  .mk-dot{ position:absolute; top:-3px; width:12px; height:12px; border-radius:50%; transform:translateX(-50%); border:2px solid var(--surface);}
  .mk-dot.ok{ background:#8FD9A8;} .mk-dot.low{ background:#E3C05F;} .mk-dot.high{ background:#E8938F;}
  .mk-note{ font-size:12px; line-height:1.6; padding:12px 12px; border-radius:9px; margin-top:12px;}
  .mk-note.low{ background:rgba(217,178,76,.08); border:1px solid rgba(217,178,76,.3); color:#E8D9A8;}
  .mk-note.high{ background:rgba(184,84,80,.08); border:1px solid rgba(184,84,80,.3); color:#E8B4B2;}
  .mk-note.ok{ background:rgba(111,163,122,.08); border:1px solid rgba(111,163,122,.3); color:#B9D9BE;}
  .mk-linked{ margin-top:12px; font-size:11px; color:var(--text-dim);}
  .mk-linked .lk{ display:inline-block; background:var(--copper-15); color:var(--copper-bright); border-radius:6px; padding:4px 8px; font-size:11px; margin:4px 4px 0 0; font-weight:600;}
  .mk-linked .lkhint{ font-size:10px; color:var(--text-faint); margin-top:8px; line-height:1.5;}
  .mk-hist{ margin-top:12px; border-top:1px solid var(--border-soft); padding-top:8px;}
  .mk-hrow{ display:flex; align-items:center; gap:9px; padding:6px 0; font-size:11px;}
  .mk-hrow .d{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-faint); width:78px; flex-shrink:0;}
  .mk-hrow .v{ font-family:'IBM Plex Mono'; font-size:12px;}
  .mk-hrow .v.ok{ color:#8FD9A8;} .mk-hrow .v.low{ color:#E3C05F;} .mk-hrow .v.high{ color:#E8938F;}
  .mk-hrow .n{ color:var(--text-faint); font-style:italic; flex:1; font-size:10px;}
  .mk-hrow .x{ color:var(--text-faint); cursor:pointer; margin-left:auto;}
  .nu-row{ background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; padding:12px 14px; margin-bottom:8px;}
  .nu-row.over{ border-color:rgba(184,84,80,.5);}
  .nu-row.near{ border-color:rgba(217,178,76,.4);}
  .nu-head{ display:flex; justify-content:space-between; align-items:baseline; gap:8px;}
  .nu-name{ font-size:13px; font-weight:600; color:var(--chalk);}
  .nu-amt{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim);}
  .nu-amt .ul{ color:var(--text-faint);}
  .nu-track{ position:relative; height:7px; background:var(--bg); border-radius:4px; margin:8px 0 6px; overflow:visible;}
  .nu-fill{ height:100%; border-radius:4px; transition:width .2s;}
  .nu-fill.ok{ background:#6FA37A;} .nu-fill.under{ background:#D9B24C;} .nu-fill.near{ background:#E08847;}
  .nu-fill.over{ background:#B85450;} .nu-fill.none{ background:var(--border);}
  .nu-mark{ position:absolute; top:-3px; width:2px; height:13px; background:var(--chalk); opacity:.55;}
  .nu-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .nu-status{ font-family:'IBM Plex Mono'; font-size:10px; font-weight:700; letter-spacing:.04em;}
  .nu-status.ok{ color:#8FD9A8;} .nu-status.under{ color:#E3C05F;} .nu-status.near{ color:#E08847;}
  .nu-status.over{ color:#E8938F;} .nu-status.none{ color:var(--text-faint);}
  .nu-pct{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-faint);}
  .nu-warn{ margin-top:8px; padding:8px 12px; border-radius:8px; background:rgba(184,84,80,.10); border:1px solid rgba(184,84,80,.4);
    font-size:11px; line-height:1.55; color:#E8B4B2;}
  .sup-row{ display:flex; align-items:center; gap:11px; background:var(--surface); border:1px solid var(--border-soft);
    border-radius:11px; padding:12px 12px; margin-bottom:8px;}

  .sup-name{ font-size:13px; font-weight:600;}

  .suppitem{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:10px; padding:10px; margin-bottom:8px;}
  .suppamt{ display:flex; align-items:center; gap:8px; margin-top:8px;}
  .suppamt input{ flex:1; background:var(--bg); border:1px solid var(--border-soft); border-radius:8px; padding:8px 12px;

  .medcaution b{ color:var(--chalk);}

  /* ===== Real-time date UI ===== */
  .datebar{ display:flex; justify-content:space-between; align-items:center; gap:10px; padding:12px 14px; margin-bottom:12px;
    background:var(--surface); border:1px solid var(--border-soft); border-radius:11px; font-size:12px;}

  .datebar .dr{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-faint);}
  .datebar .dr.ok{ color:#8FD9A8;}
  .datebar.off{ border-color:rgba(217,178,76,.45); background:rgba(217,178,76,.07);}
  .datebar.off .dr.jump{ color:#E3C05F; cursor:pointer; font-weight:700;}

  .datebar.done .dr{ color:#8FD9A8; font-weight:700;}

  .weekrow.today{ border-color:var(--copper); background:var(--copper-15);}
  .weekrow.past{ opacity:.62;}
  .weekrow .todaytag{ font-family:'IBM Plex Mono'; font-size:9px; background:var(--copper); color:#0A0A0B;
    padding:2px 4px; border-radius:4px; margin-left:6px; font-weight:700; vertical-align:middle;}
  .weekrow .missed{ color:#E3C05F;}
  .weekrow .doneb{ color:#8FD9A8;}
  .mesostat{ font-size:12px; color:var(--text-dim); margin-top:8px; line-height:1.55;}
  .mesostat b{ color:var(--chalk); font-family:'IBM Plex Mono';}
  .mesostat .mlink{ color:var(--copper-bright); cursor:pointer; font-weight:600;}
  .mesoinfo{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:11px; padding:12px 14px; margin-top:12px;}
  .mesoinfo .mrow{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:4px 0; font-size:12px; color:var(--text-dim);}
  .mesoinfo .mrow b{ color:var(--chalk); font-family:'IBM Plex Mono'; font-size:12px;}
  .dmrow{ display:flex; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft);}
  .dmrow:last-of-type{ border-bottom:none;}
  .dmname{ flex:1; font-size:12px; color:var(--chalk); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .dmpick{ display:flex; gap:4px; flex-shrink:0;}
  .dmd{ width:24px; height:24px; border-radius:6px; border:1px solid var(--border-soft); display:flex; align-items:center;
    justify-content:center; font-size:10px; font-weight:700; color:var(--text-faint); cursor:pointer; font-family:'Inter';}
  .dmd.on{ background:var(--copper); border-color:var(--copper); color:#0A0A0B;}
  .dmd.taken:not(.on){ opacity:.3;}

  /* ===== Body-fat goal planner ===== */
  .monthpick{ display:flex; gap:6px; flex-wrap:wrap; margin:8px 0 12px;}
  .monthpick .mo{ background:var(--bg); border:1px solid var(--border-soft); border-radius:7px; padding:6px 12px;
    font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim); cursor:pointer;}
  .monthpick .mo.on{ background:var(--copper-15); border-color:var(--copper-30); color:var(--copper-bright);}
  .bfverdict{ border-radius:12px; padding:12px 14px; margin-bottom:12px;}
  .bfverdict.ok{ background:rgba(111,163,122,.10); border:1px solid rgba(111,163,122,.45);}
  .bfverdict.warn{ background:rgba(217,178,76,.09); border:1px solid rgba(217,178,76,.45);}
  .bfverdict.fail{ background:rgba(184,84,80,.10); border:1px solid rgba(184,84,80,.5);}
  .bv-badge{ font-family:'IBM Plex Mono'; font-size:10px; font-weight:700; letter-spacing:.05em; padding:4px 8px; border-radius:6px;}
  .bv-badge.ok{ background:rgba(111,163,122,.2); color:#8FD9A8;}
  .bv-badge.warn{ background:rgba(217,178,76,.2); color:#E3C05F;}
  .bv-badge.fail{ background:rgba(184,84,80,.2); color:#E8938F;}

  .bv-nums b{ font-family:'IBM Plex Mono'; font-size:13px; color:var(--chalk);}

  .bffix{ background:rgba(184,84,80,.08); border:1px solid rgba(184,84,80,.4); border-radius:11px; padding:12px 12px;
    font-size:12px; line-height:1.6; color:#E8B4B2;}

  /* ===== Meal suggestions ===== */
  .sugcard{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px; margin-top:14px;}

  /* ===== Program library filters ===== */

    font-size:11px; color:var(--text-dim); cursor:pointer; white-space:nowrap;}
  .fchip.on{ background:var(--copper-15); border-color:var(--copper-30); color:var(--copper-bright); font-weight:600;}

  /* ===== Volume dashboard ===== */

  .vband{ position:absolute; top:0; bottom:0; background:rgba(111,163,122,.16);}
  .vtick{ position:absolute; top:0; bottom:0; width:1px; z-index:2;}
  .vtick.mev{ background:rgba(237,234,226,.3);} .vtick.mrv{ background:rgba(184,84,80,.55);}
  .vfill{ position:absolute; top:0; bottom:0; left:0; border-radius:4px; z-index:1;}
  .vfill.none{ background:var(--border);} .vfill.under{ background:#D9B24C;} .vfill.low{ background:#C9A15A;}
  .vfill.good{ background:#6FA37A;} .vfill.high{ background:#E08847;} .vfill.over{ background:#B85450;}
  .vol-foot{ display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:4px;}
  .vstat{ font-family:'IBM Plex Mono'; font-size:9px; font-weight:700; letter-spacing:.04em;}
  .vstat.none{ color:var(--text-faint);} .vstat.under{ color:#E3C05F;} .vstat.low{ color:#C9A15A;}
  .vstat.good{ color:#8FD9A8;} .vstat.high{ color:#E08847;} .vstat.over{ color:#E8938F;}
  .vrange{ font-family:'IBM Plex Mono'; font-size:9px; color:var(--text-faint);}
  .vinsights{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px; margin-top:20px;}
  .vi-t{ font-family:'Oswald'; font-size:13px; font-weight:600; color:var(--chalk); margin-bottom:8px; letter-spacing:.02em;}
  .vi{ font-size:12px; line-height:1.6; padding:8px 12px; border-radius:9px; margin-bottom:8px; background:var(--surface2);
    border-left:2px solid var(--border);}
  .vi:last-child{ margin-bottom:0;}
  .vi b{ color:var(--chalk);}
  .vi.under{ border-left-color:#D9B24C; color:#E8D9A8;}
  .vi.over{ border-left-color:#B85450; color:#E8B4B2;}
  .vi.stall{ border-left-color:#E08847; color:#EBC3A4;}
  .vi.good{ border-left-color:#6FA37A; color:#B9D9BE;}

  .vprio{ background:none; border:none; cursor:pointer; font-size:14px; line-height:1; padding:0 0 0 6px;
    color:var(--text-faint); vertical-align:middle; transition:color .15s var(--ease), transform .15s var(--ease);}
  .vprio.on{ color:var(--copper-bright);}
  .vprio:active{ transform:scale(1.2);}
  /* ===== Coach volume adjustments ===== */
  /* Observation → suggestion structure on coach cards */
  /* Observation is neutral; the recommendation is the thing you can act on,
     so it carries the weight and the colour. */
  .vr-obs{ font-size:13px; color:var(--text-dim); line-height:1.6;}
  .vr-sug{ font-size:14px; font-weight:600; color:var(--chalk); line-height:1.45; margin-top:8px;
    letter-spacing:-.005em;}
  .wr-c-obs{ font-size:12px; color:var(--text-faint); line-height:1.6; margin:8px 0 0;}
  .wr-basis{ font-size:10px; color:var(--text-faint); opacity:.75; margin-top:8px; letter-spacing:.02em;}
  /* ---- Storage health ---- */
  .sh-box{ margin:10px 0 4px; padding:10px 12px; background:var(--surface2); border:1px solid var(--border-soft); border-radius:10px;}
  .sh-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 0; font-size:12px;}
  .sh-k{ color:var(--text-faint);}
  .sh-v{ color:var(--chalk); font-weight:600;}
  .sh-v.ok{ color:#6FA37A;} .sh-v.warn{ color:#D9B24C;}
  .sh-snaps{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .sh-snap{ background:var(--bg); border:1px solid var(--border-soft); border-radius:7px; padding:4px 8px;
    color:var(--text-faint); font-family:'Inter'; font-size:11px; cursor:pointer;}
  .sh-snap:active{ background:var(--copper-15); color:var(--copper-bright); border-color:var(--copper-30);}
  .sh-note{ font-size:10px; color:var(--text-faint); opacity:.75; margin-top:6px; line-height:1.5;}
  .recovered{ background:rgba(111,163,122,.12); border:1px solid rgba(111,163,122,.4); border-radius:10px;
    padding:10px 12px; margin-bottom:10px; font-size:12px; color:#6FA37A; line-height:1.55;}
  /* ---- One-off week reshuffle ---- */
  .movebtn{ flex:none; width:26px; height:26px; min-width:26px; display:flex; align-items:center; justify-content:center;
    border-radius:7px; border:1px solid var(--border-soft); color:var(--text-faint); font-size:12px;
    background:var(--surface2); cursor:pointer;}
  .movebtn:active{ background:var(--copper-15); color:var(--copper-bright); border-color:var(--copper-30);}
  .weekrow.moving{ border-color:var(--copper-bright) !important; background:var(--copper-15);}
  .weekrow.target{ border-style:dashed !important; border-color:var(--copper-30) !important; cursor:pointer;}
  .weekrow.target:active{ background:var(--copper-15);}
  .movehint{ color:var(--copper-bright); font-weight:600;}
  .movebar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px;
    padding:8px 12px; border-radius:9px; background:var(--copper-15); border:1px solid var(--copper-30);
    font-size:11px; color:var(--copper-bright);}
  .movebar.shuffled{ background:var(--surface2); border-color:var(--border-soft); color:var(--text-faint);}
  .movebar button{ background:transparent; border:1px solid currentColor; border-radius:7px; padding:4px 10px;
    color:inherit; font-family:'Inter'; font-size:11px; cursor:pointer; white-space:nowrap;}

  .restprompt{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:12px 14px; margin:10px 0 4px;}
  .rp-t{ font-family:'Oswald'; font-size:14px; color:var(--chalk);}
  .rp-s{ font-size:11px; color:var(--text-faint); margin:4px 0 8px; line-height:1.5;}
  .rp-opts{ display:flex; flex-wrap:wrap; gap:7px;}
  .rp-opts button{ background:var(--copper-15); border:1px solid var(--copper-30); border-radius:8px;
    padding:8px 12px; color:var(--copper-bright); font-family:'Inter'; font-size:12px; font-weight:600; cursor:pointer;}
  .rp-opts button:active{ background:rgba(194,112,59,.25);}

  /* ---- Pinned meals ---- */
  .fav-chip{ display:inline-flex; align-items:center; flex-shrink:0; max-width:100%;
    background:var(--surface); border:1px solid var(--copper-30);
    border-radius:20px; overflow:hidden; white-space:nowrap; font-size:12px;}
  .fav-chip span:first-child{ padding:7px 12px; cursor:pointer; color:var(--copper-bright); font-weight:600;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fav-chip span:first-child:active{ background:var(--copper-15);}
  .fav-kcal{ font-weight:400; color:var(--text-faint);}
  .fav-rm{ padding:7px 10px 7px 6px; cursor:pointer; color:var(--text-faint); font-size:10px; flex-shrink:0;}
  .fav-rm:active{ color:var(--danger);}
  .iconbtn.fav-on{ color:var(--copper-bright); border-color:var(--copper-30); background:var(--copper-15);}

  /* ---- Quick re-log ---- */
  .recent-meals{ margin:10px 0 4px;}
  .recent-label{ font-size:10px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:6px; font-weight:600;}
  .recent-row{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 12px; background:var(--surface); border:1px solid var(--border-soft); border-radius:10px;
    margin-bottom:6px; cursor:pointer;}
  .recent-row:active{ background:var(--surface2); border-color:var(--copper-30);}
  .recent-name{ font-size:13px; font-weight:600; color:var(--chalk);}
  .recent-macros{ font-size:11px; color:var(--text-faint); white-space:nowrap;}

  /* ---- Quick entry ---- */
  .qi-bar{ background:linear-gradient(135deg,var(--copper-15),rgba(194,112,59,.04));
    border:1px solid var(--copper-30); border-radius:var(--radius); padding:12px 12px; margin-bottom:14px;}
  .qi-label{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--copper-bright);
    font-weight:700; margin-bottom:8px;}
  .qi-row{ display:flex; gap:8px; align-items:center;}
  .qi-input{ flex:1; background:var(--bg); border:1px solid var(--border-soft); border-radius:9px;
    padding:10px 12px; color:var(--chalk); font-family:'Inter'; font-size:13px; min-width:0;}
  .qi-input:focus{ border-color:var(--copper-30); outline:none;}
  .qi-btn{ flex:none; padding:10px 16px; background:var(--copper-bright); color:var(--bg);
    border:none; border-radius:9px; font-family:'Oswald'; font-size:13px; letter-spacing:.04em;
    cursor:pointer; white-space:nowrap;}
  .qi-btn:disabled{ opacity:.5; cursor:default;}
  .qi-hint{ font-size:11px; color:var(--text-faint); margin-top:8px; line-height:1.5;}

  /* ---- Extracted lab values ---- */
  .exdone{ color:#6FA37A; font-weight:700;}
  .exlist-s{ font-size:11px; color:var(--text-faint); line-height:1.5; margin:-2px 0 4px;}
  .exdate{ margin:8px 0 10px; padding:8px 12px; background:var(--bg); border:1px solid var(--border-soft); border-radius:9px;}
  .exdate label{ display:block; font-size:10px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:4px;}
  .exdate input{ width:100%; background:var(--surface2); border:1px solid var(--border-soft); border-radius:7px;
    padding:8px 10px; color:var(--chalk); font-family:'Inter'; font-size:13px;}
  .exinfo{ flex:1; min-width:0;}
  /* Fade the reading, never the control: dimming the whole row made Undo look
     disabled when it is the one thing still actionable here. */
  .exrow.logged{ border-color:rgba(111,163,122,.4) !important; background:rgba(111,163,122,.06);}
  .exrow.logged .exinfo{ opacity:.6;}
  .exok{ color:#6FA37A; font-weight:600;}
  .exedit{ flex:none; padding:4px 8px; border:1px solid var(--border-soft); border-radius:7px;
    color:var(--text-faint); font-size:12px; cursor:pointer;}
  .exedit:active{ background:var(--surface2);}
  .exundo{ flex:none; padding:8px 12px; border:1px solid var(--border); border-radius:8px;
    color:var(--text-dim); font-size:11px; font-weight:600; cursor:pointer; background:var(--surface);
    transition:all .16s var(--ease);}
  .exundo:active{ color:var(--danger); border-color:var(--danger); background:var(--danger-15);}
  .exlogall{ width:100%; margin-top:8px; padding:12px; background:var(--copper-bright); color:var(--bg);
    border:none; border-radius:9px; font-family:'Oswald'; font-size:13px; letter-spacing:.04em; cursor:pointer;}
  .exlogall:active{ opacity:.85;}
  .exalldone{ margin-top:8px; padding:10px 12px; background:rgba(111,163,122,.12);
    border:1px solid rgba(111,163,122,.4); border-radius:9px; font-size:12px; color:#6FA37A; line-height:1.55;}

  /* ---- Finished exercise, folded away ---- */
  .ex-done{ display:flex; align-items:center; gap:12px; padding:14px 16px; margin-bottom:10px;
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    cursor:pointer; opacity:.72; transition:opacity .18s var(--ease), transform .16s var(--ease);}
  .ex-done:active{ transform:scale(.99);}
  .ex-done:hover{ opacity:1;}
  .exd-check{ flex:none; width:26px; height:26px; border-radius:50%; background:var(--success-15);
    color:var(--success); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;}
  .exd-body{ flex:1; min-width:0;}
  .exd-name{ font-family:'Oswald'; font-size:15px; font-weight:600; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .exd-meta{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-faint); margin-top:2px;}
  .exd-open{ flex:none; font-size:11px; font-weight:600; color:var(--text-faint); letter-spacing:.03em;}
  .ex-card.is-open{ border-color:var(--copper-30);}
  .ex-collapse{ font-size:11px; font-weight:600; color:var(--text-faint); text-align:right;
    margin:-4px 0 8px; cursor:pointer; letter-spacing:.03em;}
  .ex-collapse:active{ color:var(--copper-bright);}
  .buildstamp{ margin-top:8px; text-align:right; font-family:'IBM Plex Mono'; font-size:10px;
    letter-spacing:.05em; color:var(--text-faint); opacity:.65;}
  .qi-test{ display:inline-block; margin-left:6px; color:var(--copper-bright); font-weight:600;
    text-decoration:underline; cursor:pointer;}
  .qi-raw{ display:block; margin-top:6px; font-family:'IBM Plex Mono'; font-size:10px; line-height:1.5;
    color:var(--text-faint); word-break:break-all;}
  .stale-week{ display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;
    margin:8px 0 4px; padding:12px 12px; border-radius:var(--radius-sm);
    background:var(--surface2); border:1px solid var(--border-soft); font-size:12px; color:var(--text-dim);}
  .stale-week button{ background:var(--copper-15); border:1px solid var(--copper-30); border-radius:8px;
    padding:8px 12px; color:var(--copper-bright); font-family:'Inter'; font-size:12px; font-weight:600; cursor:pointer;
    white-space:nowrap;}
  .stale-week button:active{ background:rgba(194,112,59,.25);}
  .wu-empty .wu-sub{ color:var(--text-faint); }
  .wu-note{ font-size:11px; color:var(--text-faint); line-height:1.5; }
  /* Touch ergonomics: Apple HIG and Material both put the reliable minimum
     around 44px. Several controls are visually smaller by design, so instead of
     inflating them we extend the INVISIBLE hit area with a pseudo-element.
     Looks identical, far easier to hit mid-set with tired or chalky hands. */
  .movebtn, .iconbtn, .exd-check, .vprio, .qi-test, .cyc{ position:relative; }
  .movebtn::after, .iconbtn::after, .exd-check::after, .vprio::after, .qi-test::after, .cyc::after{
    content:''; position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    width:44px; height:44px; }
  /* ---- Per-set "use last" + direction cue (our take on RP, kept off the grid) ---- */
  .fillrow{ display:flex; align-items:center; gap:10px; padding:2px 0 8px 47px; margin-top:-4px; flex-wrap:wrap; }
  /* Rolling average bodyweight (Progress) */
  .avgbw{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:8px 0 2px; padding:9px 12px; border-radius:10px; background:var(--surface2); border:1px solid var(--border-soft); }
  .avgbw .ab-l{ font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--text-faint); }
  .avgbw .ab-v{ font-family:'Oswald',sans-serif; font-weight:600; font-size:17px; color:var(--chalk); }
  .avgbw .ab-t{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--text-dim); }
  .avgbw .ab-t.dn{ color:var(--success); } .avgbw .ab-t.up{ color:var(--copper-bright); }
  .avgbw .ab-x{ font-size:10.5px; color:var(--text-faint); margin-left:auto; }
  /* Optional per-set effort (RIR) capture — slim, under the logged set */
  .rirrow{ display:flex; align-items:center; gap:6px; padding:3px 0 9px 47px; margin-top:-3px; flex-wrap:wrap; }
  .rirrow .rr-l{ font-size:10px; letter-spacing:.02em; color:var(--text-faint); margin-right:2px; }
  .rirrow .rr-p{ min-width:24px; height:22px; padding:0 6px; border-radius:6px; cursor:pointer;
    border:1px solid var(--border-soft); background:var(--surface2); color:var(--text-dim);
    font-family:'IBM Plex Mono',monospace; font-size:11px; -webkit-tap-highlight-color:transparent; }
  .rirrow .rr-p:active{ transform:scale(.92); }
  .rirrow .rr-p.on{ background:var(--copper-15); border-color:var(--copper-30); color:var(--copper-bright); font-weight:600; }
  .rirrow .rr-u{ font-size:9px; letter-spacing:.08em; color:var(--text-faint); margin-left:1px; }
  .rirrow .rr-fixed{ font-size:11px; color:var(--danger); font-family:'IBM Plex Mono',monospace; }
  .filllast{ background:none; border:none; padding:2px 0; cursor:pointer;
    color:var(--copper-bright); font-size:11px; font-family:'IBM Plex Mono';
    letter-spacing:.01em; -webkit-tap-highlight-color:transparent; white-space:nowrap; }
  .filllast:active{ opacity:.6; }
  .fl-dir{ font-size:10px; font-weight:600; white-space:nowrap; }
  .fl-dir.up{ color:var(--success); }
  .fl-dir.dn{ color:var(--danger); }
  /* One dim reference line under the coach chip: rep range + last session.
     Replaces the old stacked .rep-chip + .lasttime blocks. */
  .exmeta{ display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:6px 0 8px;
    font-size:12px; color:var(--text-dim); letter-spacing:.01em; }
  .exmeta > *{ flex-shrink:0; }
  .exmeta .m-rng{ color:var(--copper-bright); font-weight:600; }
  .exmeta .m-last b{ color:var(--chalk); font-weight:600; }
  .exmeta .m-sep{ color:var(--text-faint); }
  .exmeta .m-more{ margin-left:auto; background:none; border:none; padding:2px 0; cursor:pointer;
    color:var(--text-faint); font-size:11px; font-weight:600; display:flex; align-items:center; gap:3px;
    -webkit-tap-highlight-color:transparent; white-space:nowrap; }
  .exmeta .m-more.open{ color:var(--copper-bright); }
  .ad-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:6px;
    font-size:11px; color:var(--text-dim); }
  .ad-row b{ color:var(--chalk); font-family:'IBM Plex Mono'; font-weight:600; }
  /* Collapsed warm-up: one line carrying set count + the range it spans. */
  .wu-line{ width:100%; display:flex; align-items:center; gap:10px; margin:2px 0 10px;
    padding:8px 12px; background:var(--surface2); border:1px solid var(--border-soft);
    border-radius:var(--radius-xs); cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .wu-line .wl-l{ font-family:'IBM Plex Mono',monospace; font-size:10px; letter-spacing:.08em;
    text-transform:uppercase; color:var(--text-dim); flex-shrink:0; }
  .wu-line .wl-v{ font-size:12px; color:var(--chalk); font-family:'IBM Plex Mono'; flex-shrink:0; }
  .wu-line .wl-c{ margin-left:auto; color:var(--text-faint); font-size:14px; flex-shrink:0; }
  .wu-line:active{ opacity:.6; }
  .wu-lead.wu-tap{ cursor:pointer; -webkit-tap-highlight-color:transparent; }
  /* Fill-from-suggestion: compact and right-aligned so it reads as a shortcut,
     not a second primary CTA competing with the coach chip. */
  .fillbar{ display:flex; justify-content:flex-end; margin:2px 0 6px; }
  .fillsug{ display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px;
    cursor:pointer; border:1px solid var(--copper-30); background:none; color:var(--copper-bright);
    font-size:12px; font-weight:600; -webkit-tap-highlight-color:transparent; white-space:nowrap; }
  .fillsug:active{ background:var(--copper-15); }
  .fillsug .fa-i{ font-size:13px; line-height:1; }
  .setactions .addset.rem{ color:var(--text-faint); border-color:var(--border-soft); }
  .setactions .addset.rem:active{ color:var(--danger); }
  /* ---- Glossary terms + popover ---- */
  .gterm{ color:var(--copper-bright); border-bottom:1px dotted var(--copper-30);
    cursor:pointer; -webkit-tap-highlight-color:transparent; }
  .gterm:active{ border-bottom-color:var(--copper-bright); }
  .gloss-pop{ position:fixed; z-index:80; background:var(--surface3);
    border:1px solid var(--border); border-radius:var(--radius-sm);
    padding:12px 14px; box-shadow:0 8px 28px rgba(0,0,0,.45);
    opacity:0; transform:translateY(-4px); transition:opacity .12s var(--ease), transform .12s var(--ease); }
  .gloss-pop.show{ opacity:1; transform:translateY(0); }
  .gp-t{ font-size:12px; font-weight:700; color:var(--copper-bright); margin-bottom:5px; letter-spacing:.01em; }
  .gp-d{ font-size:12px; line-height:1.55; color:var(--chalk); }

  /* ---- Weekly review ---- */
  .wr-banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;
    background:linear-gradient(135deg, var(--copper-15), rgba(194,112,59,.06)); border:1px solid var(--copper-30);
    border-radius:var(--radius); padding:12px 16px; margin-bottom:14px;}
  .wr-banner:active{ background:rgba(194,112,59,.2);}
  .wr-b-t{ font-family:'Oswald'; font-size:15px; letter-spacing:.02em; color:var(--copper-bright);}
  .wr-b-s{ font-size:12px; color:var(--text-faint); margin-top:2px;}
  .wr-b-go{ font-size:12px; font-weight:700; color:var(--copper-bright); white-space:nowrap;}

  .wr-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
  .wr-stat{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:10px; padding:10px 8px; text-align:center;}
  .wr-stat.good{ border-color:rgba(111,163,122,.45);} .wr-stat.warn{ border-color:rgba(217,178,76,.45);}
  .wr-stat.bad{ border-color:rgba(224,136,71,.5);}
  .wr-sv{ font-family:'Oswald'; font-size:17px; color:var(--chalk);}
  .wr-sl{ font-size:10px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint); margin-top:4px;}
  .wr-ss{ font-size:10px; color:var(--text-faint); opacity:.75; margin-top:2px; line-height:1.35;}

  .wr-sec{ margin-bottom:16px;}
  .wr-h{ font-family:'Oswald'; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--chalk); margin-bottom:4px;}
  .wr-sub{ font-size:11px; color:var(--text-faint); margin-bottom:8px; line-height:1.5;}

  .wr-lift{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--border-soft);}
  .wr-lift:last-child{ border-bottom:none;}
  .wr-ln{ font-size:13px; color:var(--chalk);}
  .wr-lv{ font-size:11px; color:var(--text-faint); white-space:nowrap;}
  .wr-ld{ margin-left:4px;} .wr-ld.up{ color:#6FA37A;} .wr-ld.down{ color:#E08847;} .wr-ld.flat{ color:var(--text-faint);}

  .wr-chg{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:11px; padding:12px 12px; margin-bottom:8px; cursor:pointer;}
  .wr-chg.on{ border-color:var(--copper-30); background:var(--copper-15);}
  .wr-c-head{ display:flex; align-items:center; gap:9px;}
  .wr-check{ width:19px; height:19px; flex:none; border-radius:5px; border:1.5px solid var(--copper-30);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--bg); background:transparent;}
  .wr-check.on{ background:var(--copper-bright); border-color:var(--copper-bright);}
  .wr-c-title{ flex:1; font-size:13px; font-weight:600; color:var(--chalk);}
  .wr-conf{ font-size:9px; letter-spacing:.07em; text-transform:uppercase; padding:4px 8px; border-radius:20px; white-space:nowrap;
    background:var(--surface); border:1px solid var(--border-soft); color:var(--text-faint);}
  .wr-conf.high{ color:#6FA37A; border-color:rgba(111,163,122,.4);}
  .wr-conf.moderate{ color:#D9B24C; border-color:rgba(217,178,76,.4);}

  .wr-diff{ margin:8px 0 8px; padding:8px 10px; background:var(--bg); border-radius:8px;}
  .wr-drow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 0; font-size:12px;}
  .wr-dn{ color:var(--text-faint);}
  .wr-dv s{ color:var(--text-faint); opacity:.6; margin-right:4px;}
  .wr-dv b{ color:var(--copper-bright);}
  .wr-why{ margin:0; padding-left:16px; list-style:none;}
  .wr-why li{ font-size:11px; color:var(--text-faint); line-height:1.65; position:relative;}
  .wr-why li:before{ content:'✓'; position:absolute; left:-14px; color:var(--copper-30);}
  .wr-none{ font-size:12px; color:var(--text-faint); line-height:1.6; background:var(--surface2);
    border:1px solid var(--border-soft); border-radius:10px; padding:12px;}
  .wr-actions{ margin-top:4px;}
  .wr-skip{ width:100%; margin-top:8px; padding:12px; background:transparent; border:1px solid var(--border-soft);
    border-radius:10px; color:var(--text-faint); font-family:'Inter'; font-size:12px; cursor:pointer;}
  .modal-save[disabled]{ opacity:.4; pointer-events:none;}

  /* Reason list on the inline coach card */
  /* "Why?" — the same affordance on every recommendation in the app. */
  .vr-whybtn{ margin-top:8px; background:none; border:none; padding:0; cursor:pointer;
    font-family:'Inter'; font-size:11px; font-weight:600; color:var(--text-dim);
    display:inline-flex; align-items:center; gap:5px; transition:color .16s var(--ease);}
  .vr-whybtn:active{ color:var(--copper-bright);}
  .vr-whybtn.open{ color:var(--copper-bright);}
  .vr-chev{ font-size:9px; opacity:.8;}
  .vr-why{ margin:8px 0 0; padding-left:16px; list-style:none;
    animation:vrReveal .22s var(--ease);}
  @keyframes vrReveal{ from{ opacity:0; transform:translateY(-3px);} to{ opacity:1; transform:none;} }
  .vr-why li{ font-size:11px; color:var(--text-faint); line-height:1.65; position:relative;}
  .vr-why li:before{ content:'✓'; position:absolute; left:-13px; color:var(--copper-30);}
  .vr-basis{ font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint);
    margin-top:8px; opacity:.85;}
  .vr-conf{ font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint); margin-right:auto;}
  .vreccard{ background:var(--sheen), var(--surface); border:1px solid var(--copper-30); border-radius:var(--radius);
    padding:16px 16px; margin-bottom:14px; box-shadow:var(--elev-1), 0 0 30px -10px var(--copper-glow);}
  .vr-h{ font-family:'Oswald'; font-size:13px; font-weight:600; color:var(--copper-bright); letter-spacing:.02em;
    margin-bottom:10px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .vr-h .vr-sub{ font-family:'Inter'; font-size:10px; font-weight:400; color:var(--text-faint); letter-spacing:0;}
  .vr{ padding:12px 12px; border-radius:10px; background:var(--surface2); border-left:2px solid var(--border); margin-bottom:8px;}
  .vr:last-child{ margin-bottom:0;}
  .vr.up{ border-left-color:#6FA37A;} .vr.down{ border-left-color:#E08847;} .vr.blocked{ border-left-color:#D9B24C;}
  .vr-t{ font-size:12px; line-height:1.6; color:var(--text-dim);}
  .vr-actions{ display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap;}
  /* The action you are meant to take is solid and obvious. Dismissing is a
     quiet text link — present, but never competing for the same attention. */
  .vr-apply{ background:linear-gradient(135deg, var(--copper), var(--copper-bright)); border:none; color:#170F07;
    font-weight:700; font-size:13px; font-family:'Inter'; padding:10px 16px; border-radius:var(--radius-xs);
    cursor:pointer; box-shadow:0 4px 16px -6px var(--copper-glow);
    transition:transform .16s var(--ease), box-shadow .16s var(--ease);}
  .vr-apply:active{ transform:scale(.96); box-shadow:0 2px 8px -4px var(--copper-glow);}
  .vr-skip,.vr-ok{ background:none; border:none; color:var(--text-faint); font-size:12px;
    font-family:'Inter'; font-weight:600; padding:10px 2px; cursor:pointer;
    transition:color .16s var(--ease);}
  .vr-skip:active,.vr-ok:active{ color:var(--text-dim);}
  .vr-note{ font-size:11px; color:var(--text-faint); line-height:1.5;}

  /* ===== Set copy controls ===== */
  .iconbtn.copyup{ width:30px; height:30px; color:var(--copper-bright); border-color:var(--copper-30); font-size:13px;}
  .setactions{ display:flex; gap:8px; margin-top:8px;}
  .setactions .addset{ flex:1; margin-top:0;}
  .fillall{ background:var(--copper-15); border:1px solid var(--copper-30); color:var(--copper-bright);
    border-radius:9px; padding:8px 12px; font-size:12px; font-weight:600; font-family:'Inter'; cursor:pointer; white-space:nowrap;}
  .fillall:active{ background:rgba(194,112,59,.25);}

  /* ===== Custom exercise picker ===== */
  .ex-add-row{ display:flex; align-items:center; gap:11px; padding:12px 12px; border-radius:11px;
    background:var(--copper-15); border:1px solid var(--copper-30); margin-bottom:12px; cursor:pointer;}
  .ex-add-row .plusic{ font-size:17px; color:var(--copper-bright); font-weight:300;}
  .ex-add-row .eat{ font-size:13px; font-weight:600; color:var(--chalk);}
  .ex-add-row .eas{ font-size:11px; color:var(--text-faint); margin-top:2px;}
  .ex-pick-row.mine{ display:flex; justify-content:space-between; align-items:center; border-color:var(--copper-30);}
  .ex-pick-row.mine .delx{ color:var(--text-faint); font-size:12px; padding:0 2px;}

  /* ===== Blood report PDF reader ===== */
  .pdfdrop{ margin-bottom:14px;}
  .pdfdrop-inner{ display:flex; align-items:center; gap:12px; padding:16px 14px; border:1px dashed var(--copper-30);
    border-radius:12px; background:var(--copper-15); cursor:pointer;}
  .pdfdrop-inner:active{ background:rgba(194,112,59,.22);}
  .pdfic{ font-size:24px;}
  .pdt{ font-size:14px; font-weight:600; color:var(--chalk);}
  .pds{ font-size:11px; color:var(--text-faint); line-height:1.5; margin-top:2px;}
  .pdfmsg{ font-size:11px; padding:8px 12px; border-radius:8px; margin-top:8px; line-height:1.5;}
  .pdfmsg.ok{ background:rgba(111,163,122,.12); color:#9FCBA8;}
  .pdfmsg.warn{ background:rgba(217,178,76,.12); color:#E3C05F;}
  .exlist{ background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; padding:12px 12px; margin-bottom:14px;}
  .exlist-h{ font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--copper-bright); text-transform:uppercase; margin-bottom:8px;}
  .exrow{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px;
    border-radius:var(--radius-xs); background:var(--surface2); border:1px solid var(--border-soft);
    margin-bottom:6px; cursor:pointer; transition:border-color .16s var(--ease);}
  .exrow:active{ border-color:var(--copper-30);}
  .exn{ font-size:13px; font-weight:600; color:var(--chalk);}
  .exv{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim); margin-top:2px;}
  .exadd{ color:var(--copper-bright); font-size:12px; font-weight:600;}
  .exclear{ font-size:11px; color:var(--text-faint); text-align:center; margin-top:6px; cursor:pointer; text-decoration:underline;}
  .ordiv{ display:flex; align-items:center; gap:10px; margin:4px 0 14px; color:var(--text-faint); font-size:11px;}
  .ordiv::before,.ordiv::after{ content:''; flex:1; height:1px; background:var(--border-soft);}

  /* ===== Nutrition label scanner ===== */
  .scanlabel{ margin-bottom:10px; display:flex; flex-direction:column; gap:7px;}
  .scanbtn{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:12px;
    border:1px dashed var(--copper-30); border-radius:10px; font-size:13px; font-weight:600; font-family:'Inter'; cursor:pointer;}
  .scanbtn.primary{ background:var(--copper-15); color:var(--copper-bright); border-style:solid; font-size:14px; padding:12px;}
  .scanbtn.primary:active{ background:rgba(194,112,59,.24);}
  .scanbtn.secondary{ background:transparent; color:var(--text-faint); font-size:12px; padding:8px;}
  .scanbtn.secondary:active{ background:var(--surface2);}

  /* Barcode scanner overlay */
  .bc-overlay{ position:fixed; inset:0; background:#000; z-index:200; display:flex; flex-direction:column;}
  .bc-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; padding-top:calc(16px + env(safe-area-inset-top));}
  .bc-title{ font-family:'Oswald'; font-size:18px; color:#fff;}
  .bc-close{ font-size:22px; color:#fff; cursor:pointer; padding:4px 8px;}
  .bc-reader{ flex:1; width:100%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#000;}
  .bc-reader video{ width:100% !important; height:100% !important; object-fit:cover;}
  .bc-hint{ padding:14px 20px; text-align:center; color:rgba(255,255,255,.65); font-size:12px; line-height:1.6;}
  .bc-status{ padding:0 20px 16px; text-align:center; min-height:36px;}
  .labelstatus{ margin-top:8px;}
  .scanhint{ font-size:10px; color:var(--text-faint); line-height:1.5; margin-top:6px; text-align:center;}
  .scanhint b{ color:var(--text-dim);}

  /* ===== Backup reminder ===== */
  .bkremind{ font-size:12px; line-height:1.55; padding:10px 12px; border-radius:9px; margin:4px 0 10px;}
  .bkremind.warn{ background:rgba(217,178,76,.1); border:1px solid rgba(217,178,76,.4); color:#E8D9A8;}
  .bkremind.soft{ background:var(--surface2); border:1px solid var(--border-soft); color:var(--text-dim);}
  .bkremind.ok{ background:rgba(111,163,122,.1); border:1px solid rgba(111,163,122,.35); color:#9FCBA8;}
  .bkremind b{ color:var(--chalk);}
  .labelmsg{ font-size:11px; padding:8px 12px; border-radius:8px; line-height:1.5;}
  .labelmsg.ok{ background:rgba(111,163,122,.12); color:#9FCBA8;}
  .labelmsg.ok b{ color:#C9E3CE;}
  .labelmsg.warn{ background:rgba(217,178,76,.12); color:#E3C05F;}
  .addfood{ width:100%; padding:8px; border-radius:8px; border:1px dashed var(--border); background:none; color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; margin:4px 0 14px;}
  .mealtotals{ display:flex; justify-content:space-between; gap:8px; background:var(--surface2); border-radius:9px; padding:10px 12px; margin-bottom:16px; font-size:12px; color:var(--text-dim);}
  .mealtotals b{color:var(--chalk); font-family:'IBM Plex Mono';}

  .bp-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .bp-chip{ padding:14px 10px; border-radius:11px; background:var(--surface2); border:1px solid var(--border-soft); text-align:center; font-weight:600; font-size:13px; cursor:pointer; text-transform:capitalize;}
  .bp-chip:active{ background:var(--copper-15); border-color:var(--copper);}
  .ex-pick-row{ padding:12px 14px; border-radius:10px; background:var(--surface2); border:1px solid var(--border-soft); margin-bottom:8px; font-size:14px; font-weight:500; cursor:pointer;}
  .ex-pick-row:active{ background:var(--copper-15); border-color:var(--copper);}
  .modal-back{ font-size:12px; color:var(--copper-bright); font-weight:600; margin-bottom:14px; cursor:pointer; display:inline-block;}
  .presetrow{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px;}

  .modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); z-index:60; display:none; align-items:flex-end; border-radius:36px; overflow:hidden; }
  .modal-backdrop.open{ display:flex;}
  .modal{ width:100%; max-height:82%; background:var(--sheen), var(--surface); border-radius:26px 26px 0 0;
    padding:24px 20px 24px; overflow-y:auto; border-top:1px solid var(--border-soft);
    box-shadow:0 -14px 44px -12px rgba(0,0,0,.7); }
  /* The grabber reads as "this sheet can be dismissed" without any copy. */
  .modal::before{ content:''; display:block; width:36px; height:4px; border-radius:4px;
    background:var(--border); margin:-8px auto 16px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-head h2{ font-family:'Oswald'; font-size:21px;}
  .modal-close{ width:28px; height:28px; border-radius:50%; background:var(--surface2); border:none; color:var(--text-dim); font-size:15px; cursor:pointer;}
  .q{ margin-bottom:20px;}
  .q .qtitle{ font-size:13px; font-weight:600; margin-bottom:2px;}
  .q .qsub{ font-size:11px; color:var(--text-dim); margin-bottom:8px; line-height:1.4;}
  .optrow{ display:flex; gap:7px; flex-wrap:wrap;}
  .opt{ padding:8px 12px; border-radius:9px; background:var(--surface2); border:1px solid var(--border-soft); font-size:12px; color:var(--text-dim); cursor:pointer; font-weight:600;}
  .opt.sel{ background:var(--copper); border-color:var(--copper); color:#181008;}
  .modal-save{ width:100%; padding:16px; border:none; border-radius:var(--radius-sm);
    background:linear-gradient(135deg, var(--copper), var(--copper-bright)); color:#170F07;
    font-family:'Oswald'; font-weight:600; font-size:14.5px; letter-spacing:.02em; margin-top:8px; cursor:pointer;
    box-shadow:0 6px 22px -8px var(--copper-glow); transition:transform .16s var(--ease);}
  .modal-save:active{ transform:scale(.985);}
  .hist-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px; margin-bottom:12px;}
  .hist-card .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; cursor:pointer;}
  .hist-card .pr{ display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px;}
  .hist-card .pr .badge{ background:var(--copper-15); border:1px solid var(--copper-30); color:var(--copper-bright); font-family:'IBM Plex Mono'; font-size:11px; padding:4px 8px; border-radius:6px; font-weight:600;}
  .hist-card .pr .e1{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-faint);}
  .hist-card .meta2{ font-size:11px; color:var(--text-faint); margin-top:6px;}
  .sessrow{ padding:8px 0; border-top:1px solid var(--border-soft); margin-top:8px;}
  .sessrow .sd{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-faint);}
  .sessrow .sp{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--text-dim); margin-top:2px;}
  .sessrow .sn{ font-size:11px; color:var(--text-faint); font-style:italic; margin-top:2px;}
  .aiwhy{ font-size:11px; color:var(--text-faint); line-height:1.6; margin:8px 0 10px; padding:0 2px;
    animation:vrReveal .22s var(--ease);}
  .weekbtn{ width:100%; margin:6px 0 4px; padding:10px 14px; border-radius:11px; background:var(--surface); border:1px solid var(--border-soft);
    color:var(--text-dim); font-size:13px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-family:'Inter';}
  .weekpanel{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:6px 14px; margin:6px 0 10px;}
  .weekrow{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-soft); cursor:pointer;}
  .weekrow:last-child{ border-bottom:none;}
  .weekrow .wd{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-faint); width:32px; text-transform:uppercase;}
  .weekrow .wn{ flex:1;}
  .weekrow .wn .t1{ font-family:'Oswald'; font-size:14px; font-weight:600;}
  .weekrow .wn .t2{ font-size:11px; color:var(--text-faint); margin-top:1px;}
  .weekrow.cur .t1{ color:var(--copper-bright);}
  .weekrow .go{ color:var(--text-faint); font-size:14px;}
  .weekrow.rest .t1{ color:var(--text-faint); font-weight:500;}
  .coachpill{ display:flex; gap:8px; align-items:flex-start; background:rgba(159,203,168,0.08); border:1px solid rgba(111,163,122,.35);
    border-radius:10px; padding:8px 12px; margin:4px 0 12px; font-size:12px; color:#B9D9BE; line-height:1.45;}
  .weighbtn{ width:100%; padding:12px; border-radius:11px; border:1px dashed var(--border); background:none; color:var(--copper-bright); font-weight:600; font-size:13px; cursor:pointer; margin:8px 0 14px;}
  .wilist{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px;}
  .wichip{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:8px; padding:6px 8px; font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim); cursor:pointer;}
  .wichip .wx{ color:var(--text-faint); margin-left:4px;}
  .wichip:active{ border-color:var(--danger);}
  .resetlink{ text-align:center; font-size:11px; color:var(--text-faint); text-decoration:underline; cursor:pointer; padding:14px 0 6px;}
  .backuprow{ display:flex; gap:10px; margin-top:12px;}
  .backupbtn{ flex:1; padding:12px; border-radius:11px; border:1px solid var(--border); background:var(--surface2); color:var(--chalk); font-weight:600; font-size:13px; cursor:pointer; font-family:'Inter';}
  .backupbtn:active{ background:var(--copper-15); border-color:var(--copper-30);}
  .installtoast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:60;
    background:var(--surface2); border:1px solid var(--copper-30); border-radius:12px; padding:12px 16px; display:flex; gap:12px; align-items:center;
    box-shadow:0 12px 40px rgba(0,0,0,.55); font-size:13px; color:var(--chalk); max-width:340px; width:calc(100% - 40px);}
  .installtoast button{ background:var(--copper); border:none; color:#0A0A0B; font-weight:700; padding:8px 12px; border-radius:8px; font-size:12px; cursor:pointer; white-space:nowrap;}
  .installtoast .x{ color:var(--text-faint); cursor:pointer; font-size:15px; padding:0 2px;}

  /* ===== Auth / login screens ===== */
  .authgate{ position:absolute; inset:0; z-index:80; background:radial-gradient(ellipse at top, #16171A 0%, #0A0A0B 62%);
    display:none; flex-direction:column; padding:0 24px calc(30px + env(safe-area-inset-bottom)); overflow-y:auto; }
  .authgate.on{ display:flex; }
  .authgate .brand{ margin-top:calc(64px + env(safe-area-inset-top)); text-align:center; }
  .authgate .logo{ width:66px; height:66px; margin:0 auto 16px; border-radius:20px; background:#0A0A0B; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; }
  .authgate .logo svg{ width:40px; height:40px; }
  .authgate .wordmark{ font-family:'Oswald'; font-weight:700; font-size:30px; letter-spacing:.06em; }
  .authgate .wordmark b{ color:var(--copper-bright); }
  .authgate .tagline{ color:var(--text-dim); font-size:13px; margin-top:4px; letter-spacing:.02em; }
  .authgate .spacer{ flex:1; min-height:26px; }
  .authcard{ background:var(--surface); border:1px solid var(--border-soft); border-radius:18px; padding:24px 20px; }
  .authcard h3{ font-family:'Oswald'; font-weight:600; font-size:19px; margin-bottom:4px; }
  .authcard .sub{ color:var(--text-dim); font-size:13px; margin-bottom:20px; line-height:1.45; }
  .authfield{ margin-bottom:14px; }
  .authfield label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:700; margin-bottom:8px; }
  .authfield input{ width:100%; background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:12px 14px; color:var(--chalk);
    font-family:'Inter'; font-size:15px; outline:none; }
  .authfield input:focus{ border-color:var(--copper-30); }
  .pinboxes{ display:flex; gap:10px; justify-content:center; margin:6px 0 2px; }
  .pinboxes input{ width:52px; height:58px; text-align:center; font-family:'IBM Plex Mono'; font-size:24px; background:var(--bg);
    border:1px solid var(--border); border-radius:12px; color:var(--chalk); outline:none; }
  .pinboxes input:focus{ border-color:var(--copper); }
  .authbtn{ width:100%; padding:14px; border-radius:12px; border:none; background:var(--copper); color:#0A0A0B; font-weight:700; font-size:15px;
    font-family:'Inter'; cursor:pointer; margin-top:6px; }
  .authbtn:active{ background:var(--copper-bright); }
