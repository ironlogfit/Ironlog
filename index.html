<link rel="manifest" href='data:application/manifest+json,{"name":"IRONLOG","short_name":"IRONLOG","start_url":".","scope":".","display":"standalone","orientation":"portrait","background_color":"%230A0A0B","theme_color":"%230A0A0B","icons":[{"src":"data:image/svg+xml,%253Csvg%2520xmlns=%2527http://www.w3.org/2000/svg%2527%2520viewBox=%25270 0 512 512%2527%253E%253Crect%2520width=%2527512%2527%2520height=%2527512%2527%2520rx=%2527112%2527%2520fill=%2527%25230A0A0B%2527/%253E%253Crect%2520x=%2527108%2527%2520y=%2527222%2527%2520width=%252745%2527%2520height=%252768%2527%2520rx=%25279%2527%2520fill=%2527%2523E08847%2527/%253E%253Crect%2520x=%2527359%2527%2520y=%2527222%2527%2520width=%252745%2527%2520height=%252768%2527%2520rx=%25279%2527%2520fill=%2527%2523E08847%2527/%253E%253Crect%2520x=%2527153%2527%2520y=%2527242%2527%2520width=%2527206%2527%2520height=%252728%2527%2520rx=%252712%2527%2520fill=%2527%2523C2703B%2527/%253E%253Crect%2520x=%2527165%2527%2520y=%2527308%2527%2520width=%2527182%2527%2520height=%252720%2527%2520rx=%25279%2527%2520fill=%2527%2523EDEAE2%2527/%253E%253C/svg%253E","sizes":"512x512","type":"image/svg+xml","purpose":"any maskable"}]}'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Surfaces climb toward the light: the further forward an element sits,
       the lighter it reads. Depth replaces the old wireframe borders. */
    --bg:#08080A; --surface:#141519; --surface2:#1C1E22; --surface3:#25272C;
    --border:#2E3036; --border-soft:rgba(255,255,255,0.06);

    --copper:#C2703B; --copper-bright:#E08847;
    --copper-15: rgba(194,112,59,0.15); --copper-30: rgba(194,112,59,0.35);
    --copper-glow: rgba(224,136,71,0.20);

    --chalk:#F0EDE6; --text-dim:#9A9CA3; --text-faint:#63656B;
    --success:#6FA37A; --success-15: rgba(111,163,122,0.15);
    --carbs:#D9B24C; --fat:#7FA8B8; --danger:#B85450; --danger-15: rgba(184,84,80,0.15);

    --radius:18px; --radius-sm:13px; --radius-xs:10px;
    /* Two elevation steps, no more — restraint keeps it from looking bubbly. */
    --elev-1: 0 1px 2px rgba(0,0,0,.35), 0 6px 16px -6px rgba(0,0,0,.5);
    --elev-2: 0 2px 6px rgba(0,0,0,.4), 0 16px 34px -10px rgba(0,0,0,.62);
    /* A single sheen used on raised surfaces so light appears to come from above. */
    --sheen: linear-gradient(180deg, rgba(255,255,255,0.035), rgba(255,255,255,0) 42%);
    --ease: cubic-bezier(.4,0,.2,1);
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{ background: radial-gradient(ellipse at top, #121216 0%, #08080A 62%);
    font-family:'Inter', sans-serif; color:var(--chalk);
    display:flex; align-items:center; justify-content:center; min-height:100vh; padding:28px 12px; }
  .display{font-family:'Oswald',sans-serif;}
  .mono{font-family:'IBM Plex Mono', monospace; font-variant-numeric: tabular-nums;}

  .phone{ width:390px; height:812px; background:#000; border-radius:46px; padding:12px;
    box-shadow:0 0 0 2px #2c2c2e, 0 30px 80px -20px rgba(0,0,0,0.8), inset 0 0 0 1px #000; position:relative; }
  .screen{ width:100%; height:100%; background:var(--bg); border-radius:36px; overflow:hidden; position:relative; display:flex; flex-direction:column; }
  .notch{ position:absolute; top:12px; left:50%; transform:translateX(-50%); width:120px; height:28px; background:#000; border-radius:20px; z-index:50; }
  .topspacer{ height:14px; flex-shrink:0; padding-top:env(safe-area-inset-top); }
  .content{ flex:1; overflow-y:auto; padding:6px 18px 110px; scrollbar-width:none; }
  .content::-webkit-scrollbar{display:none;}

  /* On real phones (or once installed) the app fills the whole screen —
     the desktop bezel/notch are only a preview affordance. */
  @media (max-width: 500px){
    body{ padding:0; align-items:stretch; justify-content:stretch; background:var(--bg); }
    .phone{ width:100%; height:100dvh; border-radius:0; padding:0; box-shadow:none; }
    .screen{ border-radius:0; }
    .notch{ display:none; }
    .topspacer{ height:calc(10px + env(safe-area-inset-top)); }
    .bottomnav{ padding-bottom:calc(18px + env(safe-area-inset-bottom)); }
  }
  @media (display-mode: standalone){
    body{ padding:0; background:var(--bg); }
    .phone{ width:100%; height:100dvh; border-radius:0; padding:0; box-shadow:none; }
    .screen{ border-radius:0; }
    .notch{ display:none; }
    .topspacer{ height:calc(8px + env(safe-area-inset-top)); }
    .bottomnav{ padding-bottom:calc(18px + env(safe-area-inset-bottom)); }
  }

  .bottomnav{ position:fixed; bottom:0; left:0; right:0; background:rgba(12,13,16,0.86); backdrop-filter: blur(22px) saturate(140%);
    -webkit-backdrop-filter: blur(22px) saturate(140%);
    border-top:1px solid var(--border-soft); display:flex; padding:9px 8px 22px; z-index:40; }
  /* Inside the desktop phone-frame preview the nav is pinned to the frame,
     not the browser window. On a real device it's fixed to the viewport. */
  .phone .bottomnav{ position:absolute; }
  @media (max-width: 500px){ .phone .bottomnav{ position:fixed; } }
  @media (display-mode: standalone){ .phone .bottomnav{ position:fixed; } }
  .navbtn{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; background:none; border:none; color:var(--text-faint);
    font-family:'Inter'; font-size:10px; font-weight:600; letter-spacing:.02em; cursor:pointer; padding:5px 0 4px;
    position:relative; transition:color .2s var(--ease); }
  /* The pill slides in behind the icon so the active tab reads at a glance. */
  .navbtn::before{ content:''; position:absolute; top:1px; left:50%; width:46px; height:28px; border-radius:10px;
    background:var(--copper-15); opacity:0; transform:translateX(-50%) scale(.7);
    transition:opacity .22s var(--ease), transform .22s var(--ease); }
  .navbtn.active::before{ opacity:1; transform:translateX(-50%) scale(1); }
  .navbtn svg{width:21px; height:21px; stroke:var(--text-faint); fill:none; stroke-width:1.7; position:relative; z-index:1;
    transition:stroke .2s var(--ease);}
  .navbtn span{ position:relative; z-index:1;}
  .navbtn.active{color:var(--copper-bright);}
  .navbtn.active svg{stroke:var(--copper-bright);}

  .eyebrow{ font-size:10px; font-weight:700; letter-spacing:.18em; color:var(--copper); text-transform:uppercase;
    display:inline-block; margin-bottom:2px; }
  .pagehead{ padding:16px 0 12px; }
  .pagehead h1{ font-family:'Oswald'; font-size:31px; font-weight:600; letter-spacing:-.015em; line-height:1.0;}
  .pagehead .sub{ font-size:13px; color:var(--text-dim); margin-top:6px; line-height:1.5;}

  .load-bar{ display:flex; align-items:flex-end; gap:3px; height:26px; margin:14px 0 18px; }
  .load-bar .seg{ flex:1; border-radius:2px; background:var(--border); transition:background .2s; }
  .load-bar .seg.done{ background:var(--copper);}
  .setcount{ display:flex; justify-content:space-between; align-items:center; margin-bottom:2px;}
  .setcount .n{ font-family:'IBM Plex Mono'; font-size:12px; color:var(--text-dim);}
  .setcount .phase{ font-size:11px; font-weight:600; color:var(--text-dim); letter-spacing:.06em;}
  .setcount .phase b{color:var(--copper);}

  .switchrow{ display:flex; gap:8px; overflow-x:auto; margin:10px 0 4px; padding-bottom:4px; scrollbar-width:none;}
  .switchrow::-webkit-scrollbar{display:none;}
  .switchrow .divider{ width:1px; background:var(--border); flex-shrink:0; margin:2px 2px;}

  .ex-card{ background:var(--sheen), var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius); padding:20px 18px; margin-bottom:18px; box-shadow:var(--elev-1);
    transition:box-shadow .2s var(--ease), border-color .2s var(--ease); }
  .tag{ display:inline-flex; align-items:center; gap:6px; font-size:10.5px; font-weight:700; letter-spacing:.09em; text-transform:uppercase;
    padding:4px 9px 4px 7px; border-radius:20px; margin-bottom:8px; }
  .tag .dot{width:6px;height:6px;border-radius:50%;}
  .ex-head{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .ex-head .actions{ display:flex; gap:6px; flex-shrink:0;}
  .ex-name{ font-family:'Oswald'; font-size:20px; font-weight:600; line-height:1.2; letter-spacing:-.01em;}
  .ex-headwrap{ margin-bottom:10px;}
  .ex-eq{ font-size:12px; color:var(--text-dim); margin-top:2px;}
  .rep-chip{ display:flex; align-items:center; justify-content:space-between; background:var(--copper-15); border:1px solid var(--copper-30);
    border-radius:9px; padding:8px 12px; margin-bottom:8px; }
  .rep-chip .r{ color:var(--copper-bright); font-weight:700; font-size:13px;}
  .rep-chip .last{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim);}
  .suggest-chip{ display:flex; align-items:center; justify-content:space-between; background:var(--success-15); border:1px solid rgba(111,163,122,.4);
    border-radius:9px; padding:8px 12px; margin-bottom:10px; cursor:pointer;}
  .suggest-chip .r{ color:#9FCBA8; font-weight:600; font-size:12px;}
  .suggest-chip .cyc{ font-size:13px; color:var(--text-faint);}
  .unitchip{ font-family:'IBM Plex Mono'; font-size:10px; font-weight:600; padding:4px 9px; border-radius:6px; background:var(--surface2);
    border:1px solid var(--border-soft); color:var(--text-dim); cursor:pointer; letter-spacing:.05em;}
  .notepill{ display:flex; gap:7px; align-items:flex-start; background:var(--surface2); border-radius:9px; padding:8px 10px; margin-bottom:10px;
    font-size:11.5px; color:var(--text-dim); line-height:1.4;}
  .notepill .i{ flex-shrink:0;}

  .setgrid-head{ display:grid; grid-template-columns:38px 1fr 1fr 38px; gap:9px; font-size:9px; letter-spacing:.11em; color:var(--text-faint);
    text-transform:uppercase; padding:0 2px 8px; font-weight:700; }
  .setrow{ display:grid; grid-template-columns:38px 1fr 1fr 38px; gap:9px; align-items:center; margin-bottom:8px; }
  .plate{ width:38px; height:38px; border-radius:50%; border:2.5px solid var(--border); display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--text-dim); font-weight:600; cursor:pointer;
    transition:all .18s var(--ease); background:var(--surface2); position:relative; line-height:1;}
  .plate:active{ transform:scale(.92);}
  .plate::before{ content:''; position:absolute; inset:4px; border-radius:50%; border:1px dashed var(--border); opacity:.6; }
  .plate.logged{ border-color:var(--copper); background:var(--copper-15); color:var(--copper-bright);}
  .plate.logged::before{ border-color:var(--copper-30);}
  .plate.wu{ border-style:dashed; color:var(--text-faint);}
  .plate.myo{ border-color:var(--carbs);}
  .plate .st{ font-size:6.5px; letter-spacing:.06em; margin-top:1px; color:inherit; opacity:.85;}
  .stepper{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:var(--radius-xs); height:42px;
    display:grid; grid-template-columns:28px 1fr 28px; align-items:stretch; overflow:hidden;
    transition:border-color .16s var(--ease), background .16s var(--ease);}
  .stepper:focus-within{ border-color:var(--copper-30); background:var(--surface3);}
  .stepper button{ background:none; border:none; color:var(--text-faint); font-size:15px; cursor:pointer; font-family:'IBM Plex Mono'; padding:0;}
  .stepper button:active{ background:var(--copper-15); color:var(--copper-bright);}
  .stepper input{ background:transparent; border:none; color:var(--chalk); font-family:'IBM Plex Mono'; font-weight:600; font-size:15px;
    text-align:center; width:100%; outline:none; min-width:0; font-variant-numeric:tabular-nums;}
  .stepper input::placeholder{ color:var(--text-faint); opacity:.8;}
  .locked-field{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:9px; height:38px; display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-weight:600; font-size:13.5px; color:var(--text-dim); opacity:.8; }
  .logbtn{ width:38px; height:38px; border-radius:var(--radius-xs); border:1px solid var(--border-soft); background:var(--surface2);
    display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text-faint);
    transition:all .18s var(--ease);}
  .logbtn:active{ transform:scale(.9);}
  .logbtn.on{ background:var(--success-15); border-color:var(--success); color:var(--success);
    box-shadow:0 0 18px -6px rgba(111,163,122,.55);}
  .addset{ width:100%; margin-top:4px; padding:9px; border-radius:9px; border:1px dashed var(--border); background:none; color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer; }
  /* Sits at the end of the list rather than floating over it — a sticky bar
     covers the set you are working on, which is the one thing that must stay
     visible. */
  .feedbackbtn{ margin-top:10px; width:100%; padding:15px; border:none; border-radius:var(--radius-sm);
    background:linear-gradient(135deg, var(--copper), var(--copper-bright)); color:#170F07; font-family:'Oswald'; font-weight:600;
    font-size:15px; letter-spacing:.02em; cursor:pointer; box-shadow:0 6px 22px -8px var(--copper-glow);
    transition:transform .16s var(--ease), box-shadow .16s var(--ease); }
  .feedbackbtn:active{ transform:scale(.985); box-shadow:0 3px 12px -6px var(--copper-glow);}
  /* Mid-session: present and tappable, but visually out of the way. */
  .feedbackbtn.quiet{ background:none; border:1px solid var(--border); color:var(--text-dim);
    box-shadow:none; font-family:'Inter'; font-weight:600; font-size:13px; padding:13px;
    margin-bottom:8px;}
  .feedbackbtn.quiet:active{ background:var(--surface2); color:var(--chalk); transform:scale(.99);}

  /* End-of-session card: the one moment feedback is the dominant action. */
  .sessionend{ margin-top:18px; padding:18px; border-radius:var(--radius);
    background:var(--sheen), var(--surface); border:1px solid var(--copper-30);
    box-shadow:var(--elev-1), 0 0 34px -12px var(--copper-glow);}
  .se-t{ font-family:'Oswald'; font-size:17px; font-weight:600; color:var(--chalk); letter-spacing:-.01em;}
  .se-s{ font-size:12px; color:var(--text-dim); line-height:1.55; margin:5px 0 4px;}
  .activatebtn{ width:100%; padding:14px; border:none; border-radius:var(--radius-sm); background:linear-gradient(135deg, var(--copper), var(--copper-bright));
    color:#170F07; font-family:'Oswald'; font-weight:600; font-size:14px; letter-spacing:.02em; cursor:pointer; margin:6px 0 16px;
    box-shadow:0 6px 22px -8px var(--copper-glow); transition:transform .16s var(--ease);}
  .activatebtn:active{ transform:scale(.985);}
  .activatebtn.is-active{ background:var(--surface2); color:var(--text-dim); border:1px solid var(--border-soft);}
  .iconbtn{ width:32px; height:32px; border-radius:var(--radius-xs); background:var(--surface2); border:1px solid var(--border-soft);
    display:flex; align-items:center; justify-content:center; color:var(--text-dim); cursor:pointer; font-size:13px; flex-shrink:0;
    transition:all .16s var(--ease);}
  .iconbtn:active{ transform:scale(.9); background:var(--surface3);}
  .iconbtn.danger{ color:var(--danger);}
  .iconbtn.sm{ width:26px; height:26px; font-size:11px; border-radius:7px;}
  .lockednote{ display:flex; align-items:center; gap:7px; font-size:11px; color:var(--text-faint); margin:2px 0 12px; line-height:1.45;}

  .stat-row{ display:flex; gap:10px; margin:16px 0;}
  .stat-box{ flex:1; background:var(--sheen), var(--surface); border:1px solid var(--border-soft);
    border-radius:var(--radius-sm); padding:13px 14px; box-shadow:var(--elev-1);}
  .stat-box .l{ font-size:9.5px; color:var(--text-faint); text-transform:uppercase; letter-spacing:.1em; font-weight:700;}
  .stat-box .v{ font-family:'Oswald'; font-size:23px; font-weight:600; letter-spacing:-.01em; margin-top:5px; line-height:1;}
  .stat-box .v.pos{color:var(--success);}
  .chartwrap{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px; margin-bottom:16px;}
  .chartwrap .l{ font-size:11px; color:var(--text-dim); font-weight:600; margin-bottom:10px;}
  .legend{ display:flex; gap:16px; margin-top:10px;}
  .legend .item{ display:flex; align-items:center; gap:6px; font-size:11px; color:var(--text-dim);}
  .legend .sw{ width:14px; height:2.5px; border-radius:2px;}
  .weekcard{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px; margin-bottom:14px;}
  .weekcard .top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
  .weekcard .top .tag2{ background:var(--copper); color:#181008; font-weight:700; font-size:10.5px; padding:2px 8px; border-radius:5px;}
  .weekcard .msg{ display:flex; gap:9px; background:var(--success-15); border-radius:9px; padding:11px; margin-top:10px; font-size:12px; color:#B9D9BE; line-height:1.4;}
  .pips{ display:flex; gap:4px; margin-top:12px; height:22px;}
  .pips .seg{ flex:1; border-radius:3px; background:var(--border);}
  .pips .seg.done{ background:var(--copper);}
  .pips .seg.deload{ background:transparent; border:1px dashed var(--copper-30);}
  .piplbl{ display:flex; justify-content:space-between; font-size:9.5px; letter-spacing:.08em; color:var(--text-faint); font-weight:700; margin-top:5px; text-transform:uppercase;}
  .revday{ font-size:11px; font-weight:700; letter-spacing:.1em; color:var(--copper); text-transform:uppercase; margin:12px 0 6px;}
  .revrow{ padding:8px 0; border-top:1px solid var(--border-soft); font-size:12px; line-height:1.5;}
  .revrow .rn{ font-weight:600; color:var(--chalk);}
  .revrow .rp{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim);}
  .revrow .rs{ font-size:11px; color:#9FCBA8;}
  .revrow .rnote{ font-size:11px; color:var(--text-faint); font-style:italic;}

  .ringwrap{ display:flex; align-items:center; gap:20px; padding:14px 4px;}
  .ring{ width:118px; height:118px; border-radius:50%; position:relative; flex-shrink:0;
    background: conic-gradient(var(--copper) 0deg, var(--copper) calc(var(--pct)*3.6deg), var(--surface2) 0deg); }
  .ring::after{ content:''; position:absolute; inset:9px; background:var(--bg); border-radius:50%;}
  .ring .txt{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:2;}
  .ring .txt .n{ font-family:'Oswald'; font-size:30px; font-weight:600; letter-spacing:-.02em; line-height:1;
    font-variant-numeric:tabular-nums;}
  .ring .txt .u{ font-size:9px; color:var(--text-dim); letter-spacing:.09em; text-transform:uppercase;
    margin-top:3px; font-weight:600;}
  .macrobars{ flex:1; display:flex; flex-direction:column; gap:12px;}
  .mbar-row .top{ display:flex; justify-content:space-between; font-size:11.5px; margin-bottom:5px;}
  .mbar-row .top .name{ color:var(--text-dim); font-weight:600;}
  .mbar-row .top .num{ font-family:'IBM Plex Mono'; color:var(--chalk);}
  .mbar-track{ height:6px; background:var(--surface2); border-radius:4px; overflow:hidden;}
  .mbar-fill{ height:100%; border-radius:4px;}
  .daychip{ flex-shrink:0; min-width:52px; padding:7px 10px; border-radius:12px; background:var(--surface2); border:1px solid var(--border-soft);
    text-align:center; cursor:pointer;}
  .daychip.active{ border-color:var(--copper); background:var(--copper-15);}
  .daychip .d{ font-size:11.5px; font-weight:700; color:var(--chalk);}
  .daychip.active .d{ color:var(--copper-bright);}
  .daychip .k{ font-family:'IBM Plex Mono'; font-size:9px; color:var(--text-faint); margin-top:2px;}
  .daychip .dot{ width:6px; height:6px; border-radius:50%; margin:3px auto 0;}
  .chip{ flex-shrink:0; padding:8px 14px; border-radius:20px; background:var(--surface2); border:1px solid var(--border-soft);

  .monthpick{ display:flex; gap:6px; flex-wrap:wrap; margin:9px 0 13px;}
  .monthpick .mo{ background:var(--bg); border:1px solid var(--border-soft); border-radius:7px; padding:6px 11px;
    font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim); cursor:pointer;}
  .monthpick .mo.on{ background:var(--copper-15); border-color:var(--copper-30); color:var(--copper-bright);}
  .bfverdict{ border-radius:12px; padding:13px 14px; margin-bottom:11px;}
  .bfverdict.ok{ background:rgba(111,163,122,.10); border:1px solid rgba(111,163,122,.45);}
  .bfverdict.warn{ background:rgba(217,178,76,.09); border:1px solid rgba(217,178,76,.45);}
  .bfverdict.fail{ background:rgba(184,84,80,.10); border:1px solid rgba(184,84,80,.5);}
  .bv-badge{ font-family:'IBM Plex Mono'; font-size:9.5px; font-weight:700; letter-spacing:.05em; padding:4px 9px; border-radius:6px;}
  .bv-badge.ok{ background:rgba(111,163,122,.2); color:#8FD9A8;}
  .bv-badge.warn{ background:rgba(217,178,76,.2); color:#E3C05F;}
  .bv-badge.fail{ background:rgba(184,84,80,.2); color:#E8938F;}
  .bv-nums{ display:grid; grid-template-columns:1fr 1fr; gap:7px 14px; margin-top:11px;}
  .bv-nums > div{ display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-size:11px; color:var(--text-dim);}
  .bv-nums b{ font-family:'IBM Plex Mono'; font-size:12.5px; color:var(--chalk);}
  .bfchecks{ display:flex; flex-direction:column; gap:7px; margin-bottom:12px;}
  .bfc{ display:flex; gap:9px; align-items:flex-start; padding:9px 11px; border-radius:9px; background:var(--surface2);
    border:1px solid var(--border-soft);}
  .bfc .ic{ font-size:12px; flex-shrink:0; line-height:1.35;}
  .bfc.ok .ic{ color:#8FD9A8;} .bfc.warn .ic{ color:#E3C05F;} .bfc.fail .ic{ color:#E8938F;}
  .bfc.warn{ border-color:rgba(217,178,76,.35);} .bfc.fail{ border-color:rgba(184,84,80,.4);}
  .bfc .l{ font-size:12px; color:var(--chalk); font-weight:600; line-height:1.4;}
  .bfc .d{ font-size:10.5px; color:var(--text-faint); line-height:1.55; margin-top:4px;}
  .bffix{ background:rgba(184,84,80,.08); border:1px solid rgba(184,84,80,.4); border-radius:11px; padding:12px 13px;
    font-size:11.5px; line-height:1.6; color:#E8B4B2;}
  .bffix b{ color:#fff;}

  /* ===== Meal suggestions ===== */
  .sugcard{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 15px; margin-top:14px;}
  .sugcard.empty{ border-style:dashed;}
  .sg-h{ display:flex; justify-content:space-between; align-items:baseline; gap:10px; margin-bottom:11px;}
  .sg-t{ font-family:'Oswald'; font-size:14px; font-weight:600; letter-spacing:.02em; color:var(--chalk);}
  .sg-sub{ font-family:'Inter'; font-size:10px; font-weight:400; color:var(--text-faint); letter-spacing:0; text-transform:none;}
  .sg-n{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--copper-bright); flex-shrink:0;}
  .sg-e{ font-size:11.5px; color:var(--text-faint); line-height:1.6;}
  .sgrow{ display:flex; align-items:center; gap:11px; padding:10px 11px; border-radius:10px; background:var(--surface2);
    border:1px solid var(--border-soft); margin-bottom:7px; cursor:pointer;}
  .sgrow:active{ border-color:var(--copper-30);}
  .sg-mi{ flex-shrink:0;}
  .sg-mi .ring{ position:relative; width:34px; height:34px; border-radius:50%; display:flex; align-items:center;
    justify-content:center; background:conic-gradient(var(--copper) calc(var(--pc)*1%), var(--border) 0);}
  .sg-mi .ring span{ position:relative; z-index:1; width:27px; height:27px; border-radius:50%; background:var(--surface2);
    display:flex; align-items:center; justify-content:center;
    font-family:'IBM Plex Mono'; font-size:10px; font-weight:600; color:var(--chalk);}
  .sg-body{ flex:1; min-width:0;}
  .sg-n1{ font-size:12.5px; font-weight:600; color:var(--chalk); line-height:1.35;}
  .sg-n1 .rep{ font-family:'IBM Plex Mono'; font-size:9px; color:var(--copper-bright); background:var(--copper-15);
    padding:1px 5px; border-radius:4px; margin-left:4px;}
  .sg-n2{ font-size:10px; color:var(--text-faint); margin-top:2px;}
  .sg-m{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-dim); margin-top:4px;}
  .sg-go{ color:var(--copper-bright); font-size:17px; flex-shrink:0; font-weight:300;}
  .sg-foot{ font-size:10px; color:var(--text-faint); line-height:1.55; margin-top:9px; padding-top:9px; border-top:1px solid var(--border-soft);}

  /* ===== Program library filters ===== */
  .fgroup{ display:flex; align-items:center; gap:9px; margin-bottom:7px;}
  .fglabel{ font-size:9px; text-transform:uppercase; letter-spacing:.07em; color:var(--text-faint); font-weight:700; width:38px; flex-shrink:0;}
  .fgchips{ display:flex; gap:5px; flex-wrap:wrap; flex:1;}
  .fchip{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:7px; padding:5px 10px;
    font-size:11px; color:var(--text-dim); cursor:pointer; white-space:nowrap;}
  .fchip.on{ background:var(--copper-15); border-color:var(--copper-30); color:var(--copper-bright); font-weight:600;}
  .fcount{ font-family:'IBM Plex Mono'; font-size:10px; color:var(--text-faint); margin:11px 0 9px;}
  .fclear{ color:var(--copper-bright); cursor:pointer; text-decoration:underline; margin-left:5px;}
  .tplsub{ font-size:10.5px; color:var(--text-faint); line-height:1.45; margin:4px 0 6px;}
  .tplprin{ display:flex; gap:5px; flex-wrap:wrap; margin-top:7px;}
  .tplprin span{ font-size:9px; color:var(--text-dim); background:var(--bg); border:1px solid var(--border-soft);
    border-radius:5px; padding:3px 7px;}

  /* ===== Volume dashboard ===== */
  .voltotal{ font-size:12px; color:var(--text-dim); margin:2px 0 14px;}
  .voltotal b{ font-family:'IBM Plex Mono'; color:var(--chalk); font-size:15px;}
  .vol-row{ margin-bottom:15px;}
  .vol-head{ display:flex; justify-content:space-between; align-items:baseline; margin-bottom:6px;}
  .vol-head .vm{ font-size:13px; font-weight:600; color:var(--chalk);}
  .vol-head .vs{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim);}
  .vol-head .vs b{ color:var(--chalk); font-size:13px;}
  .vd{ font-size:9.5px; padding:1px 5px; border-radius:4px; margin-left:3px;}
  .vd.up{ background:rgba(111,163,122,.15); color:#8FD9A8;} .vd.dn{ background:rgba(217,178,76,.15); color:#E3C05F;}
  .vol-track{ position:relative; height:9px; background:var(--bg); border:1px solid var(--border-soft); border-radius:5px; overflow:hidden;}
  .vband{ position:absolute; top:0; bottom:0; background:rgba(111,163,122,.16);}
  .vtick{ position:absolute; top:0; bottom:0; width:1px; z-index:2;}
  .vtick.mev{ background:rgba(237,234,226,.3);} .vtick.mrv{ background:rgba(184,84,80,.55);}
  .vfill{ position:absolute; top:0; bottom:0; left:0; border-radius:4px; z-index:1;}
  .vfill.none{ background:var(--border);} .vfill.under{ background:#D9B24C;} .vfill.low{ background:#C9A15A;}
  .vfill.good{ background:#6FA37A;} .vfill.high{ background:#E08847;} .vfill.over{ background:#B85450;}
  .vol-foot{ display:flex; justify-content:space-between; align-items:center; margin-top:5px;}
  .vstat{ font-family:'IBM Plex Mono'; font-size:9px; font-weight:700; letter-spacing:.04em;}
  .vstat.none{ color:var(--text-faint);} .vstat.under{ color:#E3C05F;} .vstat.low{ color:#C9A15A;}
  .vstat.good{ color:#8FD9A8;} .vstat.high{ color:#E08847;} .vstat.over{ color:#E8938F;}
  .vrange{ font-family:'IBM Plex Mono'; font-size:9px; color:var(--text-faint);}
  .vinsights{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 15px; margin-top:18px;}
  .vi-t{ font-family:'Oswald'; font-size:13px; font-weight:600; color:var(--chalk); margin-bottom:9px; letter-spacing:.02em;}
  .vi{ font-size:11.5px; line-height:1.6; padding:9px 11px; border-radius:9px; margin-bottom:7px; background:var(--surface2);
    border-left:2px solid var(--border);}
  .vi:last-child{ margin-bottom:0;}
  .vi b{ color:var(--chalk);}
  .vi.under{ border-left-color:#D9B24C; color:#E8D9A8;}
  .vi.over{ border-left-color:#B85450; color:#E8B4B2;}
  .vi.stall{ border-left-color:#E08847; color:#EBC3A4;}
  .vi.good{ border-left-color:#6FA37A; color:#B9D9BE;}

  /* ===== Coach volume adjustments ===== */
  /* Observation → suggestion structure on coach cards */
  /* Observation is neutral; the recommendation is the thing you can act on,
     so it carries the weight and the colour. */
  .vr-obs{ font-size:12.5px; color:var(--text-dim); line-height:1.6;}
  .vr-sug{ font-size:14px; font-weight:600; color:var(--chalk); line-height:1.45; margin-top:7px;
    letter-spacing:-.005em;}
  .wr-c-obs{ font-size:11.5px; color:var(--text-faint); line-height:1.6; margin:7px 0 0;}
  .wr-basis{ font-size:10px; color:var(--text-faint); opacity:.75; margin-top:8px; letter-spacing:.02em;}
  /* ---- Storage health ---- */
  .sh-box{ margin:10px 0 4px; padding:10px 12px; background:var(--surface2); border:1px solid var(--border-soft); border-radius:10px;}
  .sh-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:4px 0; font-size:11.5px;}
  .sh-k{ color:var(--text-faint);}
  .sh-v{ color:var(--chalk); font-weight:600;}
  .sh-v.ok{ color:#6FA37A;} .sh-v.warn{ color:#D9B24C;}
  .sh-snaps{ display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .sh-snap{ background:var(--bg); border:1px solid var(--border-soft); border-radius:7px; padding:5px 9px;
    color:var(--text-faint); font-family:'Inter'; font-size:10.5px; cursor:pointer;}
  .sh-snap:active{ background:var(--copper-15); color:var(--copper-bright); border-color:var(--copper-30);}
  .sh-note{ font-size:10px; color:var(--text-faint); opacity:.75; margin-top:6px; line-height:1.5;}
  .recovered{ background:rgba(111,163,122,.12); border:1px solid rgba(111,163,122,.4); border-radius:10px;
    padding:10px 12px; margin-bottom:10px; font-size:11.5px; color:#6FA37A; line-height:1.55;}
  /* ---- One-off week reshuffle ---- */
  .movebtn{ flex:none; width:26px; height:26px; display:flex; align-items:center; justify-content:center;
    border-radius:7px; border:1px solid var(--border-soft); color:var(--text-faint); font-size:12px;
    background:var(--surface2); cursor:pointer;}
  .movebtn:active{ background:var(--copper-15); color:var(--copper-bright); border-color:var(--copper-30);}
  .weekrow.moving{ border-color:var(--copper-bright) !important; background:var(--copper-15);}
  .weekrow.target{ border-style:dashed !important; border-color:var(--copper-30) !important; cursor:pointer;}
  .weekrow.target:active{ background:var(--copper-15);}
  .movehint{ color:var(--copper-bright); font-weight:600;}
  .movebar{ display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:8px;
    padding:9px 11px; border-radius:9px; background:var(--copper-15); border:1px solid var(--copper-30);
    font-size:11px; color:var(--copper-bright);}
  .movebar.shuffled{ background:var(--surface2); border-color:var(--border-soft); color:var(--text-faint);}
  .movebar button{ background:transparent; border:1px solid currentColor; border-radius:7px; padding:4px 10px;
    color:inherit; font-family:'Inter'; font-size:10.5px; cursor:pointer; white-space:nowrap;}

  .restprompt{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    padding:12px 14px; margin:10px 0 4px;}
  .rp-t{ font-family:'Oswald'; font-size:14px; color:var(--chalk);}
  .rp-s{ font-size:11px; color:var(--text-faint); margin:3px 0 9px; line-height:1.5;}
  .rp-opts{ display:flex; flex-wrap:wrap; gap:7px;}
  .rp-opts button{ background:var(--copper-15); border:1px solid var(--copper-30); border-radius:8px;
    padding:7px 12px; color:var(--copper-bright); font-family:'Inter'; font-size:11.5px; font-weight:600; cursor:pointer;}
  .rp-opts button:active{ background:rgba(194,112,59,.25);}

  /* ---- Pinned meals ---- */
  .fav-chip{ display:flex; align-items:center; background:var(--surface); border:1px solid var(--copper-30);
    border-radius:20px; overflow:hidden; white-space:nowrap; font-size:12px;}
  .fav-chip span:first-child{ padding:6px 10px; cursor:pointer; color:var(--copper-bright); font-weight:600;}
  .fav-chip span:first-child:active{ background:var(--copper-15);}
  .fav-kcal{ font-weight:400; color:var(--text-faint);}
  .fav-rm{ padding:6px 9px 6px 5px; cursor:pointer; color:var(--text-faint); font-size:10px;}
  .fav-rm:active{ color:var(--danger);}
  .iconbtn.fav-on{ color:var(--copper-bright); border-color:var(--copper-30); background:var(--copper-15);}

  /* ---- Quick re-log ---- */
  .recent-meals{ margin:10px 0 4px;}
  .recent-label{ font-size:9.5px; letter-spacing:.09em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:6px; font-weight:600;}
  .recent-row{ display:flex; align-items:center; justify-content:space-between; gap:12px;
    padding:10px 12px; background:var(--surface); border:1px solid var(--border-soft); border-radius:10px;
    margin-bottom:6px; cursor:pointer;}
  .recent-row:active{ background:var(--surface2); border-color:var(--copper-30);}
  .recent-name{ font-size:13px; font-weight:600; color:var(--chalk);}
  .recent-macros{ font-size:11px; color:var(--text-faint); white-space:nowrap;}

  /* ---- Quick entry ---- */
  .qi-bar{ background:linear-gradient(135deg,var(--copper-15),rgba(194,112,59,.04));
    border:1px solid var(--copper-30); border-radius:var(--radius); padding:12px 13px; margin-bottom:14px;}
  .qi-label{ font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--copper-bright);
    font-weight:700; margin-bottom:8px;}
  .qi-row{ display:flex; gap:8px; align-items:center;}
  .qi-input{ flex:1; background:var(--bg); border:1px solid var(--border-soft); border-radius:9px;
    padding:10px 12px; color:var(--chalk); font-family:'Inter'; font-size:13px; min-width:0;}
  .qi-input:focus{ border-color:var(--copper-30); outline:none;}
  .qi-btn{ flex:none; padding:10px 16px; background:var(--copper-bright); color:var(--bg);
    border:none; border-radius:9px; font-family:'Oswald'; font-size:13px; letter-spacing:.04em;
    cursor:pointer; white-space:nowrap;}
  .qi-btn:disabled{ opacity:.5; cursor:default;}
  .qi-hint{ font-size:10.5px; color:var(--text-faint); margin-top:7px; line-height:1.5;}

  /* ---- Extracted lab values ---- */
  .exdone{ color:#6FA37A; font-weight:700;}
  .exdate{ margin:8px 0 10px; padding:9px 11px; background:var(--bg); border:1px solid var(--border-soft); border-radius:9px;}
  .exdate label{ display:block; font-size:9.5px; letter-spacing:.08em; text-transform:uppercase;
    color:var(--text-faint); margin-bottom:5px;}
  .exdate input{ width:100%; background:var(--surface2); border:1px solid var(--border-soft); border-radius:7px;
    padding:8px 10px; color:var(--chalk); font-family:'Inter'; font-size:12.5px;}
  .exinfo{ flex:1; min-width:0;}
  .exrow.logged{ opacity:.65; border-color:rgba(111,163,122,.4) !important;}
  .exok{ color:#6FA37A; font-weight:600;}
  .exedit{ flex:none; padding:5px 9px; border:1px solid var(--border-soft); border-radius:7px;
    color:var(--text-faint); font-size:12px; cursor:pointer;}
  .exedit:active{ background:var(--surface2);}
  .exundo{ flex:none; padding:5px 11px; border:1px solid var(--border-soft); border-radius:7px;
    color:var(--text-faint); font-size:10.5px; cursor:pointer;}
  .exundo:active{ color:var(--danger); border-color:var(--danger);}
  .exlogall{ width:100%; margin-top:9px; padding:11px; background:var(--copper-bright); color:var(--bg);
    border:none; border-radius:9px; font-family:'Oswald'; font-size:13px; letter-spacing:.04em; cursor:pointer;}
  .exlogall:active{ opacity:.85;}
  .exalldone{ margin-top:9px; padding:10px 12px; background:rgba(111,163,122,.12);
    border:1px solid rgba(111,163,122,.4); border-radius:9px; font-size:11.5px; color:#6FA37A; line-height:1.55;}

  /* ---- Finished exercise, folded away ---- */
  .ex-done{ display:flex; align-items:center; gap:12px; padding:14px 16px; margin-bottom:10px;
    background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius);
    cursor:pointer; opacity:.72; transition:opacity .18s var(--ease), transform .16s var(--ease);}
  .ex-done:active{ transform:scale(.99);}
  .ex-done:hover{ opacity:1;}
  .exd-check{ flex:none; width:26px; height:26px; border-radius:50%; background:var(--success-15);
    color:var(--success); display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:700;}
  .exd-body{ flex:1; min-width:0;}
  .exd-name{ font-family:'Oswald'; font-size:15px; font-weight:600; color:var(--text-dim);
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .exd-meta{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-faint); margin-top:2px;}
  .exd-open{ flex:none; font-size:10.5px; font-weight:600; color:var(--text-faint); letter-spacing:.03em;}
  .ex-card.is-open{ border-color:var(--copper-30);}
  .ex-collapse{ font-size:10.5px; font-weight:600; color:var(--text-faint); text-align:right;
    margin:-4px 0 8px; cursor:pointer; letter-spacing:.03em;}
  .ex-collapse:active{ color:var(--copper-bright);}
  /* ---- Weekly review ---- */
  .wr-banner{ display:flex; align-items:center; justify-content:space-between; gap:12px; cursor:pointer;
    background:linear-gradient(135deg, var(--copper-15), rgba(194,112,59,.06)); border:1px solid var(--copper-30);
    border-radius:var(--radius); padding:13px 15px; margin-bottom:14px;}
  .wr-banner:active{ background:rgba(194,112,59,.2);}
  .wr-b-t{ font-family:'Oswald'; font-size:15px; letter-spacing:.02em; color:var(--copper-bright);}
  .wr-b-s{ font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .wr-b-go{ font-size:12px; font-weight:700; color:var(--copper-bright); white-space:nowrap;}

  .wr-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:14px;}
  .wr-stat{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:10px; padding:10px 8px; text-align:center;}
  .wr-stat.good{ border-color:rgba(111,163,122,.45);} .wr-stat.warn{ border-color:rgba(217,178,76,.45);}
  .wr-stat.bad{ border-color:rgba(224,136,71,.5);}
  .wr-sv{ font-family:'Oswald'; font-size:17px; color:var(--chalk);}
  .wr-sl{ font-size:9.5px; letter-spacing:.09em; text-transform:uppercase; color:var(--text-faint); margin-top:3px;}
  .wr-ss{ font-size:9.5px; color:var(--text-faint); opacity:.75; margin-top:2px; line-height:1.35;}

  .wr-sec{ margin-bottom:16px;}
  .wr-h{ font-family:'Oswald'; font-size:13px; letter-spacing:.06em; text-transform:uppercase; color:var(--chalk); margin-bottom:3px;}
  .wr-sub{ font-size:11px; color:var(--text-faint); margin-bottom:9px; line-height:1.5;}

  .wr-lift{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:7px 0; border-bottom:1px solid var(--border-soft);}
  .wr-lift:last-child{ border-bottom:none;}
  .wr-ln{ font-size:12.5px; color:var(--chalk);}
  .wr-lv{ font-size:11px; color:var(--text-faint); white-space:nowrap;}
  .wr-ld{ margin-left:5px;} .wr-ld.up{ color:#6FA37A;} .wr-ld.down{ color:#E08847;} .wr-ld.flat{ color:var(--text-faint);}

  .wr-chg{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:11px; padding:11px 12px; margin-bottom:9px; cursor:pointer;}
  .wr-chg.on{ border-color:var(--copper-30); background:var(--copper-15);}
  .wr-c-head{ display:flex; align-items:center; gap:9px;}
  .wr-check{ width:19px; height:19px; flex:none; border-radius:5px; border:1.5px solid var(--copper-30);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--bg); background:transparent;}
  .wr-check.on{ background:var(--copper-bright); border-color:var(--copper-bright);}
  .wr-c-title{ flex:1; font-size:13px; font-weight:600; color:var(--chalk);}
  .wr-conf{ font-size:9px; letter-spacing:.07em; text-transform:uppercase; padding:3px 7px; border-radius:20px; white-space:nowrap;
    background:var(--surface); border:1px solid var(--border-soft); color:var(--text-faint);}
  .wr-conf.high{ color:#6FA37A; border-color:rgba(111,163,122,.4);}
  .wr-conf.moderate{ color:#D9B24C; border-color:rgba(217,178,76,.4);}

  .wr-diff{ margin:9px 0 8px; padding:8px 10px; background:var(--bg); border-radius:8px;}
  .wr-drow{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:3px 0; font-size:11.5px;}
  .wr-dn{ color:var(--text-faint);}
  .wr-dv s{ color:var(--text-faint); opacity:.6; margin-right:4px;}
  .wr-dv b{ color:var(--copper-bright);}
  .wr-why{ margin:0; padding-left:16px; list-style:none;}
  .wr-why li{ font-size:11px; color:var(--text-faint); line-height:1.65; position:relative;}
  .wr-why li:before{ content:'✓'; position:absolute; left:-14px; color:var(--copper-30);}
  .wr-none{ font-size:12px; color:var(--text-faint); line-height:1.6; background:var(--surface2);
    border:1px solid var(--border-soft); border-radius:10px; padding:12px;}
  .wr-actions{ margin-top:4px;}
  .wr-skip{ width:100%; margin-top:8px; padding:11px; background:transparent; border:1px solid var(--border-soft);
    border-radius:10px; color:var(--text-faint); font-family:'Inter'; font-size:12px; cursor:pointer;}
  .modal-save[disabled]{ opacity:.4; pointer-events:none;}

  /* Reason list on the inline coach card */
  /* "Why?" — the same affordance on every recommendation in the app. */
  .vr-whybtn{ margin-top:9px; background:none; border:none; padding:0; cursor:pointer;
    font-family:'Inter'; font-size:11px; font-weight:600; color:var(--text-dim);
    display:inline-flex; align-items:center; gap:5px; transition:color .16s var(--ease);}
  .vr-whybtn:active{ color:var(--copper-bright);}
  .vr-whybtn.open{ color:var(--copper-bright);}
  .vr-chev{ font-size:8px; opacity:.8;}
  .vr-why{ margin:9px 0 0; padding-left:15px; list-style:none;
    animation:vrReveal .22s var(--ease);}
  @keyframes vrReveal{ from{ opacity:0; transform:translateY(-3px);} to{ opacity:1; transform:none;} }
  .vr-why li{ font-size:11px; color:var(--text-faint); line-height:1.65; position:relative;}
  .vr-why li:before{ content:'✓'; position:absolute; left:-13px; color:var(--copper-30);}
  .vr-basis{ font-size:9px; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint);
    margin-top:7px; opacity:.85;}
  .vr-conf{ font-size:9px; letter-spacing:.07em; text-transform:uppercase; color:var(--text-faint); margin-right:auto;}
  .vreccard{ background:var(--sheen), var(--surface); border:1px solid var(--copper-30); border-radius:var(--radius);
    padding:15px 16px; margin-bottom:14px; box-shadow:var(--elev-1), 0 0 30px -10px var(--copper-glow);}
  .vr-h{ font-family:'Oswald'; font-size:13px; font-weight:600; color:var(--copper-bright); letter-spacing:.02em;
    margin-bottom:10px; display:flex; align-items:baseline; gap:8px; flex-wrap:wrap;}
  .vr-h .vr-sub{ font-family:'Inter'; font-size:10px; font-weight:400; color:var(--text-faint); letter-spacing:0;}
  .vr{ padding:11px 12px; border-radius:10px; background:var(--surface2); border-left:2px solid var(--border); margin-bottom:8px;}
  .vr:last-child{ margin-bottom:0;}
  .vr.up{ border-left-color:#6FA37A;} .vr.down{ border-left-color:#E08847;} .vr.blocked{ border-left-color:#D9B24C;}
  .vr-t{ font-size:11.5px; line-height:1.6; color:var(--text-dim);}
  .vr-actions{ display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap;}
  /* The action you are meant to take is solid and obvious. Dismissing is a
     quiet text link — present, but never competing for the same attention. */
  .vr-apply{ background:linear-gradient(135deg, var(--copper), var(--copper-bright)); border:none; color:#170F07;
    font-weight:700; font-size:12.5px; font-family:'Inter'; padding:10px 17px; border-radius:var(--radius-xs);
    cursor:pointer; box-shadow:0 4px 16px -6px var(--copper-glow);
    transition:transform .16s var(--ease), box-shadow .16s var(--ease);}
  .vr-apply:active{ transform:scale(.96); box-shadow:0 2px 8px -4px var(--copper-glow);}
  .vr-skip,.vr-ok{ background:none; border:none; color:var(--text-faint); font-size:11.5px;
    font-family:'Inter'; font-weight:600; padding:10px 2px; cursor:pointer;
    transition:color .16s var(--ease);}
  .vr-skip:active,.vr-ok:active{ color:var(--text-dim);}
  .vr-note{ font-size:10.5px; color:var(--text-faint); line-height:1.5;}

  /* ===== Set copy controls ===== */
  .iconbtn.copyup{ width:30px; height:30px; color:var(--copper-bright); border-color:var(--copper-30); font-size:13px;}
  .setactions{ display:flex; gap:8px; margin-top:9px;}
  .setactions .addset{ flex:1; margin-top:0;}
  .fillall{ background:var(--copper-15); border:1px solid var(--copper-30); color:var(--copper-bright);
    border-radius:9px; padding:9px 13px; font-size:11.5px; font-weight:600; font-family:'Inter'; cursor:pointer; white-space:nowrap;}
  .fillall:active{ background:rgba(194,112,59,.25);}

  /* ===== Custom exercise picker ===== */
  .ex-add-row{ display:flex; align-items:center; gap:11px; padding:12px 13px; border-radius:11px;
    background:var(--copper-15); border:1px solid var(--copper-30); margin-bottom:12px; cursor:pointer;}
  .ex-add-row .plusic{ font-size:17px; color:var(--copper-bright); font-weight:300;}
  .ex-add-row .eat{ font-size:13px; font-weight:600; color:var(--chalk);}
  .ex-add-row .eas{ font-size:10.5px; color:var(--text-faint); margin-top:2px;}
  .ex-pick-row.mine{ display:flex; justify-content:space-between; align-items:center; border-color:var(--copper-30);}
  .ex-pick-row.mine .delx{ color:var(--text-faint); font-size:12px; padding:0 2px;}

  /* ===== Blood report PDF reader ===== */
  .pdfdrop{ margin-bottom:14px;}
  .pdfdrop-inner{ display:flex; align-items:center; gap:12px; padding:15px 14px; border:1px dashed var(--copper-30);
    border-radius:12px; background:var(--copper-15); cursor:pointer;}
  .pdfdrop-inner:active{ background:rgba(194,112,59,.22);}
  .pdfic{ font-size:24px;}
  .pdt{ font-size:13.5px; font-weight:600; color:var(--chalk);}
  .pds{ font-size:10.5px; color:var(--text-faint); line-height:1.5; margin-top:2px;}
  .pdfmsg{ font-size:11px; padding:9px 11px; border-radius:8px; margin-top:9px; line-height:1.5;}
  .pdfmsg.ok{ background:rgba(111,163,122,.12); color:#9FCBA8;}
  .pdfmsg.warn{ background:rgba(217,178,76,.12); color:#E3C05F;}
  .exlist{ background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; padding:12px 13px; margin-bottom:14px;}
  .exlist-h{ font-size:11px; font-weight:700; letter-spacing:.03em; color:var(--copper-bright); text-transform:uppercase; margin-bottom:9px;}
  .exrow{ display:flex; justify-content:space-between; align-items:center; gap:8px; padding:10px 12px;
    border-radius:var(--radius-xs); background:var(--surface2); border:1px solid var(--border-soft);
    margin-bottom:6px; cursor:pointer; transition:border-color .16s var(--ease);}
  .exrow:active{ border-color:var(--copper-30);}
  .exn{ font-size:12.5px; font-weight:600; color:var(--chalk);}
  .exv{ font-family:'IBM Plex Mono'; font-size:11px; color:var(--text-dim); margin-top:2px;}
  .exadd{ color:var(--copper-bright); font-size:12px; font-weight:600;}
  .exclear{ font-size:10.5px; color:var(--text-faint); text-align:center; margin-top:6px; cursor:pointer; text-decoration:underline;}
  .ordiv{ display:flex; align-items:center; gap:10px; margin:4px 0 14px; color:var(--text-faint); font-size:10.5px;}
  .ordiv::before,.ordiv::after{ content:''; flex:1; height:1px; background:var(--border-soft);}

  /* ===== Nutrition label scanner ===== */
  .scanlabel{ margin-bottom:10px; display:flex; flex-direction:column; gap:7px;}
  .scanbtn{ width:100%; display:flex; align-items:center; justify-content:center; gap:8px; padding:11px;
    border:1px dashed var(--copper-30); border-radius:10px; font-size:12.5px; font-weight:600; font-family:'Inter'; cursor:pointer;}
  .scanbtn.primary{ background:var(--copper-15); color:var(--copper-bright); border-style:solid; font-size:13.5px; padding:13px;}
  .scanbtn.primary:active{ background:rgba(194,112,59,.24);}
  .scanbtn.secondary{ background:transparent; color:var(--text-faint); font-size:11.5px; padding:9px;}
  .scanbtn.secondary:active{ background:var(--surface2);}

  /* Barcode scanner overlay */
  .bc-overlay{ position:fixed; inset:0; background:#000; z-index:200; display:flex; flex-direction:column;}
  .bc-header{ display:flex; align-items:center; justify-content:space-between; padding:16px 18px; padding-top:calc(16px + env(safe-area-inset-top));}
  .bc-title{ font-family:'Oswald'; font-size:18px; color:#fff;}
  .bc-close{ font-size:22px; color:#fff; cursor:pointer; padding:4px 8px;}
  .bc-reader{ flex:1; width:100%; overflow:hidden; display:flex; align-items:center; justify-content:center; background:#000;}
  .bc-reader video{ width:100% !important; height:100% !important; object-fit:cover;}
  .bc-hint{ padding:14px 18px; text-align:center; color:rgba(255,255,255,.65); font-size:12px; line-height:1.6;}
  .bc-status{ padding:0 18px 16px; text-align:center; min-height:36px;}
  .labelstatus{ margin-top:8px;}
  .scanhint{ font-size:9.5px; color:var(--text-faint); line-height:1.5; margin-top:6px; text-align:center;}
  .scanhint b{ color:var(--text-dim);}

  /* ===== Backup reminder ===== */
  .bkremind{ font-size:11.5px; line-height:1.55; padding:10px 12px; border-radius:9px; margin:4px 0 10px;}
  .bkremind.warn{ background:rgba(217,178,76,.1); border:1px solid rgba(217,178,76,.4); color:#E8D9A8;}
  .bkremind.soft{ background:var(--surface2); border:1px solid var(--border-soft); color:var(--text-dim);}
  .bkremind.ok{ background:rgba(111,163,122,.1); border:1px solid rgba(111,163,122,.35); color:#9FCBA8;}
  .bkremind b{ color:var(--chalk);}
  .labelmsg{ font-size:10.5px; padding:9px 11px; border-radius:8px; line-height:1.5;}
  .labelmsg.ok{ background:rgba(111,163,122,.12); color:#9FCBA8;}
  .labelmsg.ok b{ color:#C9E3CE;}
  .labelmsg.warn{ background:rgba(217,178,76,.12); color:#E3C05F;}
  .addfood{ width:100%; padding:9px; border-radius:8px; border:1px dashed var(--border); background:none; color:var(--text-dim); font-size:12px; font-weight:600; cursor:pointer; margin:4px 0 14px;}
  .mealtotals{ display:flex; justify-content:space-between; background:var(--surface2); border-radius:9px; padding:10px 12px; margin-bottom:16px; font-size:12px; color:var(--text-dim);}
  .mealtotals b{color:var(--chalk); font-family:'IBM Plex Mono';}

  .bp-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .bp-chip{ padding:14px 10px; border-radius:11px; background:var(--surface2); border:1px solid var(--border-soft); text-align:center; font-weight:600; font-size:13px; cursor:pointer; text-transform:capitalize;}
  .bp-chip:active{ background:var(--copper-15); border-color:var(--copper);}
  .ex-pick-row{ padding:12px 14px; border-radius:10px; background:var(--surface2); border:1px solid var(--border-soft); margin-bottom:8px; font-size:13.5px; font-weight:500; cursor:pointer;}
  .ex-pick-row:active{ background:var(--copper-15); border-color:var(--copper);}
  .modal-back{ font-size:12px; color:var(--copper-bright); font-weight:600; margin-bottom:14px; cursor:pointer; display:inline-block;}
  .presetrow{ display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px;}

  .modal-backdrop{ position:absolute; inset:0; background:rgba(0,0,0,.6); z-index:60; display:none; align-items:flex-end; border-radius:36px; overflow:hidden; }
  .modal-backdrop.open{ display:flex;}
  .modal{ width:100%; max-height:82%; background:var(--sheen), var(--surface); border-radius:26px 26px 0 0;
    padding:22px 20px 26px; overflow-y:auto; border-top:1px solid var(--border-soft);
    box-shadow:0 -14px 44px -12px rgba(0,0,0,.7); }
  /* The grabber reads as "this sheet can be dismissed" without any copy. */
  .modal::before{ content:''; display:block; width:36px; height:4px; border-radius:4px;
    background:var(--border); margin:-8px auto 16px; }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .modal-head h2{ font-family:'Oswald'; font-size:21px;}
  .modal-close{ width:28px; height:28px; border-radius:50%; background:var(--surface2); border:none; color:var(--text-dim); font-size:15px; cursor:pointer;}
  .q{ margin-bottom:18px;}
  .q .qtitle{ font-size:13px; font-weight:600; margin-bottom:2px;}
  .q .qsub{ font-size:11px; color:var(--text-dim); margin-bottom:9px; line-height:1.4;}
  .optrow{ display:flex; gap:7px; flex-wrap:wrap;}
  .opt{ padding:9px 12px; border-radius:9px; background:var(--surface2); border:1px solid var(--border-soft); font-size:11.5px; color:var(--text-dim); cursor:pointer; font-weight:600;}
  .opt.sel{ background:var(--copper); border-color:var(--copper); color:#181008;}
  .modal-save{ width:100%; padding:15px; border:none; border-radius:var(--radius-sm);
    background:linear-gradient(135deg, var(--copper), var(--copper-bright)); color:#170F07;
    font-family:'Oswald'; font-weight:600; font-size:14.5px; letter-spacing:.02em; margin-top:8px; cursor:pointer;
    box-shadow:0 6px 22px -8px var(--copper-glow); transition:transform .16s var(--ease);}
  .modal-save:active{ transform:scale(.985);}
  .hist-card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:14px 16px; margin-bottom:11px;}
  .hist-card .top{ display:flex; justify-content:space-between; align-items:flex-start; gap:8px; cursor:pointer;}
  .hist-card .pr{ display:flex; align-items:center; gap:8px; margin-top:6px; font-size:12px;}
  .hist-card .pr .badge{ background:var(--copper-15); border:1px solid var(--copper-30); color:var(--copper-bright); font-family:'IBM Plex Mono'; font-size:11px; padding:3px 9px; border-radius:6px; font-weight:600;}
  .hist-card .pr .e1{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-faint);}
  .hist-card .meta2{ font-size:11px; color:var(--text-faint); margin-top:6px;}
  .sessrow{ padding:8px 0; border-top:1px solid var(--border-soft); margin-top:8px;}
  .sessrow .sd{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-faint);}
  .sessrow .sp{ font-family:'IBM Plex Mono'; font-size:11.5px; color:var(--text-dim); margin-top:2px;}
  .sessrow .sn{ font-size:11px; color:var(--text-faint); font-style:italic; margin-top:2px;}
  .aiwhy{ font-size:11px; color:var(--text-faint); line-height:1.6; margin:8px 0 10px; padding:0 2px;
    animation:vrReveal .22s var(--ease);}
  .weekbtn{ width:100%; margin:6px 0 4px; padding:10px 14px; border-radius:11px; background:var(--surface); border:1px solid var(--border-soft);
    color:var(--text-dim); font-size:12.5px; font-weight:600; cursor:pointer; display:flex; justify-content:space-between; align-items:center; font-family:'Inter';}
  .weekpanel{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:6px 14px; margin:6px 0 10px;}
  .weekrow{ display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border-soft); cursor:pointer;}
  .weekrow:last-child{ border-bottom:none;}
  .weekrow .wd{ font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-faint); width:32px; text-transform:uppercase;}
  .weekrow .wn{ flex:1;}
  .weekrow .wn .t1{ font-family:'Oswald'; font-size:14px; font-weight:600;}
  .weekrow .wn .t2{ font-size:10.5px; color:var(--text-faint); margin-top:1px;}
  .weekrow.cur .t1{ color:var(--copper-bright);}
  .weekrow .go{ color:var(--text-faint); font-size:14px;}
  .weekrow.rest .t1{ color:var(--text-faint); font-weight:500;}
  .coachpill{ display:flex; gap:8px; align-items:flex-start; background:rgba(159,203,168,0.08); border:1px solid rgba(111,163,122,.35);
    border-radius:10px; padding:9px 12px; margin:4px 0 12px; font-size:11.5px; color:#B9D9BE; line-height:1.45;}
  .weighbtn{ width:100%; padding:11px; border-radius:11px; border:1px dashed var(--border); background:none; color:var(--copper-bright); font-weight:600; font-size:12.5px; cursor:pointer; margin:8px 0 14px;}
  .wilist{ display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 4px;}
  .wichip{ background:var(--surface2); border:1px solid var(--border-soft); border-radius:8px; padding:6px 9px; font-family:'IBM Plex Mono'; font-size:10.5px; color:var(--text-dim); cursor:pointer;}
  .wichip .wx{ color:var(--text-faint); margin-left:3px;}
  .wichip:active{ border-color:var(--danger);}
  .resetlink{ text-align:center; font-size:11px; color:var(--text-faint); text-decoration:underline; cursor:pointer; padding:14px 0 6px;}
  .backuprow{ display:flex; gap:10px; margin-top:12px;}
  .backupbtn{ flex:1; padding:11px; border-radius:11px; border:1px solid var(--border); background:var(--surface2); color:var(--chalk); font-weight:600; font-size:12.5px; cursor:pointer; font-family:'Inter';}
  .backupbtn:active{ background:var(--copper-15); border-color:var(--copper-30);}
  .installtoast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(84px + env(safe-area-inset-bottom)); z-index:60;
    background:var(--surface2); border:1px solid var(--copper-30); border-radius:12px; padding:11px 15px; display:flex; gap:12px; align-items:center;
    box-shadow:0 12px 40px rgba(0,0,0,.55); font-size:12.5px; color:var(--chalk); max-width:340px; width:calc(100% - 40px);}
  .installtoast button{ background:var(--copper); border:none; color:#0A0A0B; font-weight:700; padding:7px 13px; border-radius:8px; font-size:12px; cursor:pointer; white-space:nowrap;}
  .installtoast .x{ color:var(--text-faint); cursor:pointer; font-size:15px; padding:0 2px;}

  /* ===== Auth / login screens ===== */
  .authgate{ position:absolute; inset:0; z-index:80; background:radial-gradient(ellipse at top, #16171A 0%, #0A0A0B 62%);
    display:none; flex-direction:column; padding:0 26px calc(30px + env(safe-area-inset-bottom)); overflow-y:auto; }
  .authgate.on{ display:flex; }
  .authgate .brand{ margin-top:calc(64px + env(safe-area-inset-top)); text-align:center; }
  .authgate .logo{ width:66px; height:66px; margin:0 auto 16px; border-radius:20px; background:#0A0A0B; border:1px solid var(--border);
    display:flex; align-items:center; justify-content:center; }
  .authgate .logo svg{ width:40px; height:40px; }
  .authgate .wordmark{ font-family:'Oswald'; font-weight:700; font-size:30px; letter-spacing:.06em; }
  .authgate .wordmark b{ color:var(--copper-bright); }
  .authgate .tagline{ color:var(--text-dim); font-size:13px; margin-top:5px; letter-spacing:.02em; }
  .authgate .spacer{ flex:1; min-height:26px; }
  .authcard{ background:var(--surface); border:1px solid var(--border-soft); border-radius:18px; padding:22px 20px; }
  .authcard h3{ font-family:'Oswald'; font-weight:600; font-size:19px; margin-bottom:4px; }
  .authcard .sub{ color:var(--text-dim); font-size:12.5px; margin-bottom:18px; line-height:1.45; }
  .authfield{ margin-bottom:14px; }
  .authfield label{ display:block; font-size:10px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); font-weight:700; margin-bottom:7px; }
  .authfield input{ width:100%; background:var(--bg); border:1px solid var(--border); border-radius:11px; padding:13px 14px; color:var(--chalk);
    font-family:'Inter'; font-size:15px; outline:none; }
  .authfield input:focus{ border-color:var(--copper-30); }
  .pinboxes{ display:flex; gap:10px; justify-content:center; margin:6px 0 2px; }
  .pinboxes input{ width:52px; height:58px; text-align:center; font-family:'IBM Plex Mono'; font-size:24px; background:var(--bg);
    border:1px solid var(--border); border-radius:12px; color:var(--chalk); outline:none; }
  .pinboxes input:focus{ border-color:var(--copper); }
  .authbtn{ width:100%; padding:14px; border-radius:12px; border:none; background:var(--copper); color:#0A0A0B; font-weight:700; font-size:15px;
    font-family:'Inter'; cursor:pointer; margin-top:6px; }
  .authbtn:active{ background:var(--copper-bright); }
  .authbtn.ghost{ background:none; border:1px solid var(--border); color:var(--chalk); }
  .authbtn.ghost:active{ background:var(--surface2); }
  .authlink{ text-align:center; color:var(--copper-bright); font-size:13px; font-weight:600; margin-top:16px; cursor:pointer; }
  .autherr{ color:var(--danger); font-size:12px; text-align:center; margin-top:10px; min-height:15px; }
  .authnote{ font-size:11px; color:var(--text-faint); line-height:1.5; margin-top:16px; text-align:center; }
  .profilepick{ display:flex; flex-direction:column; gap:10px; margin-top:4px; }
  .profilerow{ display:flex; align-items:center; gap:13px; padding:14px 16px; background:var(--surface2); border:1px solid var(--border-soft);
    border-radius:13px; cursor:pointer; }
  .profilerow:active{ border-color:var(--copper-30); }
  .profilerow .av{ width:42px; height:42px; border-radius:50%; background:var(--copper-15); color:var(--copper-bright);
    display:flex; align-items:center; justify-content:center; font-family:'Oswald'; font-weight:600; font-size:18px; flex-shrink:0; }
  .profilerow .pinfo{ flex:1; }
  .profilerow .pinfo .nm{ font-weight:600; font-size:14.5px; }
