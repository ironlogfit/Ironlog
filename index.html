/* ============ COACHMARK TOUR ENGINE ============
   A first-run guided tour: a dimmed overlay spotlights one real UI element at a
   time with a short callout, stepping through the important parts of a screen.
   It appears ONCE per screen for new users, then never again. Positioning is a
   pure function so it can be reasoned about and tested; the runtime just wires it
   to live element rects. Missing targets are skipped, so a tour never gets stuck
   pointing at something that isn't on screen. */
const TOURS = {
  templates: [
    { sel:'.tpl-toggle', title:'Your program lives here', body:'Browse ready-made programs or build your own. This is the home for everything you\u2019ll train.', place:'bottom' },
    { sel:'.activatebtn', title:'Pick one to start', body:'Open a plan and tap \u201CSet as active\u201D \u2014 that becomes the workouts your coach writes. You can switch anytime.', place:'top' },
    { sel:'#bottomnav', title:'Move around here', body:'Workout, Progress, Macros, Health and Templates. Your daily training lives under Workout.', place:'top' },
  ],
  workout: [
    { sel:'.suggest-chip', title:'Your coach\u2019s call', body:'For every exercise the coach suggests a working weight and rep target \u2014 the \u25C6 line. Tap it to cycle alternatives.', place:'bottom' },
    { sel:'.setrow', title:'Log each set', body:'The grey numbers are the suggestion. Type your actual weight and reps, or just accept the hint.', place:'bottom' },
    { sel:'.setrow .logbtn', title:'Tick to bank it', body:'Tap \u2713 to log the set. A rest timer starts, and the coach uses what you did to plan next time.', place:'left' },
    { sel:'#bottomnav', title:'The rest of the app', body:'Check volume and records in Progress, hit your targets in Macros, and track bodyweight in Health.', place:'top' },
  ],
};
var _tour = null;   // { id, steps, i } while a tour is running
/* Pure geometry: given a target rect and the viewport, where do the spotlight
   hole and the callout go? Callout below the target if it fits, otherwise above;
   horizontally centred on the target and clamped to the viewport. */
function tourGeometry(rect, vpW, vpH, popW, popH){
  const pad = 6, gap = 12, margin = 12;
  const hole = {
    left: Math.max(0, rect.left - pad), top: Math.max(0, rect.top - pad),
    width: Math.min(vpW, rect.width + pad*2), height: rect.height + pad*2,
  };
  const belowRoom = vpH - (hole.top + hole.height) - gap;
  const place = belowRoom >= popH ? 'bottom' : 'top';
  let top = place==='bottom' ? hole.top + hole.height + gap : hole.top - gap - popH;
  top = Math.max(margin, Math.min(top, vpH - popH - margin));
  let left = rect.left + rect.width/2 - popW/2;
  left = Math.max(margin, Math.min(left, vpW - popW - margin));
  return { hole, pop:{ top, left, place } };
}
function tourSeen(id){ return !!(onboardingState().tours||{})[id]; }
function markTourSeen(id){ const ob=onboardingState(); (ob.tours||(ob.tours={}))[id]=true; saveState(); }
/* Should this screen's tour auto-run now? Only for genuinely new users, only
   once, and only if at least the first target is actually on screen. */
function maybeStartTour(screenId){
  if(_tour) return;                                   // one at a time
  if(onboardingState().established) return;           // existing users opt out
  const steps = TOURS[screenId];
  if(!steps || tourSeen(screenId)) return;
  // Defer a beat so the freshly-rendered layout has real rects to point at.
  setTimeout(function(){
    if(_tour || tourSeen(screenId)) return;
    if(!document.querySelector(steps[0].sel)) return; // nothing to point at yet
    startTour(screenId);
  }, 420);
}
function startTour(id){
  const steps = TOURS[id];
  if(!steps) return;
  _tour = { id, steps, i:0 };
  ensureTourEls();
  renderTourStep();
}
function ensureTourEls(){
  if(document.getElementById('tourOverlay')) return;
  const o = document.createElement('div');
  o.id = 'tourOverlay'; o.className = 'tour-ov';
  o.innerHTML = '<div class="tour-hole" id="tourHole"></div><div class="tour-pop" id="tourPop"></div>';
  document.body.appendChild(o);
}
function nextPresentStep(from){
  let k = from;
  while(k < _tour.steps.length && !document.querySelector(_tour.steps[k].sel)) k++;
  return k;   // an index with a present target, or steps.length if none remain
}
function renderTourStep(){
  if(!_tour) return;
  // Land on the next step whose target actually exists (never point at nothing).
  _tour.i = nextPresentStep(_tour.i);
  if(_tour.i >= _tour.steps.length){ endTour(true); return; }
  const step = _tour.steps[_tour.i];
  const el = document.querySelector(step.sel);
  if(!el){ endTour(true); return; }                 // defensive: nothing to anchor to
  if(el.scrollIntoView) { try{ el.scrollIntoView({ block:'center', behavior:'smooth' }); }catch(e){} }
  const rect = el.getBoundingClientRect();
  const vpW = window.innerWidth||380, vpH = window.innerHeight||740;
  const popW = Math.min(300, vpW - 24), popH = 150;
  const g = tourGeometry(rect, vpW, vpH, popW, popH);
  const hole = document.getElementById('tourHole');
  const pop = document.getElementById('tourPop');
  if(!hole || !pop){ endTour(false); return; }
  hole.style.left = g.hole.left+'px'; hole.style.top = g.hole.top+'px';
  hole.style.width = g.hole.width+'px'; hole.style.height = g.hole.height+'px';
  // "Done" must show on the last step that has a visible target, not merely the
  // last index — otherwise Next on the final visible step would just close the
  // tour and look like it did nothing.
  const last = nextPresentStep(_tour.i+1) >= _tour.steps.length;
  pop.style.left = g.pop.left+'px'; pop.style.top = g.pop.top+'px'; pop.style.width = popW+'px';
  pop.className = 'tour-pop '+g.pop.place;
  pop.innerHTML = `
    <div class="tp-h">${step.title}</div>
    <div class="tp-b">${step.body}</div>
    <div class="tp-f">
      <span class="tp-dots">${_tour.steps.map((_,k)=>`<i class="${k===_tour.i?'on':''}"></i>`).join('')}</span>
      <span class="tp-btns">
        <button class="tp-skip" onclick="tourSkip()">Skip</button>
        ${_tour.i>0?'<button class="tp-back" onclick="tourBack()">Back</button>':''}
        <button class="tp-next" onclick="tourNext()">${last?'Done':'Next'}</button>
      </span>
    </div>`;
}
function tourNext(){ if(!_tour) return; _tour.i = nextPresentStep(_tour.i+1); if(_tour.i>=_tour.steps.length){ endTour(true); } else { renderTourStep(); } }
function tourBack(){ if(!_tour||_tour.i===0) return; let k=_tour.i-1; while(k>0 && !document.querySelector(_tour.steps[k].sel)) k--; _tour.i=k; renderTourStep(); }
function tourSkip(){ endTour(true); }
function endTour(seen){
  if(_tour && seen) markTourSeen(_tour.id);
  _tour = null;
  const o = document.getElementById('tourOverlay');
  if(o && o.parentNode) o.parentNode.removeChild(o);
}
/* Re-anchor the callout if the viewport changes mid-tour. */
if(typeof window!=='undefined' && window.addEventListener){
  window.addEventListener('resize', function(){ if(_tour) renderTourStep(); });
}
/* Injected once per render, at the very top of whatever section is on screen, so
   the guide follows the user across tabs during setup. When they've opted out
   but aren't finished, a slim re-open chip takes its place. */
function injectOnboarding(){
  const c = document.getElementById('content');
  if(!c) return;
  let pre = '';
  // The setup tracker is a small, quiet card that lives ONLY on Progress — never
  // on the workout screen — so day-to-day training is never interrupted by it.
  if(state.tab==='progress' && !onboardingState().established && !onboardingProgress().allDone){
    pre += setupTrackerHtml();
  }
  pre += sectionHintHtml();     // slim per-section first-visit note (not on Workout)
  if(pre) c.insertAdjacentHTML('afterbegin', pre);
  // First-time coachmark tour for this screen (deferred so layout settles).
  maybeStartTour(state.tab);
}

];
function dismissHint(id){ onboardingState().hints[id]=true; saveState(); render(); }
function sectionHintHtml(){
  const ob = onboardingState();
  if(ob.established) return '';                 // existing users: no section hints
  const h = SECTION_HINTS.find(function(x){
    return x.match() && !ob.hints[x.id] && (!x.show || x.show());
  });
  if(!h) return '';
  const i = SECTION_HINTS.indexOf(h);
  return `<div class="shint">
    <span class="sh-i">\u{1F4A1}</span>
    <span class="sh-b">${h.body}</span>
    <span class="sh-act">${h.cta?`<button class="sh-cta" onclick="sectionHintGo(${i})">${h.cta}</button>`:''}<button class="sh-x" onclick="dismissHint('${h.id}')">Got it</button></span>
  </div>`;
}
function sectionHintGo(i){ const h=SECTION_HINTS[i]; if(h && h.go){ dismissHint(h.id); h.go(); } }

/* ============ WEEKLY REVIEW ============
   End-of-week coaching pass. Computes what actually happened, proposes
   changes as a before → after diff, and only mutates the plan for the
   changes the user ticks. A coach recommends; the athlete decides. */

/* Sessions trained and set adherence for a given week. */
function weekSessionStats(w){
  const { plan } = getActivePlan();
  if(!plan) return { done:0, planned:0, loggedSets:0, plannedSets:0 };
  let done=0, loggedSets=0, plannedSets=0;
  plan.days.forEach((day,di)=>{
    let dayLogged=0;
    day.exercises.forEach(ex=>{
      const n = ex.sets.length + (state.extraSets[xkey(w,di,ex.id)]||0);
      plannedSets += n;
      for(let i=0;i<n;i++){
        const l = getLog(w,di,ex.id,i);
        if(l && l.logged && l.type!=='WU'){ loggedSets++; dayLogged++; }
      }
    });
    if(dayLogged>0) done++;
  });
  return { done, planned:plan.days.length, loggedSets, plannedSets };
}

/* Best estimated 1RM per exercise for a given week. */
function weekBestByExercise(w){
  const { plan } = getActivePlan();
  const out = {};
  if(!plan) return out;
  plan.days.forEach((day,di)=>{
    day.exercises.forEach(ex=>{
      const n = ex.sets.length + (state.extraSets[xkey(w,di,ex.id)]||0);
      for(let i=0;i<n;i++){
        const l = getLog(w,di,ex.id,i);
        if(!l || !l.logged || l.type==='WU') continue;
        const reps = parseReps(l.r);
        const score = e1rm(l.w, reps);
        if(score==null) continue;
        if(!out[ex.name] || score > out[ex.name].score){
          out[ex.name] = { score, w:l.w, r:reps, unit:ex.unit, fresh: ex.freshWeek===w };
        }
      }
    });
  });
  return out;
}

/* Strength movement between two weeks, strongest change first. */
function strengthDeltas(w){
  if(w<=1) return [];
  const now = weekBestByExercise(w), prev = weekBestByExercise(w-1);
  const out = [];
  Object.keys(now).forEach(name=>{
    if(!prev[name]) return;
    // If this slot was swapped to a DIFFERENT exercise during week w, last week's
    // numbers under this name belong to the old exercise/machine, so there's no
    // valid like-for-like comparison — don't report a phantom weight change.
    if(now[name].fresh) return;
    const a = prev[name], b = now[name];
    const diff = +(b.score - a.score).toFixed(1);
    const pct  = a.score? (diff/a.score)*100 : 0;
    let dir = 'flat';
    if(pct >= 1.5) dir = 'up'; else if(pct <= -1.5) dir = 'down';
    out.push({ name, dir, diff, pct:+pct.toFixed(1), from:a, to:b });
  });
  out.sort((a,b)=> Math.abs(b.pct) - Math.abs(a.pct));
  return out;
}

/* Recovery read for the week, from the session-feedback answers. */
function weekRecovery(w){
  const { plan } = getActivePlan();
  if(!plan) return { label:'No feedback', tone:'flat', reasons:[] };
  let sum=0, n=0; const reasons=[];
  plan.days.forEach((d,di)=>{
    const fb = state.volAdj[`w${w}|d${di}`];
    if(fb){ sum += fb.adj; n++; (fb.reasons||[]).forEach(r=>{ if(!reasons.includes(r)) reasons.push(r); }); }
  });
  if(!n) return { label:'None logged', tone:'flat', reasons:[] };
  const avg = sum/n;
  if(avg < -0.3) return { label:'Concerns reported', tone:'down', reasons };
  if(avg >  0.3) return { label:'Reported as easy', tone:'up', reasons };
  return { label:'No concerns reported', tone:'up', reasons };
}

/* How confident the coach is in a given recommendation. */
function recConfidence(r){
  let score = 0;
  if(r.weeks >= 3) score += 2; else if(r.weeks >= 2) score += 1;
  if((r.severity||0) > 0.35) score += 1;
  const rs = recoverySignalFor(r.muscle);
  if(r.dir > 0 && rs.avg >= 0) score += 1;      // adding, and recovery agrees
  if(r.dir < 0 && rs.avg <= 0) score += 1;      // cutting, and recovery agrees
  return score >= 4 ? 'High' : score >= 2 ? 'Moderate' : 'Low';
}

/* The plain-language evidence behind a recommendation. */
/* What was observed, stated without interpretation. No claim is made here
   about cause — these are the readings the suggestion was drawn from. */
function recReasons(r){
  const L = VOL_LANDMARKS[r.muscle] || {};
  const rs = recoverySignalFor(r.muscle);
  const out = [];
  out.push(`${r.avg} sets a week, averaged over ${r.weeks} week${r.weeks===1?'':'s'}`);
  if(r.dir > 0)      out.push(`Range commonly used as a starting point: ${L.lo}–${L.hi} sets`);
  else if(r.dir < 0) out.push(`Recovery is often reported as harder above ~${L.mrv} sets`);
  if(rs.reasons && rs.reasons.length) out.push(`Your feedback reported ${rs.reasons.join(' and ')}`);
  else out.push('No recovery concerns reported in your session feedback');
  return out;
}
/* The dataset behind a suggestion — countable, checkable, no interpretation.
   Replaces a confidence label: the reader judges the strength themselves. */
function dataBasis(r){
  const s = weekSessionStats(state.week);
  const bits = [`${r.weeks} week${r.weeks===1?'':'s'} of logs`];
  if(s.planned) bits.push(`${s.done}/${s.planned} sessions this week`);
  return 'Based on ' + bits.join(' · ');
}

/* Which exercises a set change would actually land on. */
function targetsForMuscle(muscle, delta){
  const { plan } = getActivePlan();
  if(!plan) return [];
  const targets = [];
  plan.days.forEach(d=>d.exercises.forEach(ex=>{ if(ex.muscle===muscle) targets.push(ex); }));
  if(!targets.length) return [];
  const sim = targets.map(ex=>({ name:ex.name, before:ex.sets.length, after:ex.sets.length }));
  let left = Math.abs(delta);
  while(left-- > 0){
    if(delta > 0){
      sim.sort((a,b)=>a.after-b.after);
      sim[0].after++;
    } else {
      sim.sort((a,b)=>b.after-a.after);
      if(sim[0].after > 1) sim[0].after--;
    }
  }
  return sim.filter(s=>s.after !== s.before);
}

/* The full change set proposed for the coming week. */
let reviewSkipped = {};
function reviewChanges(){
  const { locked } = getActivePlan();
  if(locked) return [];
  return volumeRecommendations()
    .filter(r=>!r.blocked && r.dir !== 0 && r.add)
    .map(r=>({
      id: `vol-${r.muscle}`,
      muscle: r.muscle,
      title: `${r.dir>0?'Increase':'Reduce'} ${MUSCLE_LABEL[r.muscle]||r.muscle} volume`,
      add: r.add,
      before: r.avg,
      after: +(r.avg + r.add).toFixed(1),
      obs: r.obs || '',
      reasons: recReasons(r),
      basis: dataBasis(r),
      confidence: recConfidence(r),   // internal only — sets the default tick, never shown
      targets: targetsForMuscle(r.muscle, r.add)
    }));
}

/* Selection state for the review sheet. */
let reviewSel = {};
function toggleReviewChange(id){
  reviewSel[id] = !reviewSel[id];
  renderModal('review');
}
function applyReviewChanges(){
  const changes = reviewChanges().filter(c=>reviewSel[c.id]);
  if(!changes.length){ closeModal(); return; }
  changes.forEach(c=>applyVolumeRecSilent(c.muscle, c.add));
  state.lastReviewWeek = state.week;
  endReview();                    // restore the week we came from before re-render
  saveState();
  closeModal();
  render();
}
function skipReviewWeek(){
  reviewChanges().forEach(c=>{
    if(!state.volRecDone) state.volRecDone = {};
    state.volRecDone[`${c.muscle}|w${state.week}`] = true;
  });
  state.lastReviewWeek = state.week;
  endReview();
  saveState(); closeModal(); render();
}
/* Same edit as applyVolumeRec but without its own save/render, so a batch
   of approved changes applies as one atomic step. */
function applyVolumeRecSilent(muscle, delta){
  const { plan, locked } = getActivePlan();
  if(!plan || locked) return;
  const targets = [];
  plan.days.forEach(d=>d.exercises.forEach(ex=>{ if(ex.muscle===muscle) targets.push({ex}); }));
  if(!targets.length) return;
  let left = Math.abs(delta);
  while(left-- > 0){
    if(delta > 0){
      targets.sort((a,b)=>a.ex.sets.length-b.ex.sets.length);
      const t = targets[0];
      const last = t.ex.sets[t.ex.sets.length-1] || {w:null,r:null};
      t.ex.sets.push({ w:last.w, r:last.r });
    } else {
      targets.sort((a,b)=>b.ex.sets.length-a.ex.sets.length);
      const t = targets[0];
      if(t.ex.sets.length > 1) t.ex.sets.pop();
    }
  }
  if(!state.volRecDone) state.volRecDone = {};
  state.volRecDone[`${muscle}|w${state.week}`] = true;
}

/* The most recent week that's essentially done and not yet reviewed — found
   independent of which week you're currently viewing, so the prompt reaches you
   on the CURRENT week (where you land when a new week begins) instead of hiding
   until you navigate back to the finished one. */
function pendingReviewWeek(){
  const { plan } = getActivePlan();
  if(!plan) return null;
  const cur = mesoStart() ? mesoWeekNow() : state.week;
  const reviewed = state.lastReviewWeek || 0;
  for(let w = Math.min(cur, mesoWeeks()); w >= 2; w--){
    if(w <= reviewed) break;                 // reviewed this week and everything before it
    const s = weekSessionStats(w);
    if(s.planned > 0 && s.done >= Math.max(1, plan.days.length - 1)) return w;
  }
  return null;
}
function reviewReady(){ return pendingReviewWeek() != null; }
function reviewBanner(){
  const w = pendingReviewWeek();
  if(w == null) return '';
  return `<div class="wr-banner" onclick="openReview(${w})">
    <div class="wr-b-l">
      <div class="wr-b-t">Week ${w} wrapped \u2014 your review is ready</div>
      <div class="wr-b-s">Sessions, PRs and the coach\u2019s tweaks for the week ahead</div>
    </div>
    <span class="wr-b-go">Review \u203A</span>
  </div>`;
}
/* Opening the review briefly focuses the week being reviewed (the review engine
   is week-scoped), then hands you back to wherever you were on finish/close. */
let _reviewReturnWeek = null;
function endReview(){ if(_reviewReturnWeek!=null){ state.week=_reviewReturnWeek; _reviewReturnWeek=null; } }
function openReview(w){
  _reviewReturnWeek = state.week;
  if(w!=null && w!==state.week) state.week = w;
  reviewSel = {};
  reviewChanges().forEach(c=>{ reviewSel[c.id] = c.confidence !== 'Low'; });
  openModal('review');
}

/* Volume advice engine. Week-aware and priority-aware.
   - Mid-week it reasons about PROJECTED end-of-week volume (logged + still
     scheduled), so it never nags "under range" when more training days remain.
   - "Below range" is only asserted once the week is genuinely complete, or —
     more usefully mid-week — surfaced as "last week you finished under range".
   - Priority (specialisation) muscles are pushed toward the top of the band;
     everyone else is judged against MAINTENANCE volume, which is deliberately
     lower — holding muscle takes fewer sets than building it, and on a deficit
     recovery should be spent on the priorities, not everywhere.               */
function volMaintainFloor(m){                     // ~enough to hold, not grow
  const L = VOL_LANDMARKS[m]; if(!L) return 0;
  return Math.max(L.mev, Math.round(L.lo * 0.6)); // ~60% of growth-low, ≥ MEV
}
function volumeInsightsHtml(done, proj, lastWk, muscles, planned, wk){
  const items = [];
  const anyPriority = muscles.some(isPriorityMuscle);

  // 1) OVER the ceiling — always worth flagging now (recovery, not projection).
  muscles.filter(m=>(done[m]||0) > VOL_LANDMARKS[m].mrv).forEach(m=>{
    items.push(`<div class="vi over">${MUSCLE_LABEL[m]} is at <b>${done[m]} sets</b> — above its usual ceiling (~${VOL_LANDMARKS[m].mrv}). Recovery is often reported as harder here, though tolerance varies. On a cut especially, this is the first place to trim.</div>`);
  });

  // 2) PROJECTED shortfall for PRIORITY muscles, only if the projection still
  //    lands short once every remaining day is done. Actionable, not premature.
  muscles.filter(isPriorityMuscle).forEach(m=>{
    const L = VOL_LANDMARKS[m], p = proj[m]||0;
    if(p < L.lo){
      const gap = Math.max(2, L.lo - p);
      const when = wk.complete ? `finished at <b>${done[m]||0}</b>` : `is on track for <b>${p}</b>`;
      items.push(`<div class="vi under">${MUSCLE_LABEL[m]} (priority) ${when} set${p===1?'':'s'} this week — below the ${L.lo}–${L.hi} growth range. To push it, add about ${gap} set${gap===1?'':'s'}${wk.complete?'':' next session'}.</div>`);
    } else if(p >= L.hi){
      items.push(`<div class="vi good">${MUSCLE_LABEL[m]} (priority) ${wk.complete?'hit':'is on track for'} <b>${p}</b> sets — into the upper range. More can still add a little, but returns shrink here and you're dieting, so hold unless recovery feels strong.</div>`);
    }
  });

  // 3) MAINTENANCE muscles: only speak up if they're genuinely low OR wastefully
  //    high. Being merely below the GROWTH band is fine — that's the point.
  muscles.filter(m=>!isPriorityMuscle(m)).forEach(m=>{
    const L = VOL_LANDMARKS[m], p = proj[m]||0, floor = volMaintainFloor(m);
    if(wk.complete && (done[m]||0) < L.mev && (done[m]||0) > 0){
      items.push(`<div class="vi under">${MUSCLE_LABEL[m]} finished at <b>${done[m]}</b> set${done[m]===1?'':'s'} — below even a maintenance dose (~${floor}). If you want to hold it while cutting, nudge it up a little.</div>`);
    } else if(anyPriority && p > L.hi){
      items.push(`<div class="vi over">${MUSCLE_LABEL[m]} ${wk.complete?'is at':'projects to'} <b>${p}</b> sets — more than maintenance needs. While specialising, spare recovery here and spend it on your priority muscles.</div>`);
    }
  });

  // 4) LAST WEEK shortfall — the useful mid-week retrospective you asked for:
  //    don't nag about this week, but a completed week that came up short is
  //    worth knowing. Only when we're mid-current-week (not on past weeks).
  if(!wk.complete && lastWk && Object.keys(lastWk).length){
    muscles.filter(isPriorityMuscle).forEach(m=>{
      const L = VOL_LANDMARKS[m], lp = lastWk[m]||0;
      if(lp>0 && lp < L.lo){
        items.push(`<div class="vi stall">Last week ${MUSCLE_LABEL[m]} (priority) finished at <b>${lp}</b> set${lp===1?'':'s'}, under its ${L.lo}–${L.hi} range. Worth making sure this week lands higher.</div>`);
      }
    });
  }

  // 5) Stalls (unchanged — real signal regardless of volume).
  (typeof plateaus==='function'? plateaus() : []).forEach(s=>{
    items.push(`<div class="vi stall"><b>${s.name}</b> hasn't exceeded its previous peak in ${s.sessions} sessions (peak e1RM ${s.peak}, was ${s.prior}). Could be fatigue, calories, sleep, or the stimulus — the log alone can't separate them.</div>`);
  });

  if(!items.length){
    const total = Object.values(done).reduce((a,b)=>a+b,0);
    if(total<=0) return '';
    const msg = wk.complete
      ? 'Every muscle you trained sits in a sensible range this week, and nothing has stalled.'
      : 'On track so far — projected volumes sit in range for every muscle, with training still to come this week.';
    return `<div class="vinsights"><div class="vi good">${msg}</div></div>`;
  }
  const head = wk.complete ? 'What your log shows' : 'On track — a few notes';
  return `<div class="vinsights"><div class="vi-t">${head}</div>${items.join('')}</div>`;
}

function renderVolumeView(toggle){
  const thisWk = weeklySetsByMuscle(state.week);
  const lastWk = state.week>1 ? weeklySetsByMuscle(state.week-1) : {};
  const planned = plannedMuscles();
  const muscles = [...new Set([...planned, ...Object.keys(thisWk)])]
    .filter(m=>VOL_LANDMARKS[m])
    .sort((a,b)=>(thisWk[b]||0)-(thisWk[a]||0));
  const totalSets = Object.values(thisWk).reduce((a,b)=>a+b,0);

  const rows = muscles.map(m=>{
    const L = VOL_LANDMARKS[m];
    const n = thisWk[m]||0, prev = lastWk[m]||0;
    const st = volStatus(m, n);
    const scale = L.mrv * 1.25;
    const pct = x => Math.min(100, (x/scale)*100);
    const delta = state.week>1 ? n-prev : null;
    const label = { none:'NOT TRAINED', under:'BELOW MINIMUM', low:'BUILDING', good:'PRODUCTIVE RANGE', high:'HIGH', over:'ABOVE CEILING' }[st];
    return `
      <div class="vol-row ${st}">
        <div class="vol-head">
          <span class="vm">${MUSCLE_LABEL[m]||m}<button class="vprio ${isPriorityMuscle(m)?'on':''}" onclick="togglePriorityMuscle('${m}')" title="${isPriorityMuscle(m)?'Priority muscle — drive volume up':'Mark as a growth priority'}">${isPriorityMuscle(m)?'\u2605':'\u2606'}</button></span>
          <span class="vs"><b>${n}</b> sets${delta!==null && delta!==0? ` <span class="vd ${delta>0?'up':'dn'}">${delta>0?'+':''}${delta}</span>`:''}</span>
        </div>
        <div class="vol-track">
          <div class="vband" style="left:${pct(L.lo)}%; width:${pct(L.hi)-pct(L.lo)}%"></div>
          <div class="vtick mev" style="left:${pct(L.mev)}%"></div>
          <div class="vtick mrv" style="left:${pct(L.mrv)}%"></div>
          <div class="vfill ${st}" style="width:${pct(n)}%"></div>
        </div>
        <div class="vol-foot">
          <span class="vstat ${st}">${label}</span>
          <span class="vrange">target ${L.lo}–${L.hi} · ${gt('mrv','ceiling')} ${L.mrv}</span>
        </div>
      </div>`;
  }).join('');

  const wk = weekDayStatus(state.week);
  const proj = wk.complete ? thisWk : projectedSetsByMuscle(state.week);
  const insights = volumeInsightsHtml(thisWk, proj, lastWk, muscles, planned, wk);

  document.getElementById('content').innerHTML = `
    <div class="pagehead">
      <div class="eyebrow">Week ${state.week}${mesoStart()? ' of '+mesoWeeks():''} · hard sets by muscle</div>
      <h1>Volume</h1>
      <div class="sub">${gt('volume','Volume')} is your hard sets per muscle each week — warm-ups excluded, counted from what you actually logged, not what was programmed.</div>
    </div>
    ${toggle}
    ${totalSets===0
      ? `${volumeRecCard()}
         <div class="emptystate" style="padding:30px 20px;"><div class="big">📊</div>
          <div class="t">No sets logged in week ${state.week} yet.<br>Log a session and your weekly volume per muscle appears here, checked against the ranges the research supports.</div></div>`
      : `<div class="voltotal"><b>${totalSets}</b> hard sets logged across ${muscles.filter(m=>thisWk[m]>0).length} muscle groups this week</div>
         ${rows}
         ${volumeRecCard()}
         ${insights}
         <div class="medcaution" style="margin-top:18px;">
           <div class="mc-t">How to read this</div>
           The shaded band is where most trained lifters get the majority of their growth — roughly 12–20 weekly sets, from Schoenfeld's dose-response work and the 2025 meta-regression across 67 studies. The left tick is ${gt('mev','MEV')}, the right is ${gt('mrv','MRV')}.
           The newer data shows gains still creeping up past that band rather than falling off a cliff, so the ceiling is a <b>recovery</b> guide, not a hard limit.
           Sets only count if they were genuinely hard, and compound lifts do partial work for assisting muscles that isn't counted here — so your real chest and delt volume is a little higher than shown.
         </div>`}
  `;
}

/* ============ WORKOUT ============ */
function renderWorkout(){
  const { plan, locked, structureLocked } = getActivePlan();
  const toggle = `
    <div class="tpl-toggle" style="margin:8px 0 4px;">
      <button class="${state.workoutView==='today'?'active':''}" onclick="setWorkoutView('today')">Today</button>
      <button class="${state.workoutView==='history'?'active':''}" onclick="setWorkoutView('history')">All exercises</button>
      <button class="${state.workoutView==='volume'?'active':''}" onclick="setWorkoutView('volume')">Volume</button>
    </div>`;
  if(state.workoutView==='history'){ renderHistoryView(toggle); return; }
  if(state.workoutView==='volume'){ renderVolumeView(toggle); return; }
  if(!plan){
    document.getElementById('content').innerHTML = `
      <div class="pagehead"><div class="eyebrow">Workout</div><h1>No active plan</h1></div>${toggle}
      <div class="emptystate"><div class="big">🏋️</div><div class="t"><b>No plan running yet.</b><br>
        Choose a programme in Templates, or build your own. You can change it any time — nothing is locked in.</div></div>
      <button class="addmeal" onclick="setTab('templates')">Go to Templates</button>`;
    return;
  }
  if(state.dayIdx >= plan.days.length) state.dayIdx = 0;
  const day = plan.days[state.dayIdx];
  const adjInfo = dayAdj(state.week, state.dayIdx);
  const adj = adjInfo? adjInfo.adj : 0;

  const setsOf = ex => {
    const ai = aiTarget(ex, state.dayIdx);
    const base = Math.max(2, Math.max(ex.sets.length, ai.sets||0) + adj);
    return base + (state.extraSets[xkey(state.week,state.dayIdx,ex.id)]||0);
  };
  const totalSets = day.exercises.reduce((a,e)=>a+setsOf(e),0);
  let doneSets = 0;
  day.exercises.forEach(ex=>{ for(let i=0;i<setsOf(ex);i++){ const l=getLog(state.week,state.dayIdx,ex.id,i); if(l&&l.logged) doneSets++; } });

  let bar='';
  for(let i=0;i<totalSets;i++){ const h = 14+(i%3)*4; bar += `<div class="seg ${i<doneSets?'done':''}" style="height:${h}px"></div>`; }

  const weekChips = Array.from({length:mesoWeeks()},(_,i)=>{
    const w=i+1;
    return `<div class="chip ${w===state.week?'active':''}" onclick="setWeek(${w})">W${w}${w===mesoWeeks()?' · DL':''}</div>`;
  }).join('');

  /* Full-week overview: the REAL current week, Monday → Sunday, with training
     days mapped onto the weekdays the user chose and today highlighted. This
     panel is ALWAYS the current week (that's the only week you can reshuffle),
     so its arrangement AND its logged-set badges must both read from the same
     week — otherwise selecting a past week chip would paint that week's sessions
     onto the current week's shuffle. */
  const calWk = mesoStart() ? mesoWeekNow() : state.week;
  const wkDates = currentWeekDates();
  const realTodayISO = todayISO();
  const weekRows = wkDates.map(dt=>{
    const wd = dt.getDay();
    const iso = isoOf(dt);
    const pi = planIdxForWeekday(wd, calWk);
    const isToday = iso === realTodayISO;
    const isPast = iso < realTodayISO;
    const moving = moveSrcPi !== null;
    const isSrc = moving && pi === moveSrcPi;
    const dLabel = `${DAY_ABBR[wd]}<span class="dnum">${dt.getDate()}</span>`;
    if(pi === null){
      return `<div class="weekrow rest ${isToday?'today':''} ${isPast?'past':''} ${moving?'target':''}"
        ${moving? `onclick="dropMoveDay(${wd})"`:''}>
        <span class="wd">${dLabel}</span>
        <div class="wn"><div class="t1">Rest${isToday?' · today':''}</div>
          <div class="t2">${moving? '<span class="movehint">Tap to move the session here</span>' : 'Recovery · steps + sleep'}</div></div>
      </div>`;
    }
    const d = plan.days[pi];
    if(!d) return '';
    // did they actually log anything that day?
    let logged = 0;
    d.exercises.forEach(ex=>{ for(let i=0;i<setsOf(ex);i++){ const l=getLog(calWk,pi,ex.id,i); if(l&&l.logged) logged++; } });
    const missed = isPast && logged===0;
    const muscles = [...new Set(d.exercises.map(e=>e.muscle))].slice(0,4).join(' · ');
    return `<div class="weekrow ${pi===state.dayIdx?'cur':''} ${isToday?'today':''} ${isPast?'past':''} ${isSrc?'moving':''} ${moving&&!isSrc?'target':''}"
      onclick="${moving? (isSrc? 'cancelMoveDay()' : `dropMoveDay(${wd})`) : `setDay(${pi}); state.weekOpen=false;`}">
      <span class="wd">${dLabel}</span>
      <div class="wn"><div class="t1">${d.name}${isToday?' <span class="todaytag">TODAY</span>':''}</div>
        <div class="t2">${isSrc? '<span class="movehint">Moving — tap a day, or tap here to cancel</span>'
          : moving? '<span class="movehint">Tap to swap with this session</span>'
          : (missed? '<span class="missed">Not logged</span> · ' : (logged>0? `<span class="doneb">${logged} sets logged</span> · `:'')) + `${d.exercises.length} exercises · ${muscles}`}</div></div>
      ${moving? '<span class="go">↔</span>'
        : `<span class="movebtn" onclick="event.stopPropagation(); startMoveDay(${pi})" title="Move this session to another day">⇅</span>`}
    </div>`;
  }).join('');

  const exHtml = day.exercises.map((ex,ei)=>{
    const ai = aiTarget(ex, state.dayIdx);
    const n = setsOf(ex);
    const noteKey = `${state.active.id}|w${state.week}|d${state.dayIdx}|${ex.id}`;
    const note = state.notes[noteKey];
    const rec = allRecords()[ex.name];
    const baseline = rec && rec.best ? `${fmtW(rec.best.w,ex.unit)} × ${rec.best.r} · ${rec.best.date}` : '—';
    let rows='';
    let doneSets = 0, topSet = null;      // for the collapsed summary
    let emptyFillable = 0;                // untouched sets a one-tap fill-all could populate
    let fillRowShown = false;             // "use last" appears ONCE, not on every empty row
    for(let i=0;i<n;i++){
      const prev = lastWeekLog(state.dayIdx, ex.id, i);
      const l = getLog(state.week,state.dayIdx,ex.id,i) || {};
      if(!l.logged && (l.w==null || l.r==null)) emptyFillable++;   // a fill-all would populate this row
      if(l.logged){
        doneSets++;
        if(l.type!=='WU'){
          const sc = e1rm(l.w, parseReps(l.r));
          if(sc!=null && (!topSet || sc > topSet.score)) topSet = { score:sc, w:l.w, r:l.r };
        }
      }
      const type = l.type||'';
      // The suggestion engine already accounts for last session (including a
      // mid-week PR on an earlier day) and for a chosen plateau fix. So the
      // AI target takes precedence for the placeholder; we fall back to the
      // previous weight only when the engine has nothing specific to say.
      // Without this, the box always showed last session's weight and hid both
      // the plateau-fix load and any within-week PR carry-over.
      const aiW = (ai && ai.w != null) ? ai.w : null;
      const aiR = (ai && ai.reps && ai.reps[Math.min(i, ai.reps.length-1)] != null) ? ai.reps[Math.min(i, ai.reps.length-1)] : null;
      // Placeholder priority mirrors logging: engine target → last week's set →
      // last weight actually logged for this lift → template default. The frozen
      // template number is the last resort so it can't masquerade as a baseline.
      const _ll = (aiW==null && !prev) ? lastLoggedWeight(ex.name) : {w:null,r:null};
      const phW = aiW != null ? aiW : (prev? prev.w : (_ll.w ?? ex.sets[Math.min(i,ex.sets.length-1)].w));
      const phR = aiR != null ? aiR : (prev? prev.r : (_ll.r ?? ex.sets[Math.min(i,ex.sets.length-1)].r));
      const plateCls = `plate ${l.logged?'logged':''} ${type==='WU'?'wu':''} ${type==='M'?'myo':''} ${(type==='TOP'||type==='BO'||type==='F')?'tag':''}`;
      const plateLbl = type==='M'? `${i+1}<span class="st">MYO</span>` : (SET_TAG_LABEL[type] || (i+1));
      const wField = `<div class="stepper">
            <button onclick="stepSet('${ex.id}',${i},'w',-1)">−</button>
            <input type="text" inputmode="decimal" value="${l.w ?? ''}" placeholder="${phW ?? '—'}" onchange="updSet('${ex.id}',${i},'w',this.value)">
            <button onclick="stepSet('${ex.id}',${i},'w',1)">+</button>
          </div>`;
      const rField = `<div class="stepper">
            <button onclick="stepSet('${ex.id}',${i},'r',-1)">−</button>
            <input type="text" inputmode="numeric" value="${l.r ?? ''}" placeholder="${phR ?? '—'}" onchange="updSet('${ex.id}',${i},'r',this.value)">
            <button onclick="stepSet('${ex.id}',${i},'r',1)">+</button>
          </div>`;
      rows += `<div class="setrow">
        <div class="${plateCls}" onclick="${structureLocked?'':'cycleType(\''+ex.id+'\','+i+')'}" title="Tap to tag: working → warm-up → top set → back-off → myo → to-failure">${plateLbl}</div>
        ${wField}${rField}
        <div class="logbtn ${l.logged?'on':''}" onclick="toggleSet('${ex.id}',${i})">✓</div>
      </div>${(()=>{
        // "use last" sits on its own full-width line UNDER the set — never a grid
        // column, so it can't break the row. It now appears on the FIRST empty
        // set only: repeating an identical "use last" line under every remaining
        // row was pure noise and competed with the one-tap Fill button above.
        // A tiny direction word rides along to show whether the engine wants
        // heavier or lighter than that.
        if(l.logged || l.w!=null || l.r!=null) return '';
        if(fillRowShown) return '';
        const prevS = lastWeekLog(state.dayIdx, ex.id, i) || (()=>{ const ll=lastLoggedWeight(ex.name); return ll.w!=null?{w:ll.w,r:ll.r}:null; })();
        if(!prevS || prevS.w==null) return '';
        fillRowShown = true;
        const dir = setDirection(ex.name, state.dayIdx, ex.id, i, aiW);
        const cue = dir==='up'?'<span class="fl-dir up">\u25B2 heavier</span>':dir==='down'?'<span class="fl-dir dn">\u25BC lighter</span>':'';
        return `<div class="fillrow"><button class="filllast" onclick="fillFromLast('${ex.id}',${i})">\u21A9 use last: ${fmtW(prevS.w,ex.unit)}${prevS.r?` \u00d7 ${prevS.r}`:''}</button>${cue}</div>`;
      })()}${(()=>{
        // Optional per-set effort capture (reps in reserve). Appears only once a
        // WORKING set is logged — RIR is a post-set judgment, and warm-ups/myo
        // clusters don't need it. To-failure sets are 0 RIR by definition, so we
        // show that rather than a picker. Kept off the grid on its own slim line
        // so it never crowds the weight/reps columns. This grounds the plateau
        // engine's effort branch: a lift stalling at 0 RIR is fatigue; one stalling
        // with reps left in the tank is an effort/technique problem.
        if(!l.logged || type==='WU' || type==='M') return '';
        if(type==='F') return `<div class="rirrow"><span class="rr-l">Effort</span><span class="rr-fixed">0 RIR \u00b7 to failure</span></div>`;
        const pills = [0,1,2,3,4].map(v=>`<button class="rr-p ${l.rir===v?'on':''}" onclick="setRIR('${ex.id}',${i},${v})">${v===4?'4+':v}</button>`).join('');
        return `<div class="rirrow"><span class="rr-l">${gt('rir','Reps left')}</span>${pills}<span class="rr-u">RIR</span></div>`;
      })()}`;
    }
    /* Once every set is in, the card folds to one line. Mid-session the screen
       shows what is left to do, not what is already done. Tap to reopen. */
    const complete = n>0 && doneSets >= n;
    if(complete && !exExpanded[ex.id]){
      return `<div class="ex-done" onclick="expandExercise('${ex.id}')">
        <span class="exd-check">✓</span>
        <div class="exd-body">
          <div class="exd-name">${ex.name}</div>
          <div class="exd-meta">${doneSets} set${doneSets===1?'':'s'}${topSet? ` · top ${fmtW(topSet.w,ex.unit)} × ${topSet.r}`:''}</div>
        </div>
        <span class="exd-open">Edit</span>
      </div>`;
    }
    return `<div class="ex-card ${complete?'is-open':''}">
      ${complete? `<div class="ex-collapse" onclick="collapseExercise('${ex.id}')">Done — collapse ▴</div>`:''}
      <div class="ex-head">
        <div class="ex-headwrap">${muscleTag(ex.muscle)}<div class="ex-name"${patternOf(ex.name)?` onclick="openExDetail('${esc(ex.name)}')" style="cursor:pointer"`:''}>${ex.name}</div>${patternOf(ex.name)?`<button class="ex-view" onclick="openExDetail('${esc(ex.name)}')">How to perform \u203a</button>`:''}${ex.eq? `<div class="ex-eq">${ex.eq}</div>`:''}</div>
        <div class="actions">
          <span class="unitchip" onclick="${structureLocked?'':'toggleUnit('+ei+')'}">${ex.unit.toUpperCase()}</span>
          <div class="iconbtn sm" onclick="openModal('note','${noteKey}')" title="Note">✎</div>
          <div class="iconbtn sm" onclick="startSwap(${ei})" title="Swap exercise">⇄</div>
          ${structureLocked?'':`<div class="iconbtn sm danger" onclick="removeExerciseToday(${ei})" title="Remove exercise">✕</div>`}
        </div>
      </div>
      <div class="suggest-chip" onclick="cycleSuggestion('${ex.id}',${state.dayIdx})"><span class="r">◆ ${ai.text}</span><span class="cyc">↻</span></div>
      ${(()=>{
        // ONE reference line instead of three stacked strips. The coach chip
        // above is the answer; rep range + what you did last time are the
        // evidence for it, so they sit under it in dim text on a single line.
        // Everything deeper (why, all-time best, e1RM) lives behind "Details"
        // so a first-time user sees an answer, not a wall of numbers.
        const ls = lastSessionSummary(ex.name, ex.unit);
        const tr = ls? e1rmTrend(ex.name) : null;
        const arw = tr==='up'?'<span class="tr up">↑</span>':tr==='down'?'<span class="tr dn">↓</span>':tr==='flat'?'<span class="tr fl">→</span>':'';
        const bits = [`<span class="m-rng">${rangeLabel(ex.muscle)}</span>`];
        if(ls) bits.push(`<span class="m-last">Last <b>${ls.wLabel}</b> \u00d7 ${ls.reps}${arw}</span>`);
        const hasDeep = !!(ai.why || (rec && rec.best) || (ls && ls.e1rm));
        return `<div class="exmeta">${bits.join('<span class="m-sep">\u00b7</span>')}${
          hasDeep? `<button class="m-more ${exWhyOpen[ex.id]?'open':''}" onclick="toggleExWhy('${ex.id}')" aria-expanded="${!!exWhyOpen[ex.id]}">Details<span class="vr-chev">${exWhyOpen[ex.id]?'\u25be':'\u25b8'}</span></button>`:''
        }</div>${
          (hasDeep && exWhyOpen[ex.id])? `<div class="aiwhy">${
            [ ai.why? ai.why : '',
              (rec && rec.best)? `<div class="ad-row"><span>Best</span><b>${baseline}</b></div>`:'',
              (ls && ls.e1rm)? `<div class="ad-row"><span>${gt('e1rm','e1RM')}</span><b>${ls.e1rm.toFixed(1)}${ex.unit}</b></div>`:''
            ].filter(Boolean).join('')
          }</div>`:''
        }`;
      })()}
      ${(()=>{ const pm=plateMath(ai.w, ex.unit, ex.name); return pm? `<div class="platemath">${pm}</div>`:''; })()}
      ${ai.plateau? `<div class="plateau">
        <div class="pl-head">${ai.diag? ai.diag.headline : '\u26A0 Stalled 3 sessions \u2014 pick a fix'}</div>
        <div class="pl-opts">
          ${(ai.diag? ai.diag.moves : ['A','B','C']).map(id=>`<button class="pl-opt ${ai.act===id?'on':''}" onclick="setPlateau('${ex.id}','${id}')">${(ai.diag && ai.diag.recommend===id)?'<span class="pl-rec">Coach pick</span>':''}${PLATEAU_MOVES[id]||id}</button>`).join('')}
        </div>
        ${ai.act==='V+'? `<button class="pl-apply" onclick="addSet('${ex.id}')">\uFF0B Add a set now</button>`:''}
        ${ai.act==='V-'&&n>1? `<button class="pl-apply" onclick="removeSet('${ex.id}')">\u2212 Remove a set now</button>`:''}
      </div>`:''}
      ${warmupBlockHtml(ex, ai)}
      ${note? `<div class="notepill"><span class="i">✎</span><span>${note}</span></div>`:''}
      ${emptyFillable>0 ? `<div class="fillbar"><button class="fillsug" onclick="fillAll('${ex.id}',${n})"><span class="fa-i">\u2913</span>Fill ${emptyFillable===n? 'all' : emptyFillable} set${emptyFillable===1?'':'s'}</button></div>` : ''}
      <div class="setgrid-head"><span>Set</span><span>Weight</span><span>Reps</span><span>Log</span></div>
      ${rows}
      <div class="setactions">
        <button class="addset" onclick="addSet('${ex.id}')">+ Add set</button>
        ${n>1? `<button class="addset rem" onclick="removeSet('${ex.id}')" title="Remove the last set">\u2212 Remove set</button>`:''}
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <div class="pagehead">
      <div class="eyebrow">${mesoStart()? `Week ${state.week} of ${mesoWeeks()}` : `Week ${state.week}`}${state.week===mesoWeeks()?` · ${gt('deload','Deload')}`:''} · ${day.name}</div>
      <h1>${plan.name}</h1>

    </div>
    ${dayExerciseWarning(state.dayIdx)}
    ${toggle}
    ${(()=>{
      const realWeek = mesoWeekNow();
      const tpi = todayPlanIdx();
      const onToday = (state.week===realWeek) && (tpi!=null ? state.dayIdx===tpi : true);
      const restToday = tpi===null;
      if(!mesoStart()){
        return `<div class="datebar setup" onclick="openModal('meso')">
          <span class="dl">\u{1F4C5} ${todayLabel()}</span>
          <span class="dr">Set mesocycle dates \u203A</span></div>`;
      }
      if(mesoFinished()){
        return `<div class="datebar done" onclick="openModal('meso')">
          <span class="dl">\u{1F3C1} Mesocycle complete \u2014 ended ${fmtShort(mesoEnd())}</span>
          <span class="dr">Start next \u203A</span></div>`;
      }
      return `<div class="datebar ${onToday?'':'off'}">
        <span class="dl">\u{1F4C5} ${todayLabel()}${restToday? ' \u00B7 rest day':''}</span>
        ${onToday
          ? `<span class="dr ok">Day ${mesoDayNum()} \u00B7 ${mesoDaysLeft()} days left</span>`
          : `<span class="dr jump" onclick="jumpToToday()">\u21A9 Back to today</span>`}
      </div>`;
    })()}
    <button class="weekbtn" onclick="state.weekOpen=!state.weekOpen; render();">
      <span>📅 Full week plan — ${plan.days.length} training days + ${7-plan.days.length} rest</span><span>${state.weekOpen?'▾':'›'}</span>
    </button>

/* The most recent weight/reps actually LOGGED for a lift, from the records
   engine (true timeline). Used so prefills and placeholders track what you
   really lifted rather than a template's frozen starting number. */
function lastLoggedWeight(exName){
  const rec = allRecords()[exName];
  if(!rec || !rec.sessions || !rec.sessions.length) return { w:null, r:null };
  for(let i=rec.sessions.length-1;i>=0;i--){
    const work=(rec.sessions[i].sets||[]).filter(s=>s && s[0]!=null && s[2]!=='WU' && s[2]!=='BO');
    if(work.length){ return { w:work[0][0], r:work[0][1] }; }
  }
  return { w:null, r:null };
}

/* Lightweight rest timer: starts counting up when you log a working set, shows
   in a small floating pill, and can be tapped to dismiss. Purely a convenience —
   nothing depends on it, and it never blocks logging. */
var _restStart=null, _restRAF=null, _restAutoStop=null;
/* Rest-timer colour thresholds (seconds). Grounded in the inter-set rest
   literature for hypertrophy — see the tick() note. Tweak here, not in tick(). */
const REST_PHASES = { ok:60, ready:120, long:210 };
function startRestTimer(){
  _restStart = Date.now();
  if(_restRAF) cancelAnimationFrame(_restRAF);
  if(_restAutoStop) clearTimeout(_restAutoStop);
  const tick=()=>{
    const el=document.getElementById('restpill');
    if(!el || _restStart==null) return;
    const secs=Math.floor((Date.now()-_restStart)/1000);
    const m=Math.floor(secs/60), s=secs%60;
    el.querySelector('.rt-time').textContent = (m>0? m+':' : '')+String(s).padStart(m>0?2:1,'0')+(m>0?'':'s');
    // Evidence-based recovery phases (Singer/Schoenfeld 2024 Bayesian meta-analysis:
    // benefit to rest >60s, ~1-2 min the solid hypertrophy guideline, little to
    // gain past ~2 min). Colour tells you when the NEXT set will be productive:
    //   < 60s   red   "keep resting" — force not recovered, next set quality drops
    //   60-120s amber "almost"       — okay for isolation, wait for heavy compounds
    //   >=120s  green "ready"        — recovered, go
    // (>3:30 dims to a neutral "cooling off" so a forgotten timer isn't a false green.)
    const phase = secs>=REST_PHASES.long ? 'cool'
                : secs>=REST_PHASES.ready ? 'ready'
                : secs>=REST_PHASES.ok ? 'ok' : 'hold';
    if(el._phase!==phase){
      el._phase = phase;
      el.classList.remove('rp-hold','rp-ok','rp-ready','rp-cool');
      el.classList.add('rp-'+phase);
      const lbl = el.querySelector('.rt-lbl');
      if(lbl) lbl.textContent = phase==='hold'?'Rest' : phase==='ok'?'Almost' : phase==='ready'?'Ready' : 'Rested';
    }
    _restRAF=requestAnimationFrame(tick);
  };
  if(!document.getElementById('restpill')){
    const d=document.createElement('div');
    d.id='restpill'; d.className='restpill';
    d.innerHTML='<span class="rt-lbl">Rest</span><span class="rt-time">0s</span><span class="rt-x">\u00d7</span>';
    d.onclick=stopRestTimer;
    document.body.appendChild(d);
  }
  const _pill=document.getElementById('restpill');
  if(_pill){ _pill._phase=null; _pill.classList.remove('rp-hold','rp-ok','rp-ready','rp-cool'); }
  document.getElementById('restpill').style.display='flex';
  _restRAF=requestAnimationFrame(tick);
  // Auto-dismiss after 5 minutes so it never runs forever if you forget it —
  // by then the set is long done and a stale counter is just noise.
  _restAutoStop = setTimeout(stopRestTimer, 5*60*1000);
}
function stopRestTimer(){
  _restStart=null;
  if(_restRAF){ cancelAnimationFrame(_restRAF); _restRAF=null; }
  if(_restAutoStop){ clearTimeout(_restAutoStop); _restAutoStop=null; }
  const el=document.getElementById('restpill'); if(el) el.style.display='none';
}
function updSet(exId,i,f,val){

function stepSet(exId,i,f,dir){
  const { log, ex } = ensureLog(exId,i);
  const prev = lastWeekLog(state.dayIdx, exId, i);
  const ai = aiTarget(ex, state.dayIdx);
  const _ll = (!prev && (ai.w==null)) ? lastLoggedWeight(ex.name) : {w:null,r:null};
  const phW = prev? prev.w : (ai.w ?? _ll.w ?? ex.sets[Math.min(i,ex.sets.length-1)].w) ?? 0;
  const phR = parseReps(prev? prev.r : (ai.reps? ai.reps[Math.min(i,ai.reps.length-1)] : (_ll.r ?? ex.sets[Math.min(i,ex.sets.length-1)].r))) ?? 0;
  const base = f==='w' ? (log.w ?? phW) : (parseReps(log.r) ?? phR);
  const inc = f==='w' ? (ex.unit==='lbs'? 5 : 2.5) : 1;
  const v = Math.max(0, +(base + dir*inc).toFixed(1));

function dayExerciseCount(di){

function setRIR(exId, i, val){

/* Recent working-set effort for a lift, for the plateau engine's effort branch.
   Reads the name-based timeline (so it follows the exercise, not the slot) and
   treats to-failure sets as 0 RIR even when not explicitly rated. Returns null
   when there isn't enough rated data to judge. */
function recentWorkingRIR(exName, nSessions){
  const rec = allRecords()[exName];
  if(!rec || !rec.sessions || !rec.sessions.length) return null;
  const vals = [];
  rec.sessions.slice(-(nSessions||3)).forEach(s=>{
    (s.sets||[]).forEach(set=>{
      if(!set) return;
      const t = set[2] || '';
      if(t==='WU' || t==='M') return;                 // not working-set effort
      const eff = (t==='F') ? 0 : (set[3]==null ? null : set[3]);
      if(eff!=null) vals.push(eff);
    });
  });
  if(!vals.length) return null;
  const avg = vals.reduce((a,b)=>a+b,0)/vals.length;
  return { avg:+avg.toFixed(2), min:Math.min(...vals), count:vals.length };
}

/* Remove the last set of an exercise today (mirrors addSet). Only trims sets
   that were ADDED on top of the plan, and clears any log on the removed row so
   a deleted set can't leave an orphaned entry behind. */
function removeSet(exId){
  const k = xkey(state.week,state.dayIdx,exId);
  const extra = state.extraSets[k]||0;
  const { plan } = getActivePlan();
  const ex = plan.days[state.dayIdx].exercises.find(e=>e.id===exId);
  if(!ex) return;
  const total = ex.sets.length + extra;
  if(total<=1) return;                 // never remove the last remaining set
  const lastIdx = total-1;
  delete state.logs[`${state.active.id}|w${state.week}|d${state.dayIdx}|${exId}|${lastIdx}`];
  state.extraSets[k] = extra - 1;      // may go negative to trim into plan sets

}
/* One-tap fill: drop last session's weight/reps for THIS set position into the
   input, ready to log. Faster than typing, but deliberate (you tap it) rather
   than silently pre-filled — so a stale number can never be logged unnoticed. */
function fillFromLast(exId,i){
  const { plan } = getActivePlan();
  const ex = plan.days[state.dayIdx].exercises.find(e=>e.id===exId);
  if(!ex) return;
  const prev = lastWeekLog(state.dayIdx, exId, i);
  const src = prev || (()=>{ const ll=lastLoggedWeight(ex.name); return ll.w!=null? {w:ll.w,r:ll.r} : null; })();
  if(!src) return;
  const { log } = ensureLog(exId,i);
  if(log.w==null) log.w = src.w;
  if(log.r==null) log.r = src.r;
  saveState(); render();
}
/* One-tap fill-all: drop the coach's suggested weight/reps into EVERY empty set
   of this exercise at once. Fills exactly the greyed hint numbers already shown
   per row (engine target -> last week's set -> last logged -> template), so what
   lands is never a surprise. Only fills EMPTY fields on UNLOGGED sets: it never
   overwrites a weight/rep you typed and never touches a set you already ticked,
   and it marks nothing logged (you still tick each set deliberately). This is the
   whole-exercise companion to the per-set "use last" button, and it kills the
   biggest manual-input chore: retyping the same load down a column of identical
   sets. `n` is the rendered set count, passed in so we fill exactly the rows on
   screen. */
function fillAll(exId,n){
  const { plan } = getActivePlan();
  const ex = plan.days[state.dayIdx].exercises.find(e=>e.id===exId);
  if(!ex) return;
  const ai = aiTarget(ex, state.dayIdx);
  let changed=false;
  for(let i=0;i<n;i++){
    const { log } = ensureLog(exId,i);
    if(log.logged) continue;                 // never touch a set already ticked
    const prev = lastWeekLog(state.dayIdx, exId, i);
    // Same resolution the set row uses for its placeholder, so "Fill all" writes
    // exactly the grey hint the lifter already sees for each set.
    const aiW = (ai && ai.w != null) ? ai.w : null;
    const aiR = (ai && ai.reps && ai.reps[Math.min(i, ai.reps.length-1)] != null) ? ai.reps[Math.min(i, ai.reps.length-1)] : null;
    const _ll = (aiW==null && !prev) ? lastLoggedWeight(ex.name) : {w:null,r:null};
    const phW = aiW != null ? aiW : (prev? prev.w : (_ll.w ?? ex.sets[Math.min(i,ex.sets.length-1)].w));
    const phR = aiR != null ? aiR : (prev? prev.r : (_ll.r ?? ex.sets[Math.min(i,ex.sets.length-1)].r));
    if(log.w==null && phW!=null){ log.w = phW; changed=true; }
    if(log.r==null && phR!=null){ log.r = phR; changed=true; }
  }
  if(changed){ saveState(); render(); }
}
/* Direction this set's suggested weight points versus what you last did here:

function setDirection(exName, di, exId, i, aiW){
  if(aiW==null) return null;
  const prev = lastWeekLog(di, exId, i);

  if(base==null) return null;
  if(aiW > base + 0.01) return 'up';
  if(aiW < base - 0.01) return 'down';
  return 'hold';
}

function remapPlanKeys(obj, oldId, newId){ const out={}; for(const k in obj){ out[ k.indexOf(oldId+'|')===0 ? newId + k.slice(oldId.length) : k ] = obj[k]; } return out; }

function forkActivePlan(){

  state.sugOverride = remapPlanKeys(state.sugOverride, oldId, copy.id);
  state.active = { kind:'custom', id:copy.id };
  saveState();
  return copy;
}

function perfString(ex, di){
  const nSets = ex.sets.length + (state.extraSets[xkey(state.week,di,ex.id)]||0) + 2;
  const parts=[]; const ws=new Set();
  for(let i=0;i<nSets;i++){
    const l = getLog(state.week,di,ex.id,i);
    if(!(l&&l.logged)) continue;
    ws.add(l.w);
    parts.push({w:l.w, r:l.r, t:l.type||''});
  }
  if(!parts.length) return null;
  if(ws.size===1){
    const w = parts[0].w;
    return `${fmtW(w,ex.unit)} × ` + parts.map(p=> (p.t==='WU'?'WU ':'')+p.r+(p.t==='M'?' myo':'')).join(', ');
  }
  return parts.map(p=> `${p.w??'—'}×${p.r}${p.t==='WU'?' WU':''}${p.t==='M'?' myo':''}`).join(', ') + ' ' + ex.unit;
}

    const min = Math.min(...all)-0.3, max = Math.max(...all)+0.3;

    chart = `<svg viewBox="0 0 ${W} ${H}" width="100%" height="150">

/* ============ HEALTH (markers + micronutrients) ============ */
function todayKey(){ const d=new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }
function readingsFor(name){ return state.markers.filter(m=>m.name===name).sort((a,b)=> a.date<b.date? -1:1); }
function latestFor(name){ const r=readingsFor(name); return r.length? r[r.length-1] : null; }
function trackedMarkers(){ return [...new Set(state.markers.map(m=>m.name))]; }
function nutrientTotals(){
  const totals={};
  const taken = state.suppLog[todayKey()] || [];
  taken.forEach(id=>{
    const sup = state.supplements.find(x=>x.id===id);
    if(!sup) return;
    (sup.items||[]).forEach(it=>{ totals[it.nutrient] = (totals[it.nutrient]||0) + (+it.amount||0); });
  });
  return totals;
}
function toggleSupp(id){
  const k=todayKey();
  if(!state.suppLog[k]) state.suppLog[k]=[];
  const i=state.suppLog[k].indexOf(id);
  if(i>=0) state.suppLog[k].splice(i,1); else state.suppLog[k].push(id);
  render();
}
function deleteSupp(id){
  if(!confirm('Remove this supplement from your stack?')) return;
  state.supplements = state.supplements.filter(x=>x.id!==id);
  Object.keys(state.suppLog).forEach(k=>{ state.suppLog[k]=state.suppLog[k].filter(x=>x!==id); });
  render();
}
function deleteMarker(idx){
  if(!confirm('Delete this reading?')) return;
  state.markers.splice(idx,1); render();
}

    </div>

    <div class="targetdiv">Blood markers</div>
    ${tracked.length? markerCards : `
      <div class="emptystate" style="padding:26px 18px;">
        <div class="big">🩸</div>
        <div class="t">No results logged yet.<br>Add a value from a blood test — haemoglobin, ferritin, vitamin D, B12 and more — and the app tracks it against typical ranges over time.</div>
      </div>`}
    <button class="addmeal" onclick="openModal('marker')">+ Log a blood result</button>

    <div class="targetdiv" style="margin-top:22px;">Today's nutrient intake</div>
    ${nutrientRows || `<div class="lockednote">Add what you take below and your daily totals appear here, checked against the RDA and the safe upper limit.</div>`}

    <div class="targetdiv" style="margin-top:22px;">My supplement stack · ${takenToday.length}/${state.supplements.length} taken today</div>
    ${suppRows || `<div class="lockednote">Nothing in your stack yet. Add a supplement or fortified food so its nutrients count toward today's totals.</div>`}
    <button class="addmeal" onclick="openModal('supplement')">+ Add to my stack</button>

    <div class="medcaution">
      <div class="mc-t">How to use this well</div>
      This tracks numbers you or your doctor already measured — it does not diagnose anything, and no app can tell you <i>why</i> a marker is off.
      A low result usually has several possible causes, and treating the wrong one wastes months. Take these trends to a clinician,
      get the cause identified, and let them set any dose. Upper limits shown here apply to your <b>total</b> daily intake from food,
      fortified products and supplements combined.
    </div>
  `;
}
function linkedNutrientsFromMarkers(){
  const sex = (state.stats && state.stats.sex) || 'male';
  const out = [];
  trackedMarkers().forEach(name=>{
    const last = latestFor(name); if(!last) return;
    const st = markerStatus(name, last.value, sex);
    if(st && st!=='ok'){
      const M = MARKERS[name];
      (M && M.linked || []).forEach(n=>{ if(!out.includes(n)) out.push(n); });
    }
  });
  return out;
}

/* ============ MACROS ============ */
function dayMeals(){ return state.macroWeek.days[state.macroDay]; }

/* ============ SUGGESTION ENGINE ============
   No model, no server — this reads what's left of today's targets and searches
   the meals and foods you've already logged for the closest fit. It improves as
   the library grows, because there's simply more to match against and repeat
   meals carry a higher usage weight.

   Scoring is a weighted distance in kcal-space between what's remaining and what
   a candidate provides. Protein carries the heaviest weight (it's the macro that
   actually protects muscle in a deficit) and going OVER remaining calories is
   penalised roughly twice as hard as falling short, because overshooting the
   target is worse than leaving a small gap.                                     */
function remainingMacros(){
  const d = dayMeals(), T = DT(d.type), tot = dayTotals(d);
  return {
    kcal: Math.round(T.kcal - tot.kcal),
    p: +(T.p - tot.p).toFixed(1),
    c: +(T.c - tot.c).toFixed(1),
    f: +(T.f - tot.f).toFixed(1)
  };
}
/* A suggestion should fill ONE meal, not the entire rest of the day. This works
   out a sensible size for the next meal by splitting what's left across the
   meals you probably still have, then clamping to a realistic plate. */
function mealSizeTarget(){
  const rem = remainingMacros();
  const logged = dayMeals().meals.length;
  const mealsLeft = Math.max(1, Math.min(4, (logged>=4 ? 1 : 4 - logged)));
  let k = rem.kcal / mealsLeft;
  k = Math.max(180, Math.min(950, k));

  return { kcal:Math.round(k), p:+(rem.p*ratio).toFixed(1), c:+(rem.c*ratio).toFixed(1),

function fitCost(cand, rem){

    + Math.abs(rem.p - cand.p) * 4 * 1.6      // protein gap matters most
    + Math.abs(rem.c - cand.c) * 4 * 0.45
    + Math.abs(rem.f - cand.f) * 9 * 0.45

/* Solve how much of a saved food best fills the gap. Protein-dense foods are
   solved against the protein gap, everything else against calories — then
   clamped so it can never blow past the remaining calories. */
function solvePortion(food, rem){
  if(!food.kcal || food.kcal<=0) return null;
  const pShare = (food.p*4) / food.kcal;
  const byKcal = (rem.kcal / food.kcal) * 100;
  let amt = (pShare > 0.35 && rem.p > 6) ? (rem.p / Math.max(0.1,food.p)) * 100 : byKcal;
  amt = Math.min(amt, byKcal);
  if(!isFinite(amt) || amt <= 0) return null;
  amt = Math.round(amt/5)*5;
  if(amt < 15 || amt > 600) return null;
  const k = food.kcal*amt/100;
  if(k < 40) return null;
  return { amount:amt, kcal:k, p:food.p*amt/100, c:food.c*amt/100, f:food.f*amt/100 };
}

/* Macros for a given amount of a food. `amt` is grams for per:'g'/'ml' foods and
   a unit COUNT for per:'u' foods. Returns rounded {kcal,p,c,f} + a display label. */
function foodMacros(item, amt){
  const factor = item.per==='u' ? amt : amt/100;
  const m = { kcal: item.k*factor, p: item.p*factor, c: item.c*factor, f: item.f*factor };
  const label = item.per==='u'
    ? `${+amt.toFixed(amt<10?0:0)}\u00d7 ${item.n}`
    : `${Math.round(amt)} ${item.per==='ml'?'ml':'g'} ${item.n}`;
  return { kcal:Math.round(m.kcal), p:+m.p.toFixed(1), c:+m.c.toFixed(1), f:+m.f.toFixed(1), label, amount:amt };
}
/* Realistic portion bounds so a suggestion never becomes "115 g of protein
   powder". Grams for weighables, unit COUNT for countables. */
function foodPortionBounds(item){
  if(item.per==='u'){
    if(/egg white/i.test(item.n)) return { min:2, max:8, step:1 };
    if(/egg/i.test(item.n)) return { min:1, max:4, step:1 };
    if(/whey|protein/i.test(item.n)) return { min:1, max:2, step:1 };
    if(/bread|tortilla|rice cake|date/i.test(item.n)) return { min:1, max:4, step:1 };
    return { min:1, max:2, step:1 };
  }
  switch(item.cat){
    case 'protein': return { min:80, max:250, step:10 };
    case 'carb':    return { min:40, max:300, step:10 };
    case 'veg':     return { min:80, max:200, step:10 };
    case 'fruit':   return { min:80, max:200, step:10 };
    case 'dairy':   return { min:100, max:300, step:10 };
    case 'fat':     return { min:10, max:60,  step:2  };
    default:        return { min:30, max:250, step:10 };
  }
}
/* Pick an amount of `item` to deliver roughly `wantP` protein OR `wantKcal`
   energy, clamped to sane bounds and snapped to a tidy step. */
function portionFor(item, wantP, wantKcal){
  const b = foodPortionBounds(item);
  let amt;
  if(wantP!=null && (item.p>0)){
    const perUnitP = item.per==='u' ? item.p : item.p/100;   // p per unit or per gram
    amt = wantP / Math.max(0.01, perUnitP);
  } else if(wantKcal!=null && item.k>0){
    const perUnitK = item.per==='u' ? item.k : item.k/100;
    amt = wantKcal / Math.max(0.1, perUnitK);
  } else {
    amt = item.per==='u' ? 1 : item.sv;
  }
  amt = Math.max(b.min, Math.min(b.max, amt));
  amt = Math.round(amt/b.step)*b.step;
  return Math.max(b.min, amt);
}
function foodByName(name){
  const q = (name||'').trim().toLowerCase();
  if(!q) return null;
  for(const it of FOODS){ if(it.n.toLowerCase()===q) return it; }          // exact name
  for(const it of FOODS){ if((it.aka||[]).some(a=>a===q)) return it; }      // exact alias
  // otherwise score by shared words so "whole wheat bread" beats "white bread"
  const qw = new Set(q.split(/\s+/).filter(Boolean));
  let best=null, bestScore=0;
  for(const it of FOODS){
    const nl = it.n.toLowerCase();
    const nw = nl.replace(/[()\/,\-]/g,' ').split(/\s+/).filter(Boolean);
    let score = 0;
    if(nl.includes(q) || q.includes(nl)) score += 3;
    nw.forEach(w=>{ if(qw.has(w)) score += 2; });
    (it.aka||[]).forEach(a=>{ if(q.includes(a)) score += 1; if(qw.has(a)) score += 1; });
    if(score > bestScore){ bestScore = score; best = it; }
  }
  return bestScore>0 ? best : null;
}
/* Whole-food meal ideas that actually hit the day's remaining macros, at sane
   portions. Builds protein+carb (+veg) combos and single high-protein hits,
   preferring foods the user already logs. Returned as suggestion cards to sit
   ALONGSIDE saved meals. */
function wholeFoodIdeas(rem, tgt){
  const out = [];
  const logged = new Set((state.foodLib||[]).map(f=>(f.name||'').toLowerCase()));
  const isLogged = it => logged.has(it.n.toLowerCase()) || (it.aka||[]).some(a=>logged.has(a));
  const proteins = FOODS.filter(f=>f.cat==='protein' || (f.cat==='dairy'&&f.p>=8));
  const carbs    = FOODS.filter(f=>f.cat==='carb');
  const wantP = Math.max(15, Math.min(tgt.p, rem.p));
  const wantK = Math.min(tgt.kcal, rem.kcal);
  // rank so familiar + high-protein-density surface first, with light variety
  const pRank = proteins.map(pf=>({pf, s:(isLogged(pf)?-100:0) + (pf.f>15?8:0)}))
    .sort((a,b)=>a.s-b.s).map(x=>x.pf);
  const cRank = carbs.map(cf=>({cf, s:(isLogged(cf)?-100:0)})).sort((a,b)=>a.s-b.s).map(x=>x.cf);
  const combos = [];
  for(const pf of pRank.slice(0,6)){
    const pa = portionFor(pf, wantP, null);
    const pm = foodMacros(pf, pa);
    if(pm.kcal > wantK*0.95) continue;
    for(const cf of cRank.slice(0,6)){
      const remK = wantK - pm.kcal;
      if(remK < 60) continue;
      const ca = portionFor(cf, null, remK);
      const cm = foodMacros(cf, ca);
      const tot = { kcal:pm.kcal+cm.kcal, p:+(pm.p+cm.p).toFixed(1), c:+(pm.c+cm.c).toFixed(1), f:+(pm.f+cm.f).toFixed(1) };
      if(tot.kcal > rem.kcal*1.05) continue;
      combos.push({ kind:'idea', title:`${pm.label} + ${cm.label}`,
        sub: (isLogged(pf)||isLogged(cf))? 'Whole foods \u00b7 you log these' : 'Whole-food idea',
        kcal:tot.kcal, p:tot.p, c:tot.c, f:tot.f,
        cost: fitCost(tot, tgt) + (isLogged(pf)||isLogged(cf)?10:40),
        idea:[{item:pf,amount:pa},{item:cf,amount:ca}] });
    }
  }
  combos.sort((a,b)=>a.cost-b.cost);
  const seenP = new Set();
  for(const c of combos){ const key=c.idea[0].item.n; if(seenP.has(key)) continue; seenP.add(key); out.push(c); if(out.length>=4) break; }
  // one clean single-protein hit for a big protein gap
  if(rem.p >= 25){
    const pf = pRank.find(p=>p.cat==='protein') || pRank[0];
    if(pf){ const pa=portionFor(pf, Math.min(rem.p,40), null); const pm=foodMacros(pf,pa);
      out.push({ kind:'idea', title:pm.label, sub:'Quick protein', kcal:pm.kcal, p:pm.p, c:pm.c, f:pm.f,
        cost: fitCost(pm,tgt)+70, idea:[{item:pf,amount:pa}] }); }
  }
  return out;
}
function suggestMeals(){
  const rem = remainingMacros();
  if(rem.kcal < 90) return { rem, tgt:null, list:[], reason: rem.kcal<=0? 'over' : 'tiny' };
  const tgt = mealSizeTarget();          // score against ONE meal's worth
  const out = [];
  const CAPG = 400;                      // no single-food portion beyond this

  // 1 — whole meals you've eaten before
  (state.mealLib||[]).forEach(m=>{
    if(m.kcal > Math.min(rem.kcal, tgt.kcal*1.6)) return;
    const cost = fitCost(m, tgt) - Math.min(150, (m.count||1)*45);   // habit bonus
    out.push({ kind:'meal', title:m.name, sub:(m.foods||[]).map(f=>f.n).slice(0,3).join(' \u00B7 ') || 'Saved meal',
      kcal:Math.round(m.kcal), p:m.p, c:m.c, f:m.f, cost, count:m.count||1, src:m });
  });

  // 2 — a single saved food, portioned to fit this meal
  (state.foodLib||[]).forEach(f=>{
    const sv = solvePortion(f, tgt);
    if(!sv || sv.amount > CAPG) return;
    // Sanity: a protein-dense food (powder, shake) must not be portioned to an
    // absurd amount just to fill a protein gap — nobody eats 115 g of powder.
    const dense = f.kcal>0 && (f.p*4)/f.kcal > 0.55;
    if(dense && sv.amount > 60) return;
    out.push({ kind:'food', title:`${sv.amount} g ${f.name}`, sub:'Portioned to fit',
      kcal:Math.round(sv.kcal), p:+sv.p.toFixed(1), c:+sv.c.toFixed(1), f:+sv.f.toFixed(1),
      cost: fitCost(sv, tgt) + 20, food:f, amount:sv.amount });
  });

  // 3 — protein source + carb source, both portioned to this meal
  const lib = state.foodLib||[];
  const proteins = lib.filter(f=>f.kcal>0 && (f.p*4)/f.kcal > 0.35).slice(0,8);
  const carbs    = lib.filter(f=>f.kcal>0 && (f.c*4)/f.kcal > 0.5).slice(0,8);
  proteins.forEach(pf=>{
    let pa = Math.round(((tgt.p*0.7) / Math.max(0.1, pf.p)) * 100 / 5)*5;
    if(pa < 20 || pa > CAPG) return;
    const pk = pf.kcal*pa/100;
    if(pk > tgt.kcal*0.85) return;
    carbs.forEach(cf=>{
      if(cf.name===pf.name) return;
      let ca = Math.round(((tgt.kcal - pk) / cf.kcal) * 100 / 5)*5;
      if(ca < 20 || ca > CAPG) return;
      const cand = {
        kcal: pk + cf.kcal*ca/100,
        p: pf.p*pa/100 + cf.p*ca/100,
        c: pf.c*pa/100 + cf.c*ca/100,
        f: pf.f*pa/100 + cf.f*ca/100
      };
      if(cand.kcal > rem.kcal) return;
      out.push({ kind:'combo', title:`${pa} g ${pf.name} + ${ca} g ${cf.name}`,
        sub:'Two foods you log often',
        kcal:Math.round(cand.kcal), p:+cand.p.toFixed(1), c:+cand.c.toFixed(1), f:+cand.f.toFixed(1),
        cost: fitCost(cand, tgt) + 55, combo:[{food:pf,amount:pa},{food:cf,amount:ca}] });
    });
  });

  // 4 — our own whole-food ideas from the directory (basic foods: chicken, rice,
  // eggs, oats, PB...), added ON TOP of anything derived from logged foods.
  wholeFoodIdeas(rem, tgt).forEach(o=>out.push(o));

  out.sort((a,b)=>a.cost-b.cost);
  const picked=[], seen={meal:0,food:0,combo:0,idea:0}, names=new Set();
  // Guarantee a couple of our whole-food ideas surface, then fill by best fit.
  for(const o of out){ if(o.kind!=='idea') continue; if(seen.idea>=2) break; if(names.has(o.title)) continue; names.add(o.title); seen.idea++; picked.push(o); }
  for(const o of out){
    if(picked.length>=5) break;
    if(picked.indexOf(o)>=0) continue;
    if(seen[o.kind]>=2) continue;
    if(names.has(o.title)) continue;
    names.add(o.title); seen[o.kind]++; picked.push(o);
  }
  picked.sort((a,b)=>a.cost-b.cost);
  picked.forEach(o=>{ o.match = costToMatch(o.cost, tgt); });
  return { rem, tgt, list:picked, reason:'ok' };
}
/* Tapping a suggestion opens it as a normal editable meal draft. */
function useSuggestion(kind, idx){
  const S = suggestMeals();
  const s = S.list[idx];
  if(!s) return;
  mealEditIndex = null;
  if(s.kind==='meal'){
    const src = s.src;
    mealDraft = { name: src.name, time:'',
      foods: (src.foodsFull && src.foodsFull.length)
        ? src.foodsFull.map(x=>({...x}))
        : [{ name:src.name, basis:'direct', amount:'', kcal:String(Math.round(src.kcal)), p:String(src.p), c:String(src.c), f:String(src.f) }] };
  } else if(s.kind==='food'){
    mealDraft = { name: s.food.name, time:'',
      foods:[{ name:s.food.name, basis:'per100', amount:String(s.amount),
        kcal:String(s.food.kcal), p:String(s.food.p), c:String(s.food.c), f:String(s.food.f) }] };
  } else if(s.kind==='idea'){
    // Whole-food idea → editable draft. Each food carries its computed totals so
    // the amounts stay exactly as suggested (sane portions), still fully editable.
    mealDraft = { name: s.idea.length>1? 'Meal' : s.idea[0].item.n, time:'',
      foods: s.idea.map(x=>{ const m=foodMacros(x.item, x.amount);
        return { name:m.label, basis:'direct', amount:'', kcal:String(m.kcal), p:String(m.p), c:String(m.c), f:String(m.f) }; }) };
  } else {
    mealDraft = { name:'Meal', time:'',
      foods: s.combo.map(c=>({ name:c.food.name, basis:'per100', amount:String(c.amount),
        kcal:String(c.food.kcal), p:String(c.food.p), c:String(c.food.c), f:String(c.food.f) })) };
  }
  openModal('addMeal');
}

  dayMeals().meals.push(m);
  // update usage count and recency so it floats to the top
  const hit = (state.mealLib||[]).find(x=>x.name===src.name);

}

/* Most-used meals the user hasn't already logged today — up to 5, sorted by
   frequency then recency. Shown above "+ Add meal" as one-tap shortcuts. */
function recentMealsRow(){
  const lib = (state.mealLib||[]);
  if(!lib.length) return '';
  const todayNames = new Set(dayMeals().meals.map(m=>m.name));
  const candidates = lib
    .filter(m=>!todayNames.has(m.name))
    .sort((a,b)=>{
      const cd=(b.count||1)-(a.count||1);
      if(cd!==0) return cd;
      return (b.lastISO||'') > (a.lastISO||'') ? 1 : -1;
    })
    .slice(0,5);
  if(!candidates.length) return '';
  return `<div class="recent-meals">
    <div class="recent-label">Quick re-log</div>
    ${candidates.map(m=>`
      <div class="recent-row" onclick="relogMeal(${JSON.stringify(m).replace(/"/g,'&quot;')})">

        <div class="recent-macros">${Math.round(m.kcal)} kcal · ${Math.round(m.p)}P · ${Math.round(m.c)}C · ${Math.round(m.f)}F</div>

}

function tplPrebuiltList(){
  const f = state.tplFilter || (state.tplFilter = { q:'', goal:'All', dpw:'All', equip:'All', exp:'All' });
  const match = x=>{
    const M = x.meta || {};
    if(f.goal!=='All' && !(M.goal||[]).includes(f.goal)) return false;
    if(f.exp!=='All' && M.exp!==f.exp) return false;
    if(f.equip!=='All' && M.equip!==f.equip) return false;
    if(f.dpw!=='All'){
      const d = M.dpw || x.days.length;
      if(f.dpw==='2-3' && !(d<=3)) return false;
      if(f.dpw==='4' && d!==4) return false;
      if(f.dpw==='5+' && !(d>=5)) return false;
    }
    if(f.q){
      const hay = (x.name+' '+x.tag+' '+x.level+' '+((M.principles||[]).join(' '))+' '+((M.goal||[]).join(' '))).toLowerCase();
      if(!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  };
  const list = PREBUILT.filter(match);
  const grp = (label, key, opts)=>`
    <div class="fgroup"><span class="fglabel">${label}</span>

function tplPrebuiltRows(){
  const f = state.tplFilter || (state.tplFilter = { q:'', goal:'All', dpw:'All', equip:'All', exp:'All' });
  const match = x=>{
    const M = x.meta || {};
    if(f.goal!=='All' && !(M.goal||[]).includes(f.goal)) return false;
    if(f.exp!=='All' && M.exp!==f.exp) return false;
    if(f.equip!=='All' && M.equip!==f.equip) return false;
    if(f.dpw!=='All'){
      const d = M.dpw || x.days.length;
      if(f.dpw==='2-3' && !(d<=3)) return false;
      if(f.dpw==='4' && d!==4) return false;
      if(f.dpw==='5+' && !(d>=5)) return false;
    }
    if(f.q){
      const hay = (x.name+' '+x.tag+' '+x.level+' '+((M.principles||[]).join(' '))+' '+((M.goal||[]).join(' '))).toLowerCase();
      if(!hay.includes(f.q.toLowerCase())) return false;
    }
    return true;
  };
  const list = PREBUILT.filter(match);
  const anyFilter = f.goal!=='All'||f.dpw!=='All'||f.equip!=='All'||f.exp!=='All'||f.q;
  return `
    <div class="fcount">${list.length} of ${PREBUILT.length} programs${anyFilter? ` <span class="fclear" onclick="clearTplFilter()">clear filters</span>`:''}</div>
    ${list.length? list.map(x=>{

          <div class="meta">
            <span class="pill">${M.dpw||x.days.length} DAYS</span>
            <span class="pill">${(M.exp||x.level).toUpperCase()}</span>
            ${M.mins? `<span class="pill">~${M.mins} MIN</span>`:''}
            ${M.equip && M.equip!=='Full gym'? `<span class="pill">${M.equip.toUpperCase()}</span>`:''}
            ${isOn?'<span class="pill on">ACTIVE</span>':''}
          </div>
          ${M.principles? `<div class="tplprin">${M.principles.map(pr=>`<span>${pr}</span>`).join('')}</div>`:''}
        </div>
        <span class="arrow">›</span>
      </div>`;
    }).join('') : `<div class="emptystate" style="padding:26px 18px;"><div class="t">No programs match those filters.<br><span class="fclear" onclick="clearTplFilter()">Clear them</span> to see all ${PREBUILT.length}.</div></div>`}

  const name = (exSearch||'').trim();

  const dup = [...(EXDB[muscle]||[]), ...state.customEx[muscle]].some(n=>n.toLowerCase()===name.toLowerCase());
  if(!dup) state.customEx[muscle].push(name);

function pickExercise(muscle, name){
  if(workoutAddMode){
    const { plan, locked } = getActivePlan();
    if(plan && !locked){
      const t = tierOf(muscle);
      plan.days[state.dayIdx].exercises.push({ id: uid('ce'), muscle, name, unit:'kg', target:`${t.lo}–${t.hi} reps`, sets:[{w:null,r:null},{w:null,r:null},{w:null,r:null}] });
    }
    workoutAddMode = false;
    closeModal(); render();
    return;
  }
  if(swapTarget){
    const { plan, locked } = getActivePlan();
    if(plan && !locked){
      const ex = plan.days[swapTarget.di].exercises[swapTarget.ei];
      const old = ex.name;
      ex.name = name; ex.muscle = muscle;
      const t = tierOf(muscle);
      ex.target = `${t.lo}–${t.hi} reps`;
      // A swap is a genuinely different exercise/machine, so it must NOT inherit
      // the previous machine's load. Seed from THIS exercise's own last logged
      // weight if you've done it before, otherwise leave it blank. We keep the
      // slot id (so past weeks' records are untouched) but mark the exercise as
      // introduced THIS week, which tells the set row to ignore the old slot's
      // prior-week numbers when suggesting. The coach's own suggestion is already
      // name-based, so it targets the new exercise correctly.
      if(name !== old) ex.freshWeek = state.week; else delete ex.freshWeek;
      const own = (name !== old) ? lastLoggedWeight(name) : { w:null, r:null };
      const seed = own.w;
      ex.sets.forEach(s=>{ s.w = seed; });
      let noteTxt = `Swapped in for ${old}.` + (seed!=null
        ? ` Start ${seed} ${ex.unit} from your last ${name}.`
        : ` No history for this one yet \u2014 find a working weight in the ${t.lo}\u2013${t.hi} rep range.`);
      const nk = `${state.active.id}|w${state.week}|d${swapTarget.di}|${ex.id}`;
      state.notes[nk] = (state.notes[nk]? state.notes[nk]+' ' : '') + noteTxt;
    }
    swapTarget = null;
    closeModal(); render();
    return;
  }
  const plan = state.templates.custom.find(p=>p.id===state.templates.selectedCustomId);
  const t = tierOf(muscle);
  plan.days[cuDayIdx].exercises.push({ id: uid('ce'), muscle, name, unit:'kg', target:`${t.lo}–${t.hi} reps`, sets:[{w:null,r:null},{w:null,r:null},{w:null,r:null}] });
  closeModal(); render();
}
